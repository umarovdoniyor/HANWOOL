<!-- 알림센터 -->

<!DOCTYPE html>
<html style="overflow-x:hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}

<!-- Content Area -->
<div class="row p-4">

    <!-- 게시물 목록 -->
    <div class="col-12">
        <div class="row gx-4">

            <!-- 상단 메뉴바 -->
            <div class="col-xxl-12">
                <div class="d-inline-block align-items-center mb-3" style="font-size: 20px; color: #2a3040; cursor: pointer; font-weight: 1000;" onclick="refresh()">
                    <i class="fa-solid fa-bell me-2"></i>알림센터
                    <i class="fa-regular fa-circle-question fa-2xs" style="vertical-align: super;" data-toggle="tooltip" data-placement="top" onclick="event.stopPropagation();"
                    title="• 토스트 오피스에서 발생하는 알림내역의 기록을 볼 수 있습니다..<br>• 알림 삭제/읽음/안읽음 처리 등 관리하실 수 있습니다."></i>
                </div>
            </div>

            <!-- 좌측 메뉴 -->
            <div class="col-md-3 col-xl-2">
                <div class="card border border-light">
                    <div class="card-body bg-white p-3">
                        <div class="d-flex w-100 gap-2" style="overflow-x: hidden;">
                            <button type="button" class="btn btn-success text-nowrap px-2" style="flex: 1;" onclick="noti_read_mass_update('all')">
                                <i class="fa-solid fa-check fa-lg me-2"></i>전체 읽음
                            </button>
                            <button type="button" class="btn btn-danger text-nowrap px-2" style="flex: 1;" onclick="noti_mass_delete('all')">
                                <i class="fa-solid fa-trash-can fa-lg me-2"></i>전체 삭제
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card border border-light">
                    <div class="card-body">
                        <small class="text-muted text-uppercase align-middle font-size-12 mb-1">Notification Check</small>
                        <div class="d-flex flex-md-column font-size-14 gap-1 p-1 mb-2 mb-md-3">
                            <label class="d-flex align-items-center text-nowrap me-3 mb-0 hover-secondary" style="cursor: pointer;" id="allBox">
                                <i class="fa-solid fa-envelope me-2 text-secondary"></i>전체 알림</label>
                            <label class="d-flex align-items-center text-nowrap me-3 mb-0 hover-success" style="cursor: pointer;" id="unreadBox">
                                <i class="fa-solid fa-envelope me-2 text-success"></i>미확인 알림</label>
                            <label class="d-flex align-items-center text-nowrap me-3 mb-0 hover-primary" style="cursor: pointer;" id="readBox">
                                <i class="fa-solid fa-envelope me-2 text-primary"></i>확인 알림</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 우측 본문 -->
            <div class="col-md-9 col-xl-10">
                <div class="card border border-light">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-3">
                            <div class="d-flex p-0">
                                <div class="d-none d-md-inline btn btn-secondary text-nowrap me-1 px-2.5" onclick="refresh()"
                                     data-toggle="tooltip" data-placement="top" title="새로고침 (F5)">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </div>

                                <select class="d-none d-md-inline page_size form-select form-select-sm me-1" id="a_page_size"
                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="리스트에서 표시할 수량">
                                    <option value="10">10개</option>
                                    <option value="20" selected>20개</option>
                                    <option value="50">50개</option>
                                    <option value="100">100개</option>
                                    <option value="200">200개</option>
                                    <option value="500">500개</option>
                                </select>

                                <div class="d-none d-md-flex input-group input-daterange w-auto me-1"
                                     data-toggle="tooltip" data-placement="top" title="알림 수신일로 검색">
                                    <input id="fr_date" type="text" placeholder="시작일 검색" onchange="a_search_ready()" autocomplete="off"
                                           class="form-control date_flatpickr border border-secondary" style="max-width: 120px;">
                                    <input id="to_date" type="text" placeholder="종료일 검색" onchange="a_search_ready()" autocomplete="off"
                                           class="form-control date_flatpickr border border-secondary" style="max-width: 120px;">
                                </div>

                                <div class="search-box d-flex me-1">
                                    <div class="position-relative flex-grow-1" data-toggle="tooltip" data-placement="top" title="알림 내용으로 텍스트 검색">
                                        <input type="text" class="form-control rounded border-secondary" id="all_sch" placeholder="검색어 입력">
                                        <i class="mdi mdi-magnify search-icon"></i>
                                    </div>
                                </div>

                                <button class="btn btn-secondary text-nowrap me-1 px-2.5" onclick="a_search_ready()">
                                    <i class="fa-solid fa-magnifying-glass"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">검색</span>
                                </button>
                            </div>

                            <div class="d-flex p-0">
                                <button class="btn btn-info text-nowrap ms-1 px-2.5" onclick="noti_read_mass_update('selected', 'unread')">
                                    <i class="fa-solid fa-square-envelope"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">선택 안읽음처리</span>
                                </button>
                                <button class="btn btn-success text-nowrap ms-1 px-2.5" onclick="noti_read_mass_update('selected', 'read')">
                                    <i class="fa-solid fa-envelope-circle-check"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">선택 읽음처리</span>
                                </button>
                                <button class="btn btn-danger text-nowrap ms-1 px-2.5" onclick="noti_mass_delete('selected')">
                                    <i class="fa-solid fa-trash-can"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">선택 삭제</span>
                                </button>
                            </div>
                        </div>

                        <div class="custom_table table-responsive text-nowrap align-middle">
                            <table class="table">
                                <colgroup>
                                    <col style="width: 1%;">
                                    <col style="width: 9%;">
                                    <col style="width: 90%;">
                                </colgroup>
                                <thead class="thead-light">
                                    <tr class="text-nowrap">
                                        <th id="check_box" style="text-align: center; vertical-align: middle;" class="form-check-info min_width">
                                            <input class="form-check-input checkbox_lg" type="checkbox" id="select_all"></th>
                                        <th>알림 수신일</th>
                                        <th>알림 내용</th>
                                    </tr>
                                </thead>
                                <tbody id="a_tbody"></tbody>
                            </table>
                            <div class="div_center" id="a_nation_id"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
let fr_date;
let to_date;
let all_sch;
let action_filter;
let status_filter;
let notibox_filter;

let a_nation_data = {
    cname: 'a_nation',  // 인스턴스 명과 일치해야함
    nation_id: 'a_nation_id',
    range: 5,
    page_size: 20,  // 세로 Row 수
};
let a_nation = new Nations(a_nation_data, a_search); // 인스턴스 명
a_nation.nation_display({});

$('#a_page_size').on('change', function () {
    localStorage.setItem('noti_list_page_size', $(this).val());
});

window.onkeydown = function (event) {
    if (event.keyCode == 116) {  // F5
        event.returnValue = false;
        refresh();
    }
}

document.getElementById("all_sch").addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
        a_search_ready();
    }
});

function refresh() {
    window.location.href = '{% url 'noti_list_page' %}';
}

$(function () {
    let savedPageSize = localStorage.getItem('noti_list_page_size');
    if (savedPageSize) { $('#a_page_size').val(savedPageSize);}
    
    main();
});

function main() {
    set_autocomplete('off');
    init_date_flatpickr();
    a_search_ready();
}

// 필터 버튼 작동부
$(document).ready(function () {
    $("#allBox").on("click", function () {
        toggleNotiboxFilter($(this), 'allBox', 'bg-secondary-subtle-50', true);
    });

    $("#unreadBox").on("click", function () {
        toggleNotiboxFilter($(this), 'unreadBox', 'bg-success-subtle-50', true);
    });

    $("#readBox").on("click", function () {
        toggleNotiboxFilter($(this), 'readBox', 'bg-primary-subtle-50', true);
    });

    $('#select_all').on('change', function (e) {
        let checked = $(this).is(':checked');
        $('.td_chk_box').each(function () {
            $(this).prop('checked', checked);
            $(this).closest('tr').toggleClass('bg-light', checked);
        });
    });
});

// 결재함 필터 (하나만 선택 가능)
function toggleNotiboxFilter($element, filterType, highlightClass) {
    notibox_filter = filterType;
    $("#allBox").removeClass("bg-secondary-subtle-50").find("i").removeClass("fa-envelope-open").addClass("fa-envelope");
    $("#unreadBox").removeClass("bg-success-subtle-50").find("i").removeClass("fa-envelope-open").addClass("fa-envelope");
    $("#readBox").removeClass("bg-primary-subtle-50").find("i").removeClass("fa-envelope-open").addClass("fa-envelope");
    $element.addClass(highlightClass);
    $element.find("i").removeClass("fa-envelope").addClass("fa-envelope-open");

    a_search_ready();
}

function a_search_ready() {
    a_nation.page = 1;
    a_nation_data.page_size = $("#a_page_size").val();

    fr_date = $('#fr_date').val();
    to_date = $('#to_date').val();
    all_sch = $('#all_sch').val();

    a_search();
}

function a_search() {
    let query = "?page=" + a_nation.page + "&page_size=" + a_nation_data.page_size;
    if (fr_date) { query += "&fr_date=" + fr_date; }
    if (to_date) { query += "&to_date=" + to_date; }
    if (all_sch) { query += "&all_sch=" + all_sch; }
    if (notibox_filter) { query += "&notibox_filter=" + notibox_filter; }

    fetch_gp("/noti_list_fn/" + query, 'GET', true, {}, (done) => {
        a_draw_table(done);
    });
}

function a_draw_table(done) {
    // console.log("a_draw_table: ", done);

    let data = done.results;
    if (data.length === 0) {
        let emptyRow = `
        <tr>
            <td colspan="99" style="text-align: center;">등록된 데이터가 없습니다.</td>
        </tr>`;
        $('#a_tbody').html(emptyRow);
        return;
    }

    let num = ((a_nation.page - 1) * a_nation_data.page_size) + 1;
    let rows = "";
    for (let i = 0; i < data.length; i++) {
        let item = data[i];
        let unreadClass = item.is_read ? '' : 'bg-success-subtle';

        const createdAt = item.created_at || "";
        const [date, time] = createdAt.split(" ");

        let row = `
        <tr id='${item.id}' data-url='${item.url}' class='align-middle text-nowrap ${unreadClass}' style='cursor:pointer;'>
            <td name="check_box" class="form-check-info" style="text-align: center; vertical-align: middle; cursor: default !important;">
                <input type="checkbox" class="form-check-input checkbox_lg td_chk_box" value="${item.id}"></td>
            <td name='created_at' class="clickable font-size-12 py-1">
                <div class="clickable">${date}</div><div class="clickable">${time}</div>
            </td>
            <td name='message' class="clickable font-size-12 py-1">
                <div class="clickable fw-bold">${item.message || ""}</div>
                <div class="clickable text-muted fw-normal">${item.content || ""}</div>
            </td>
            <td name='noti_type' class="d-none">${item.noti_type || ""}</td>
            <td name='url' class="d-none">${item.url || ""}</td>
        </tr>`;
        rows += row;
    }
    a_nation.nation_display(done);
    $('#a_tbody').html(rows);
    
    $('#a_tbody').on('click', '.td_chk_box', function (e) {
        e.stopPropagation();  // 부모 `tr` 클릭 이벤트 중단
        let row = $(this).closest('tr'); // 체크박스가 속한 행 선택
        if (this.checked) {
            row.addClass('bg-light');  // 체크되었을 때 배경색 변경
        } else {
            row.removeClass('bg-light');  // 체크 해제 시 배경색 제거
        }
    });

    $('#a_tbody').off('click', 'tr');  // 기존 바인딩 제거
    $('#a_tbody').on('click', 'tr', function (e) {
        // 클릭한 요소가 체크박스이거나 클릭 가능한 열이 아닌 경우 이벤트를 중단
        if (e.target.type === 'checkbox' || !$(e.target).hasClass('clickable')) return;

        $(this).parent().find('tr').removeClass('clicked');
        $(this).addClass('clicked');

        let clicked_id = $(this).attr("id");
        let clicked_url = $(this).data("url");
        noti_read_update(clicked_id, 'read');
        url_click_request(clicked_url);
    });
}

// change_type은 read(읽음처리) / unread(안읽음처리)
function noti_read_mass_update(change_range, change_type) {
    const selected = $('.td_chk_box:checked');

    if (change_range !== 'all' && selected.length === 0) {
        notiToast("선택된 항목이 없습니다.");
        return;
    }

    const ids = [];
    selected.each(function () {
        ids.push($(this).val());
    });

    let api_data = new FormData();
        api_data.append("noti_ids", JSON.stringify(ids));
        api_data.append("change_range", change_range);
        api_data.append("change_type", change_type);

    fetch_gp('/noti_read_mass_update_fn/', 'post', true, api_data, (done) => {
        $('#select_all').prop('checked', false);
        a_search_ready();
        if (window.parent && typeof window.parent.noti_search === 'function') {
            window.parent.noti_search();
        }
        notiToast(`선택한 알림 ${done.count}건이 변경되었습니다.`)
    });
}

function noti_mass_delete(change_range) {
    const selected = $('.td_chk_box:checked');

    if (change_range !== 'all' && selected.length === 0) {
        notiToast("선택된 항목이 없습니다.");
        return;
    }

    const ids = [];
    selected.each(function () {
        ids.push($(this).val());
    });

    let api_data = new FormData();
        api_data.append("noti_ids", JSON.stringify(ids));
        api_data.append("change_range", change_range);

    fetch_gp('/noti_mass_delete_fn/', 'post', true, api_data, (done) => {
        $('#select_all').prop('checked', false);
        a_search_ready();
        if (window.parent && typeof window.parent.noti_search === 'function') {
            window.parent.noti_search();
        }
        notiToast(`선택한 알림 ${done.count}건이 삭제되었습니다.`)
    });
}

</script>
