<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let fr_date;
let to_date;
let all_sch;
let sch_subsidiary;
let sch_customer;
let sch_is_salary_date;

let a_nation_data = {
    cname: 'a_nation',  // 인스턴스 명과 일치해야함
    nation_id: 'a_nation_id',
    range: 5,
    page_size: 20,  // 세로 Row 수
};
let a_nation = new Nations(a_nation_data, a_search); // 인스턴스 명
a_nation.nation_display({});

$('#a_page_size').on('change', function () {
    localStorage.setItem('salary_monthly_claim_page_size', $(this).val());
});

window.onkeydown = function (event) {
    if (event.keyCode == 116) {  // F5
        event.returnValue = false;
        refresh();
    }
}

document.getElementById("all_sch").addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
        a_search_ready();
    }
});

function refresh() {
    window.location.href = window.location.href
}

$(function () {
    let savedPageSize = localStorage.getItem('salary_monthly_claim_page_size');
    if (savedPageSize) { $('#a_page_size').val(savedPageSize);}

    main();
});

function main() {
    set_autocomplete('off');
    init_date_flatpickr();
    init_Select2('#sch_subsidiary', '관리법인 검색', '/sel2_hanwool_subsidiary/', {id: 'id', txt: item => `${item.text}`});
    init_Select2('#sch_customer', '센터 검색', '/sel2_hanwool_customer/', {id: 'id', txt: item => `${item.text}`});

    a_search_ready();
    $('#input_salary_date').val(date_today_str)
}

$(document).ready(function () {
    $('#select_all').on('change', function (e) {
        let checked = $(this).is(':checked');
        $('.td_chk_box').each(function () {
            $(this).prop('checked', checked);
            $(this).closest('tr').toggleClass('bg-light', checked);
        });
    });
});

function a_search_ready() {
    a_click_id = null;
    a_nation.page = 1;
    a_nation_data.page_size = $("#a_page_size").val();

    fr_date = $('#fr_date').val();
    to_date = $('#to_date').val();
    all_sch = $('#all_sch').val();
    sch_subsidiary = $('#sch_subsidiary').val();
    sch_customer = $('#sch_customer').val();
    sch_is_salary_date = $('#sch_is_salary_date').val();

    a_search();
}

function a_search() {
    let query = "?page=" + a_nation.page + "&page_size=" + a_nation_data.page_size;
    if (all_sch) { query += "&all_sch=" + all_sch; }
    if (fr_date) { query += "&fr_date=" + fr_date; }
    if (to_date) { query += "&to_date=" + to_date; }
    if (sch_subsidiary) { query += "&sch_subsidiary=" + sch_subsidiary; }
    if (sch_customer) { query += "&sch_customer=" + sch_customer; }
    if (sch_is_salary_date) { query += "&sch_is_salary_date=" + sch_is_salary_date; }

    fetch_gp("/daily_worker_list_fn/" + query, 'GET', true, {}, (done) => {
        a_draw_table(done);
    });
}

function a_draw_table(done) {
    // console.log("a_draw_table: ", done);

    let data = done.results;
    if (data.length === 0) {
        let emptyRow = `
        <tr>
            <td colspan="99" style="text-align: center;" class="no_data">등록된 데이터가 없습니다.</td>
        </tr>`;
        $('#a_tbody').html(emptyRow);
        return;
    }

    let num = ((a_nation.page - 1) * a_nation_data.page_size) + 1;
    let rows = "";
    for (let i = 0; i < data.length; i++) {
        let item = data[i];

        let row = `
        <tr id='${item.id}' class='align-middle text-nowrap'>
            {% comment %}<td name="check_box" class="form-check-info p-2" style="text-align: center; vertical-align: middle;">
                ${!item.salary_date ? `<input type="checkbox" class="form-check-input checkbox_lg td_chk_box" value="${item.id}">` : ""}
            </td>{% endcomment %}
            <td>${num + i}</td>
            <td>${item.work_order_date || ""}</td>
            <td>${item.subsidiary_name || ""}</td>
            <td>${item.customer_name || ""}</td>
            <td>${item.user.name || ""}</td>
            <td>${item.user.rrn || ""}</td>
            <td>${item.user.bank_name || ""}</td>
            <td>${item.user.account_code || ""}</td>
            <td>${item.user.account_name || ""}</td>
            <td>${formatNumber(item.pre_result_price, 2) || ""}</td>
            <td>${formatNumber(item.tax, 2) || ""}</td>
            <td>${formatNumber(item.result_price, 2) || ""}</td>
            {% comment %}<td>${item.salary_date || ""}</td>{% endcomment %}
        </tr>`;
        rows += row;
    }

    a_nation.nation_display(done);
    $('#a_tbody').html(rows);

    $('#a_tbody').on('click', '.td_chk_box', function (e) {
        let row = $(this).closest('tr'); // 체크박스가 속한 행 선택
        if (this.checked) {
            row.addClass('bg-light');  // 체크되었을 때 배경색 변경
        } else {
            row.removeClass('bg-light');  // 체크 해제 시 배경색 제거
        }
    });
}


function update_status() {
    let salary_date = $('#input_salary_date').val();
    if (!salary_date) {
        alert("입금일자를 입력하세요.");
        return;
    }

    let checkedBoxes = $('.td_chk_box:checked');
    if (checkedBoxes.length === 0) {
        alert("항목을 선택하세요.");
        return;
    }
    
    if (!confirm(`선택된 항목의 입금일자(${salary_date})를 등록하시겠습니까?`)) return;

    let salary_data = [];
    checkedBoxes.each(function () {
        salary_data.push({
            worker_id: $(this).val(),
            salary_date: salary_date
        });
    });
    
    let api_data = new FormData();
        api_data.append('salary_data', JSON.stringify(salary_data));

    fetch_gp('/daily_worker_salary_date/', 'post', true, api_data, (done) => {
        a_search_ready();
        alert("입금일자가 저장되었습니다.");
    });
}


function checkNumber(obj, cnt = 0) {
    let val = $(obj).val().replace(/[^0-9.\-]/g, '');

    if (val.startsWith('-')) {
        val = '-' + val.slice(1).replace(/-/g, '');
    } else {
        val = val.replace(/-/g, '');
    }

    obj.value = formatNumber(val, cnt);
}

function formatNumber(val, cnt = 0) {
    if (val == null) return '';  // null, undefined 방지
    val = String(val);           // 문자열 강제 변환

    if (!val || val === '-' || val === '.' || val === '-.') return val;

    const [intPart, decPart] = val.split('.');
    const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    // 사용자가 소수점 입력했을 때만 소수점 표시
    if (val.includes('.') && cnt > 0) {
        return `${intFormatted}.${(decPart || '').slice(0, cnt)}`;
    }

    return intFormatted;
}

function del_comma(val) {
    return typeof val === 'string' ? val.replace(/,/g, '') : val;
}


function formatDate(date) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
}

// 데이트 필터 드랍다운 이벤트
$('#date_filter').on('mouseenter', function () {
    $('#date_dropdown').removeClass('d-none');
});
$('#date_filter').on('mouseleave', function () {
    $('#date_dropdown').addClass('d-none');
});

function set_date_range(range) {
    const today = new Date();
    let start, end;

    if (range === 'yesterday') {
        start = end = new Date(today);
        start.setDate(today.getDate() - 1);
        end.setDate(today.getDate() - 1);
    } else if (range === 'today') {
        start = end = new Date(today);
    } else if (range === 'tomorrow') {
        start = end = new Date(today);
        start.setDate(today.getDate() + 1);
        end.setDate(today.getDate() + 1);
    } else if (range === 'last_week') {
        const day = today.getDay() || 7;
        end = new Date(today);
        end.setDate(today.getDate() - day);
        start = new Date(end);
        start.setDate(end.getDate() - 6);
    } else if (range === 'this_week') {
        const day = today.getDay() || 7;
        start = new Date(today);
        start.setDate(today.getDate() - day + 1);
        end = new Date(start);
        end.setDate(start.getDate() + 6);
    } else if (range === 'next_week') {
        const day = today.getDay() || 7;
        start = new Date(today);
        start.setDate(today.getDate() - day + 8);
        end = new Date(start);
        end.setDate(start.getDate() + 6);
    } else if (range === 'last_month') {
        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        end = new Date(today.getFullYear(), today.getMonth(), 0);
    } else if (range === 'this_month') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    } else if (range === 'next_month') {
        start = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        end = new Date(today.getFullYear(), today.getMonth() + 2, 0);
    }

    else if (range === 'last_year') {
        start = new Date(today.getFullYear() - 1, 0, 1);
        end = new Date(today.getFullYear() - 1, 11, 31); }

    else if (range === 'this_year') {
        start = new Date(today.getFullYear(), 0, 1);
        end = new Date(today.getFullYear(), 11, 31); }

    else if (range === 'next_year') {
        start = new Date(today.getFullYear() + 1, 0, 1);
        end = new Date(today.getFullYear() + 1, 11, 31); }


    $('#fr_date').val(formatDate(start));
    $('#to_date').val(formatDate(end));
    a_search_ready();
}

        return;
    }

    sch_subsidiary = $('#sch_subsidiary').val();
    if (sch_subsidiary == null) {
        sch_subsidiary = ""
    }
    sch_customer = $('#sch_customer').val();
    if (sch_customer == null) {

    }

    let query = "?fr_date=" + fr_date + "&to_date=" + to_date + "&sch_subsidiary=" + sch_subsidiary + "&sch_customer=" + sch_customer;
    window.location.href = '/monthly_claim_report_excel_export/' + query;
}

    let query = "?fr_date=" + fr_date + "&to_date=" + to_date + "&sch_subsidiary=" + sch_subsidiary + "&sch_customer=" + sch_customer;

function bank_excel_export() {
    let fr_date = $('#fr_date').val();

        return;
    }

    let to_date = $('#to_date').val();
    if (!to_date) {
        alert("선택된 검색 종료일이 없습니다");
        return;
    }
    
    sch_subsidiary = $('#sch_subsidiary').val();
    if (!sch_subsidiary) {
        alert("선택된 관리법인이 없습니다");
        return;
    }
    sch_customer = $('#sch_customer').val();
    if (sch_customer == null) {
        sch_customer = ""
    }

    let query = "?fr_date=" + fr_date + "&to_date=" + to_date + "&sch_subsidiary=" + sch_subsidiary + "&sch_customer=" + sch_customer;
    window.location.href = '/monthly_claim_bank_excel_export/' + query;
