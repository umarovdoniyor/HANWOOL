<!-- 거래처/현장관리 > 실적/투입관리 > 센터별 인원기준-->

<!DOCTYPE html>
<html style="overflow-x:hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}

<style>
.sub_title {
    color: rgba(42,48,64,0.4);
    font-size: 20px;
    cursor: pointer;
    font-weight: 1000;
    transition: color 0.2s;
}
.sub_title:hover {
    color: #2a3040;
}

</style>

<!-- Content Area -->
<div class="row p-4">

    <!-- 게시물 목록 -->
    <div class="col-12">
        <div class="row gx-4">

            <!-- 상단 메뉴바 -->
            <div class="col-12">
                <div class="d-flex justify-content-between">
                    <div class="d-inline-block align-items-center mb-3" style="font-size: 20px; color: #2a3040; cursor: pointer; font-weight: 1000;" onclick="refresh()">
                        <i class="fa-solid fa-chart-line me-2"></i>실적/투입관리 <i class="fa-solid fa-angle-right px-1"></i> 센터별 인원 기준
                    </div>

                    <div class="d-flex">
                        <div class="d-inline-block align-items-center mb-3 sub_title" onclick="window.location.href='{% url 'team_performance_page' %}'">
                             팀별 인원 기준
                        </div>
                        <div class="d-inline-block align-items-center mb-3 mx-3" style="color: rgba(42,48,64,0.4); font-size: 20px; font-weight: 1000;"> | </div>
                        <div class="d-inline-block align-items-center mb-3 sub_title" onclick="window.location.href='{% url 'performance_page' %}'">
                             센터별 매출 기준
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="card border border-light">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-3">
                            <div class="d-flex p-0">
                                <div class="d-none d-md-inline btn btn-secondary text-nowrap me-1 px-2.5" onclick="refresh()"
                                     data-toggle="tooltip" data-placement="top" title="새로고침 (F5)">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </div>

                                <select class="page_size form-select form-select-sm me-1" id="a_year_filter" onchange="a_search_ready()">
                                    {% for year in year_range %}
                                        <option value="{{ year }}" {% if year == default_year %}selected{% endif %}>{{ year }}년</option>
                                    {% endfor %}
                                </select>

                                <button class="btn btn-secondary text-nowrap me-1 px-2.5" onclick="a_search_ready()">
                                    <i class="fa-solid fa-magnifying-glass"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">검색</span>
                                </button>
                            </div>

                            <div class="d-flex p-0">
                                <button class="btn btn-success text-nowrap ms-1 px-2.5" onclick="exportToExcel()">
                                    <i class="fa-solid fa-file-excel"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">엑셀 다운로드</span>
                                </button>
                            </div>
                        </div>

                        <!-- 본문 영역 -->
                        <div class="col-12">
                            <!-- 그래프 영역 -->
                            <div class="card border border-light">
                                <div class="card-body">
                                    <div class="" id="a_graph" style="height: 330px; max-height: 330px; margin-left: -10px;"></div>
                                </div>
                            </div>

                            <!-- 테이블 영역 -->
                            <div class="custom_table table-responsive text-nowrap">
                                <table class="table">
                                    <thead class="thead-light">
                                        <tr class="text-nowrap">
                                            <th>순번</th>
                                            <th>센터</th>
                                            <th>1월</th>
                                            <th>2월</th>
                                            <th>3월</th>
                                            <th>4월</th>
                                            <th>5월</th>
                                            <th>6월</th>
                                            <th>7월</th>
                                            <th>8월</th>
                                            <th>9월</th>
                                            <th>10월</th>
                                            <th>11월</th>
                                            <th>12월</th>
                                            <th>합 계</th>
                                        </tr>
                                    </thead>
                                    <tbody id="a_tbody"></tbody>
                                </table>
                                <div class="div_center mt-3" id="a_nation_id"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let a_year_filter;

window.onkeydown = function (event) {
    if (event.keyCode == 116) {  // F5
        event.returnValue = false;
        refresh();
    }
}

function refresh() {
    let baseUrl = window.location.origin + window.location.pathname;
    window.location.href = baseUrl;
}

$(function () {
    main();
});

function main() {
    set_autocomplete('off');
    init_date_flatpickr();

    a_search_ready();
}

function select_this_year() {
    let selectElement = document.getElementById("a_year_filter");
    let currentYear = new Date().getFullYear();

    for (let i = 0; i < selectElement.options.length; i++) {
        if (selectElement.options[i].value == currentYear) {
            selectElement.selectedIndex = i;
            break;
        }
    }
}

// 선택대상 초기화 : 주로 create, delete 후 호출
function a_search_ready() {
    a_click_id = null;

    a_year_filter = $("#a_year_filter").val();

    a_search();
}

// 선택대상 유지 : 주로 update 후 호출
function a_search() {
    let query = "?";
    if (a_year_filter) { query += "&a_year_filter=" + a_year_filter; }

    fetch_gp("/customer_human_performance_data_fn/" + query, 'GET', true, {}, (done) => {
        a_draw_table(done);
        a_draw_graph(done.groups);
    });
}


function a_draw_table(done) {
    const groups = done.groups;
    if (!groups || groups.length === 0) {
        $('#a_tbody').html(`
            <tr class="empty-row">
                <td colspan="99" style="text-align: center;">월별 인원 데이터가 없습니다.</td>
            </tr>`);
        return;
    }

    let rows = '';
    let idx = 1;
    const monthKeys = Array.from({ length: 12 }, (_, i) => String(i + 1));

    for (const g of groups) {
        rows += `<tr class="align-middle text-nowrap">
            <td>${idx++}</td>
            <td>${g.name}</td>`;

        let rowTotalReq = 0;
        let rowTotalIn = 0;

        for (const m of monthKeys) {
            const val = g.monthly[m] || {req: 0, in: 0};
            rowTotalReq += val.req;
            rowTotalIn += val.in;

            const cls = (val.in < val.req) ? 'text-danger' : '';
            rows += `<td class="${cls}">${val.req} / ${val.in}</td>`;
        }

        let totalCls = '';
        if (rowTotalIn < rowTotalReq) totalCls = 'text-danger';
        rows += `<td class="fw-bold ${totalCls}">${rowTotalReq} / ${rowTotalIn}</td></tr>`;
    }

    // 합계 행
    let totalRow = `<tr class="table-warning text-nowrap fw-bold" style="background-color:#f8f9fa;">
        <td></td>
        <td>합 계</td>`;

    let grandReq = 0, grandIn = 0;
    for (const m of monthKeys) {
        let monthReq = 0, monthIn = 0;
        for (const g of groups) {
            const val = g.monthly[m] || {req: 0, in: 0};
            monthReq += val.req;
            monthIn += val.in;
        }
        grandReq += monthReq;
        grandIn += monthIn;

        const cls = (monthIn < monthReq) ? 'text-danger' : '';
        totalRow += `<td class="${cls}">${monthReq} / ${monthIn}</td>`;
    }
    totalRow += `<td>${grandReq} / ${grandIn}</td></tr>`;

    rows += totalRow;
    $('#a_tbody').html(rows);
}


function a_draw_graph(groups) {
    const container = document.querySelector("#a_graph");
    if (!container) return;

    if (!Array.isArray(groups) || groups.length === 0) {
        container.innerHTML = `
            <div class='d-flex justify-content-center align-items-center text-muted' style='height:100%; min-height:200px;'>
                등록된 데이터가 없습니다.
            </div>`;
        return;
    }

    const monthKeys = Array.from({ length: 12 }, (_, i) => `${i + 1}월`);
    let reqData = Array(12).fill(0);
    let inData = Array(12).fill(0);

    // 전체 고객사 합계
    groups.forEach(g => {
        for (let i = 0; i < 12; i++) {
            const m = String(i + 1);
            const val = g.monthly[m] || {req: 0, in: 0};
            reqData[i] += val.req;
            inData[i] += val.in;
        }
    });

    container.innerHTML = `<div id="a_graph_chart"></div>`;
    const chartEl = document.querySelector("#a_graph_chart");

    if (window.human_chart instanceof ApexCharts) {
        window.human_chart.destroy();
    }

    const chartOptions = {
        series: [
            { name: '투입 인원', type: 'column', data: inData },
            { name: '요청 인원', type: 'line', data: reqData }
        ],
        chart: {
            height: 330,
            type: 'line',
            toolbar: { show: false }
        },
        stroke: {
            width: [0, 3]   // 막대(0), 라인(3)
        },
        plotOptions: {
            bar: {
                columnWidth: '25%',
                borderRadius: 4,
                dataLabels: {
                    position: 'top'  // 막대 위에 값 표시
                }
            }
        },
        dataLabels: {
            enabled: true,
            formatter: val => val.toLocaleString() + ' 명',
            style: {
                fontSize: '11px'
            }
        },
        labels: monthKeys,
        xaxis: {
            categories: monthKeys,
            labels: { style: { fontSize: '12px' } }
        },
        yaxis: {
            labels: {
                formatter: v => v.toLocaleString() + ' 명',
                style: { fontSize: '12px' }
            }
        },
        colors: ['#34c18e', '#3498db'], // 투입: 초록, 요청: 파랑
        tooltip: {
            shared: true,
            intersect: false,
            y: { formatter: v => v.toLocaleString() + ' 명' }
        },
        legend: {
            position: 'top',
            horizontalAlign: 'right'
        }
    };

    window.human_chart = new ApexCharts(chartEl, chartOptions);
    window.human_chart.render();
}


function exportToExcel() {
    const tbody = document.querySelector('#a_tbody');
    const thead = document.querySelector('table thead');
    if (!tbody || !thead) return;

    let wb = XLSX.utils.book_new();
    let ws_data = [];

    // 헤더 수집
    let headerRow = [];
    thead.querySelectorAll('th').forEach(th => {
        headerRow.push(th.innerText.trim());
    });
    ws_data.push(headerRow);

    // 바디 수집
    tbody.querySelectorAll('tr').forEach(row => {
        let rowData = [];
        row.querySelectorAll('td').forEach(cell => {
            rowData.push(cell.innerText.trim());
        });
        if (rowData.length > 0) {
            ws_data.push(rowData);
        }
    });

    let ws = XLSX.utils.aoa_to_sheet(ws_data);
    XLSX.utils.book_append_sheet(wb, ws, "실적통계");
    XLSX.writeFile(wb, "실적통계_인원_센터.xlsx");
}

</script>
