function refresh() {

function select_this_year() {
    let selectElement = document.getElementById("a_year_filter");
    let currentYear = new Date().getFullYear();

    for (let i = 0; i < selectElement.options.length; i++) {
        if (selectElement.options[i].value == currentYear) {
            selectElement.selectedIndex = i;
            break;
        }
    }
}

// 선택대상 초기화 : 주로 create, delete 후 호출
function a_search_ready() {
    a_click_id = null;
    a_nation.page = 1;
    {% comment %}a_nation_data.page_size = $("#a_page_size").val();{% endcomment %}
    a_nation_data.page_size = 9999;

    a_year_filter = $("#a_year_filter").val();
    sch_team = $('#sch_team').val();
    sch_user = $('#sch_user').val();
    sch_customer = $('#sch_customer').val(); 

    a_search();
}

// 선택대상 유지 : 주로 update 후 호출
function a_search() {
    let query = "?page=" + a_nation.page + "&page_size=" + a_nation_data.page_size;
    if (a_year_filter) { query += "&a_year_filter=" + a_year_filter; }
    if (sch_team) { query += "&sch_team=" + sch_team; }
    if (sch_user) { query += "&sch_user=" + sch_user; }
    if (sch_customer) { query += "&sch_customer=" + sch_customer; }

    fetch_gp("/customer_performance_data_fn/" + query, 'GET', true, {}, (done) => {
        a_draw_table(done);
        a_draw_graph(done.monthly_summary);

        // 부서별 스택바: 직원 스택
        {% comment %}a_draw_graph_department_stacked(done.monthly_user_summary);{% endcomment %}
    });
}

// 센터별 취합으로 수정 
function a_draw_table(done) {
    const summary = done.monthly_customer_summary;
    if (!summary || Object.keys(summary).length === 0) {
        $('#a_tbody').html(`
            <tr class="empty-row">
                <td colspan="16" style="text-align: center;">월별 지출 요약 데이터가 없습니다.</td>
            </tr>`);
        return;
    }

    const selectedYear = a_year_filter || new Date().getFullYear();
    const shortYear = String(selectedYear).slice(-2);
    const monthKeys = Array.from({ length: 12 }, (_, i) => `${shortYear}/${String(i + 1).padStart(2, '0')}`);

    // Customer별 집계
    const custMap = {};
    Object.entries(summary).forEach(([month, list]) => {
        (list || []).forEach(row => {
            const key = row.customer_id ?? `cust|${row.customer_name}`;
            if (!custMap[key]) {
                custMap[key] = {
                    customer_id: row.customer_id || null,
                    customer_name: row.customer_name || '미지정',
                    data: {},
                    total: 0
                };
            }
            const val = row.total_price || 0;
            custMap[key].data[month] = (custMap[key].data[month] || 0) + val;
            custMap[key].total += val;
        });
    });

    // 연매출 총합 기준으로 정렬
    const sortedCusts = Object.values(custMap).sort((a, b) => b.total - a.total);

    // 출력
    let rows = '';
    let idx = 1;

    for (const info of sortedCusts) {
        rows += `<tr class="align-middle text-nowrap">
            <td>${idx++}</td>
            <td>${info.customer_name}</td>`;

        for (const m of monthKeys) {
            const val = info.data[m] || 0;
            rows += `<td>${formatNumber(val)}</td>`;
        }
        // 가로 행 합계
        rows += `<td class="fw-bold">${formatNumber(info.total)}</td></tr>`;
    }

    // 마지막 합계 행
    let totalRow = `<tr class="table-warning text-nowrap fw-bold" style="background-color:#f8f9fa;">
        <td></td>
        <td>합 계</td>`;

    let grandTotal = 0;
    for (const m of monthKeys) {
        let monthTotal = 0;
        for (const info of sortedCusts) {
            monthTotal += info.data[m] || 0;
        }
        grandTotal += monthTotal;
        totalRow += `<td>${formatNumber(monthTotal)}</td>`;
    }
    totalRow += `<td>${formatNumber(grandTotal)}</td></tr>`;

    rows += totalRow;
    $('#a_tbody').html(rows);
}

function formatNumber(val, cnt = 0) {
    if (val == null) return '';  // null, undefined 방지
    val = String(val);           // 문자열 강제 변환

    if (!val || val === '-' || val === '.' || val === '-.') return val;

    const [intPart, decPart] = val.split('.');
    const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    // 사용자가 소수점 입력했을 때만 소수점 표시
    if (val.includes('.') && cnt > 0) {
        return `${intFormatted}.${(decPart || '').slice(0, cnt)}`;
    }

    return intFormatted;
}

function add_comma(val) {
    const num = Number(val);
    return isNaN(num) ? val : num.toLocaleString();
}


function a_draw_graph(monthlySummary) {
    const container = document.querySelector("#a_graph");
    if (!container) return;

    if (!Array.isArray(monthlySummary) || monthlySummary.length === 0) {
        container.innerHTML = `
            <div class='d-flex justify-content-center align-items-center text-muted' style='height:100%; min-height:200px;'>
                등록된 데이터가 없습니다.
            </div>`;
        return;
    }

    const categories = monthlySummary.map(item => item.month);
    const seriesData = monthlySummary.map(item => item.total_price || 0);

    container.innerHTML = `<div id="a_graph_chart"></div>`;
    const chartEl = document.querySelector("#a_graph_chart");

    if (window.approval_cost_chart instanceof ApexCharts) {
        window.approval_cost_chart.destroy();
    }

    const chartOptions = {
        series: [{ name: '지출 금액', data: seriesData }],
        chart: { height: 330, type: 'area', toolbar: { show: false }, animations: { enabled: true, easing: 'easeInOut', speed: 800 } },
        colors: ['#f39c12'],
        dataLabels: {
            enabled: true,
            formatter: val => add_comma(val.toFixed(0)) + ' 원',
            style: { fontSize: '11px' }
        },
        stroke: { show: true, curve: 'smooth', width: 0 },
        xaxis: { categories, labels: { style: { fontSize: '12px' } } },
        yaxis: {
            labels: {
                formatter: val => {
                    if (val >= 1e8) return `${add_comma((val / 1e8).toFixed(1))} 억`;
                    if (val >= 1e4) return `${add_comma((val / 1e4).toFixed(1))} 만`;
                    return add_comma(val.toFixed(0));
                },
                style: { fontSize: '12px' }
            }
        },
        tooltip: { y: { formatter: val => add_comma(val.toFixed(0)) + ' 원' } }
    };

    window.approval_cost_chart = new ApexCharts(chartEl, chartOptions);
    window.approval_cost_chart.render();
}


function exportToExcel() {
    const tbody = document.querySelector('#a_tbody');
    const thead = document.querySelector('table thead');
    if (!tbody || !thead) return;

    let wb = XLSX.utils.book_new();
    let ws_data = [];

    // 헤더 수집
    let headerRow = [];
    thead.querySelectorAll('th').forEach(th => {
        headerRow.push(th.innerText.trim());
    });
    ws_data.push(headerRow);

    // 바디 수집
    tbody.querySelectorAll('tr').forEach(row => {
        let rowData = [];
        row.querySelectorAll('td').forEach(cell => {
            rowData.push(cell.innerText.trim());
        });
        if (rowData.length > 0) {
            ws_data.push(rowData);
        }
    });

    let ws = XLSX.utils.aoa_to_sheet(ws_data);
    XLSX.utils.book_append_sheet(wb, ws, "실적통계");
    XLSX.writeFile(wb, "실적통계_매출.xlsx");
}

function a_draw_graph_department_stacked(monthlyUserSummary) {
    const container = document.querySelector("#a_graph");
    if (!container) return;

    if (!monthlyUserSummary || Object.keys(monthlyUserSummary).length === 0) {
        container.innerHTML = `
            <div class='d-flex justify-content-center align-items-center text-muted' style='height:100%; min-height:200px;'>
                등록된 데이터가 없습니다.
            </div>`;
        return;
    }

    // 1) 연도 합계 기준으로 집계: team -> user -> total
    // monthlyUserSummary: { '25/01': [{ team_name, user_name, total_price }, ...], ... }
    const teamUserTotals = {};  // { [teamName]: { [userName]: sum } }
    const teamSet = new Set();
    const userSet = new Set();

    Object.values(monthlyUserSummary).forEach(list => {
        (list || []).forEach(row => {
            const team = row.team_name || '미지정';
            const user = row.user_name || '미지정';
            const val  = Number(row.total_price) || 0;

            teamSet.add(team);
            userSet.add(user);

            if (!teamUserTotals[team]) teamUserTotals[team] = {};
            teamUserTotals[team][user] = (teamUserTotals[team][user] || 0) + val;
        });
    });

    // X축 카테고리: 부서명(정렬)
    const categories = Array.from(teamSet).sort((a, b) => a.localeCompare(b, 'ko'));

    // 2) Series 구성: 직원별 시리즈, 각 데이터는 부서 카테고리 순서에 맞춘 값
    // 시각적 난잡함을 줄이기 위해, 각 부서 Top N(기본 10명)만 남기고 나머지는 '기타'로 합치기
    const TOP_N_PER_TEAM = 10;

    // 부서별로 상위 직원 추림 + 기타 합산
    const usersNeeded = new Set();
    const othersByTeam = {}; // { team: number }
    categories.forEach(team => {
        const userTotals = teamUserTotals[team] || {};
        const sortedUsers = Object.entries(userTotals)
            .sort((a, b) => (b[1] || 0) - (a[1] || 0));

        const topUsers = sortedUsers.slice(0, TOP_N_PER_TEAM).map(([u]) => u);
        topUsers.forEach(u => usersNeeded.add(u));

        const others = sortedUsers.slice(TOP_N_PER_TEAM).reduce((sum, [,v]) => sum + (v||0), 0);
        if (others > 0) {
            othersByTeam[team] = others;
        }
    });

    // 최종 직원 목록 = 각 부서 Top N 직원들의 합집합 (+ '기타' 필요 시)
    let finalUsers = Array.from(usersNeeded).sort((a, b) => a.localeCompare(b, 'ko'));
    const hasOthers = Object.keys(othersByTeam).length > 0;
    if (hasOthers) finalUsers.push('기타');

    // 시리즈 구성
    const series = finalUsers.map(user => {
        const data = categories.map(team => {
            if (user === '기타') {
                return othersByTeam[team] || 0;
            }
            const userTotals = teamUserTotals[team] || {};
            return userTotals[user] || 0;
        });
        return { name: user, data };
    });

    // 3) 렌더링
    container.innerHTML = `<div id="a_graph_chart"></div>`;
    const chartEl = document.querySelector("#a_graph_chart");
    if (window.approval_cost_chart instanceof ApexCharts) {
        window.approval_cost_chart.destroy();
    }

    const chartOptions = {
        series,
        chart: {
            type: 'bar',
            height: 330,
            stacked: true,
            toolbar: { show: false },
            animations: { enabled: true, easing: 'easeInOut', speed: 700 }
        },
        plotOptions: {
            bar: {
                horizontal: false,
                columnWidth: '60%',
                borderRadius: 4,
                dataLabels: {
                    position: 'center' // 스택 내부에 라벨 표시
                }
            }
        },
        dataLabels: {
            enabled: true,
            formatter: function (val, opt) {
                // 0 이하인 값은 라벨 숨기기
                if (!val || val <= 0) return '';
                const seriesName = opt.w.globals.seriesNames[opt.seriesIndex];
                return `${seriesName} ${add_comma(val)} 원`;
            },
            style: {
                fontSize: '12px',
                colors: ['#fff'] // 글자 색상 (스택 막대 배경 대비용)
            },
            dropShadow: {
                enabled: true,
                left: 1,
                top: 1,
                opacity: 0.5
            }
        },
        xaxis: {
            categories,
            labels: { style: { fontSize: '12px' } }
        },
        yaxis: {
            labels: {
                formatter: val => {
                    if (val >= 1e8) return `${add_comma((val / 1e8).toFixed(1))} 억`;
                    if (val >= 1e4) return `${add_comma((val / 1e4).toFixed(1))} 만`;
                    return add_comma((+val || 0).toFixed(0));
                },
                style: { fontSize: '12px' }
            }
        },
        legend: {
            show: false,
            position: 'bottom',
            fontSize: '12px',
            markers: { width: 10, height: 10, radius: 2 },
            itemMargin: { horizontal: 10, vertical: 2 }
        },
        tooltip: {
            enabled: false // 툴팁 완전히 비활성화
        },
        grid: { strokeDashArray: 3 },
        states: { active: { filter: { type: 'darken', value: 0.8 } } }
    };

    window.approval_cost_chart = new ApexCharts(chartEl, chartOptions);
    window.approval_cost_chart.render();
}
</script>
