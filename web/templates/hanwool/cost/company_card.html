<!-- 법인카드/경비 > 법인카드 관리 -->

<!DOCTYPE html>
<html style="overflow-x:hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}
<style>
.rotate {
    transition: transform 0.3s ease;
    transform: rotate(180deg);
}
#a_filter_open {
    transition: transform 0.3s ease;
}

#imageTooltip {
    display: none;
    position: absolute;
    z-index: 9999;
    border: 1px solid #ccc;
    background: white;
    padding: 3px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    border-radius: 5px;
}
#tooltipImage {
    min-width: 390px;
    max-width: 600px;
    max-height: 600px;
    width: auto;
    height: auto;
    display: block;
}

/* select2 컨테이너 너비 지정 */
#sch_card_account + .select2-container {
    width: 150px !important;
}

/* select2 선택창 높이 및 스타일 form-select-sm과 동일하게 */
#sch_card_account + .select2-container .select2-selection--single {
    height: 36.53px !important;
    line-height: 32px !important;
    padding: 0.25rem 0.5rem !important;
    border: 1px solid #6c757d !important; /* border-secondary */
    border-radius: 0.2rem !important;
    position: relative;
}

/* 선택된 항목 텍스트 정렬 */
#sch_card_account + .select2-container .select2-selection__rendered {
    line-height: 30px !important;
    padding-left: 0 !important;
}

/* 화살표 위치 조정 */
#sch_card_account + .select2-container .select2-selection__arrow {
    height: 36.53px !important;
    top: 0 !important;
}

/* 클리어버튼 위치 조정 */
#sch_card_account + .select2-container .select2-selection__clear {
    right: 2.5rem !important;
    top: 50%;
    transform: translateY(-50%);
    position: absolute;
    z-index: 10;
}
</style>

<!-- Content Area -->
<div class="row p-4">

    <!-- 게시물 목록 -->
    <div class="col-12">
        <div class="row gx-4">

            <!-- 상단 메뉴바 -->
            <div class="col-xxl-12">
                <div class="d-inline-block align-items-center mb-3" style="font-size: 20px; color: #2a3040; cursor: pointer; font-weight: 1000;" onclick="refresh()">
                    <i class="fa-solid fa-file-invoice-dollar me-2"></i>법인카드 관리
                    <i class="fa-regular fa-circle-question fa-2xs" style="vertical-align: super;" data-toggle="tooltip" data-placement="top" onclick="event.stopPropagation();"
                    title="• 법인카드와 법인카드 사용내역을 관리하는 페이지입니다.<br>• 수정하려는 항목에서 더블클릭하면 수정 팝업이 열립니다."></i>
                </div>
            </div>

            <div class="col-12">
                <div class="card border border-light">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-3">
                            <div class="d-flex p-0">
                                <div class="d-none d-md-inline btn btn-secondary text-nowrap me-1 px-2.5" onclick="refresh()"
                                     data-toggle="tooltip" data-placement="top" title="새로고침 (F5)">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </div>

                                <select class="d-none d-md-inline page_size form-select form-select-sm me-1" id="c_page_size"
                                        onchange="c_search_ready()" data-toggle="tooltip" data-placement="top" title="리스트에서 표시할 수량">
                                    <option value="10">10개</option>
                                    <option value="20" selected>20개</option>
                                    <option value="50">50개</option>
                                    <option value="100">100개</option>
                                    <option value="200">200개</option>
                                    <option value="500">500개</option>
                                </select>

                                <div class="d-none d-md-flex input-group input-daterange position-relative w-auto me-1"
                                     id="date_filter" data-toggle="tooltip" data-placement="top" title="법인카드 사용일 검색">
                                    <input id="fr_date" type="text" placeholder="시작일 검색" onchange="c_search_ready()" autocomplete="off"
                                           class="form-control date_flatpickr border border-secondary" style="max-width: 120px;">
                                    <input id="to_date" type="text" placeholder="종료일 검색" onchange="c_search_ready()" autocomplete="off"
                                           class="form-control date_flatpickr border border-secondary" style="max-width: 120px; border-top-right-radius: 4px; border-bottom-right-radius: 4px;">

                                    <div id="date_dropdown" class="d-none position-absolute bg-light border border-secondary-subtle rounded shadow-sm p-1"
                                         style="top: 100%; left: 0; z-index: 1000; min-width: 150px;">
                                        <div class="d-flex align-items-center my-2">
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('yesterday')">어제</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('today')">오늘</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('tomorrow')">내일</button>
                                        </div>
                                        <div class="d-flex align-items-center my-2">
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('last_week')">지난주</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('this_week')">이번주</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('next_week')">다음주</button>
                                        </div>
                                        <div class="d-flex align-items-center my-2">
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('last_month')">지난달</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('this_month')">이번달</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('next_month')">다음달</button>
                                        </div>
                                        <div class="d-flex align-items-center my-2">
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('last_year')">작년</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('this_year')">올해</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('next_year')">내년</button>
                                        </div>
                                    </div>
                                </div>


                                
                                <div class="d-none d-md-flex input-group input-daterange w-auto me-1" data-toggle="tooltip" data-placement="top" title="계정과목 검색">
                                    <select class="d-none d-md-inline page_size form-select form-select-sm me-1" id="sch_card_account"
                                            onchange="c_search_ready()">
                                    </select>
                                </div>

                                <div class="search-box d-flex me-1" data-toggle="tooltip" data-placement="top" title="내용, 비고 등 텍스트 검색">
                                    <div class="position-relative flex-grow-1">
                                        <input type="text" class="form-control rounded border-secondary" id="all_sch" placeholder="검색어 입력">
                                        <i class="mdi mdi-magnify search-icon"></i>
                                    </div>
                                </div>

                                <button class="btn btn-secondary text-nowrap me-1 px-2.5" onclick="c_search_ready()">
                                    <i class="fa-solid fa-magnifying-glass"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">검색</span>
                                </button>
                            </div>

                            <div class="d-flex position-relative p-0">
                                <div class="d-none d-md-block btn btn-info dropdown-toggle text-nowrap ms-1 px-2.5" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fa-solid fa-wand-sparkles"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">옵션</span></div>
                                    <ul class="dropdown-menu dropdown-menu-end">
                                        <li><button class="dropdown-item" type="button" onclick="a_popup_open()">
                                        <i class="fa-solid fa-file-invoice me-2"></i>지출 통계</button></li>
                                    </ul>
                            </div>
                        </div>

                        <!-- 본문 영역 -->
                        <div class="d-flex flex-column flex-lg-row justify-content-between">
                            <div class="col-12 col-lg-3">
                                <div class="card border border-light mb-3 mb-lg-0">
                                    <div class="card-body p-3">
                                        <!-- 법인카드 목록 -->
                                        <div class="d-flex justify-content-between align-items-center fw-bold mb-2" style="font-size: 16px; color: #2a3040;">
                                            <div class="d-flex justify-content-between align-items-center">법인카드 목록<i class="fa-solid fa-chevron-up ms-2 rotate-icon" style="cursor: pointer;" id="a_filter_open"></i></div>
                                            <div class="d-flex p-0">
                                                <button class="btn btn-sm btn-success text-nowrap ms-1 px-2.5" onclick="a_create_modal_in()">
                                                    <i class="fa-solid fa-plus"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">등록</span>
                                                </button>
                                                <button class="btn btn-sm btn-warning text-nowrap ms-1 px-2.5" onclick="a_update_modal_in()">
                                                    <i class="fa-solid fa-pen"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">수정</span>
                                                </button>
                                                <button class="btn btn-sm btn-danger text-nowrap ms-1 px-2.5" onclick="a_delete_submit()">
                                                    <i class="fa-solid fa-trash-can"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">삭제</span>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="mb-3" id="a_filter" style="display: none;">
                                            <div class="d-flex p-0">
                                                <select class="page_size form-select form-select-sm me-1" id="a_page_size"
                                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="리스트에서 표시할 수량">
                                                    <option value="10">10개</option>
                                                    <option value="20" selected>20개</option>
                                                    <option value="50">50개</option>
                                                    <option value="100">100개</option>
                                                    <option value="200">200개</option>
                                                    <option value="500">500개</option>
                                                </select>

                                                <select class="page_size form-select form-select-sm me-1" id="sch_is_valid"
                                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="사용 여부로 검색">
                                                    <option value="">모두</option>
                                                    <option value="true" selected>사용</option>
                                                    <option value="false">미사용</option>
                                                </select>

                                                <div class="search-box d-flex me-1" data-toggle="tooltip" data-placement="top" title="카드번호, 별칭, 카드사, 소유자 성명 등 텍스트 검색">
                                                    <div class="position-relative flex-grow-1">
                                                        <input type="text" class="form-control rounded border-secondary" id="a_all_sch" placeholder="검색어 입력">
                                                        <i class="mdi mdi-magnify search-icon"></i>
                                                    </div>
                                                </div>

                                                <button class="btn btn-secondary text-nowrap me-1 px-2.5" onclick="a_search_ready()">
                                                    <i class="fa-solid fa-magnifying-glass"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">검색</span>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="custom_table table-responsive">
                                            <table class="table">
                                                <thead class="thead-light">
                                                    <tr class="text-nowrap">
                                                        <th>순번</th>
                                                        <th>카드번호</th>
                                                        <th>카드사</th>
                                                        <th>소유자</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="a_tbody"></tbody>
                                            </table>
                                        </div>
                                        <div class="div_center mt-3" id="a_nation_id"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-lg-9 ps-0 ps-lg-3">
                                <div class="card border border-light mb-0">
                                    <div class="card-body p-3">
                                        <!-- 법인카드 사용내역 -->
                                        <div class="d-flex justify-content-between align-items-center fw-bold mb-2" style="font-size: 16px; color: #2a3040;">법인카드 사용내역
                                            <div class="d-flex p-0">
                                                <button class="btn btn-sm btn-success text-nowrap ms-1 px-2.5" onclick="c_create_modal_in()">
                                                    <i class="fa-solid fa-plus"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">등록</span>
                                                </button>
                                                <button class="btn btn-sm btn-warning text-nowrap ms-1 px-2.5" onclick="c_update_modal_in()">
                                                    <i class="fa-solid fa-pen"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">수정</span>
                                                </button>
                                                <button class="btn btn-sm btn-danger text-nowrap ms-1 px-2.5" onclick="c_delete_submit()">
                                                    <i class="fa-solid fa-trash-can"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">삭제</span>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="custom_table table-responsive">
                                            <table class="table">
                                                <thead class="thead-light">
                                                    <tr class="text-nowrap">
                                                        <th style="width: 5%;">순번</th>
                                                        <th style="width: 5%;">사용일</th>
                                                        <th style="width: 5%;">카드번호</th>
                                                        <th style="width: 5%;">실제 사용자</th>
                                                        <th style="width: 5%;">계정과목</th>
                                                        <th style="width: 10%;">내용</th>
                                                        <th style="width: 5%;">금액</th>
                                                        <th style="width: 10%;">비고</th>
                                                        <th style="width: 5%;">첨부파일</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="c_tbody"></tbody>
                                            </table>
                                        </div>
                                        <div class="div_center mt-3" id="c_nation_id"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- a_create_modal -->
<div class="modal fade" id="a_create_modal" tabindex="-1" role="dialog" aria-labelledby="a_create_modal"
     data-bs-backdrop="static" data-bs-keyboard="true" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header d-flex justify-content-between align-items-center">
                <h5 class="modal-title mx-2">법인카드 관리 <i class="fa-solid fa-angle-right px-1"></i> 법인카드 등록</h5>
                <div>
                    <i class="fa-solid fa-expand fa-lg text-white mx-2" title="전체화면" style="cursor: pointer;" id="md_fullscreen_create"></i>
                    <i class="fa-solid fa-rotate-right fa-lg text-white mx-2" title="초기화" style="cursor: pointer;" onclick="a_create_modal_reset()"></i>
                    <i class="fa-solid fa-xmark fa-xl text-white mx-2" title="닫기" style="cursor: pointer;" data-bs-dismiss="modal"></i>
                </div>
            </div>

            <div class="modal-body w-100 p-4">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="code" class="form-label">카드 번호</label>
                        <input type="text" class="form-control" id="code">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">카드 별칭</label>
                        <input type="text" class="form-control" id="name">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="validation_date" class="form-label">카드 만료일</label>
                        <input type="text" class="form-control date_flatpickr" id="validation_date">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="card_supplier" class="form-label">카드사</label>
                        <input type="text" class="form-control" id="card_supplier">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="owner" class="form-label">카드 소유자</label>
                        <select class="form-control" id="owner"></select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="is_valid" class="form-label">사용 여부</label>
                        <select class="text-left form-select" id="is_valid">
                            <option value="true">사용</option>
                            <option value="false">미사용</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="modal-footer d-flex justify-content-end">
                <div class="col-8 d-flex justify-content-end">
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" onclick="a_create_modal_reset()">초기화</div>
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" onclick="a_create_submit()">등록</div>
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" data-bs-dismiss="modal">닫기</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- c_create_modal -->
<div class="modal fade" id="c_create_modal" tabindex="-1" role="dialog" aria-labelledby="c_create_modal"
     data-bs-backdrop="static" data-bs-keyboard="true" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header d-flex justify-content-between align-items-center">
                <h5 class="modal-title mx-2">법인카드 관리 <i class="fa-solid fa-angle-right px-1"></i> 사용내역 등록</h5>
                <div>
                    <i class="fa-solid fa-expand fa-lg text-white mx-2" title="전체화면" style="cursor: pointer;" id="md_fullscreen_create_c"></i>
                    <i class="fa-solid fa-rotate-right fa-lg text-white mx-2" title="초기화" style="cursor: pointer;" onclick="c_create_modal_reset()"></i>
                    <i class="fa-solid fa-xmark fa-xl text-white mx-2" title="닫기" style="cursor: pointer;" data-bs-dismiss="modal"></i>
                </div>
            </div>

            <div class="modal-body w-100 p-4">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="date" class="form-label">사용 일자</label>
                        <input type="text" class="form-control date_flatpickr div_required" id="date">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="card" class="form-label">법인 카드</label>
                        <select class="form-select" id="card"></select>
                    </div>

// 선택대상 초기화 : 주로 create, delete 후 호출
function a_search_ready() {
    a_click_id = null;
    a_nation.page = 1;
    a_nation_data.page_size = $("#a_page_size").val();

    a_all_sch = $('#a_all_sch').val();
    sch_is_valid = $('#sch_is_valid').val();

    a_search();
}

// 선택대상 유지 : 주로 update 후 호출
function a_search() {
    let query = "?page=" + a_nation.page + "&page_size=" + a_nation_data.page_size;
    
    if (a_all_sch) { query += "&a_all_sch=" + a_all_sch; }
    if (sch_is_valid) { query += "&sch_is_valid=" + sch_is_valid; }

    fetch_gp("/cost_company_card_list_fn/" + query, 'GET', true, {}, (done) => {
        a_draw_table(done);
    });
}

function a_draw_table(done) {
    // console.log("a_draw_table: ", done);

    let data = done.results;
    if (data.length === 0) {
        let emptyRow = `
        <tr>
            <td colspan="99" style="text-align: center;">등록된 데이터가 없습니다.</td>
        </tr>`;
        $('#a_tbody').html(emptyRow);
        return;
    }

    let num = ((a_nation.page - 1) * a_nation_data.page_size) + 1;
    let rows = "";
    for (let i = 0; i < data.length; i++) {
        let item = data[i];

        let currentOwner = item.owner || {};
        let profileImage = currentOwner.profile_image
        ? `<img src="${currentOwner.profile_image}" alt="Profile Image" class="rounded-circle me-2" width="24" height="24">`
        : "";

        let ownerProfile = currentOwner.name
            ? `${profileImage} ${currentOwner.name} ${currentOwner.job_level || ""}`
            : "-";

        let row = `
        <tr id='${item.id}' class='align-middle text-nowrap' style='cursor:pointer;'>
            <td>${num + i}</td>
            <td name='code'><span class="badge bg-info font-size-12 p-2" style="min-width: 50px;">${item.code || ""}</span></td>
            <td name='card_supplier'>${item.card_supplier || ""}</td>
            <td name='owner_profile' class="py-1">${ownerProfile}</td>

            <td name='name' class='d-none'>${item.name || ""}</td>
            <td name='validation_date' class='d-none'>${item.validation_date || ""}</td>
            <td name='is_valid' class='d-none'>${item.is_valid || ""}</td>
            <td name='owner_id' class='d-none'>${item.owner.id || ""}</td>
            <td name='owner_name' class='d-none'>${item.owner.name || ""}</td>

            <td name='created_at' class='d-none'>${item.created_at}</td>
            <td name='updated_at' class='d-none'>${item.updated_at}</td>
            <td name='created_by_id' class='d-none'>${item.created_by.id}</td>
            <td name='created_by_name' class='d-none'>${item.created_by.name}</td>
            <td name='updated_by_id' class='d-none'>${item.updated_by.id}</td>
            <td name='updated_by_name' class='d-none'>${item.updated_by.name}</td>
        </tr>`;
        rows += row;
    }

    a_nation.nation_display(done);
    $('#a_tbody').html(rows);

    // 클릭한 행 유지
    if (a_click_id != null) {
        $("#a_tbody #" + a_click_id).addClass('clicked');
    }

    $('#a_tbody > tr').on('click', function () {
        $('#a_tbody > tr').removeClass('clicked');
        $(this).addClass('clicked');

        a_click_id = $(this).attr("id");
        a_click_code = $(this).find("[name='code']").text();
        a_click_name = $(this).find("[name='name']").text();
        a_click_owner_id = $(this).find("[name='owner_id']").text();
        a_click_owner_name = $(this).find("[name='owner_name']").text();
        a_click_card_supplier = $(this).find("[name='card_supplier']").text();
        a_click_validation_date = $(this).find("[name='validation_date']").text();
        a_click_is_valid = $(this).find("[name='is_valid']").text();

        a_click_created_at = $(this).find("[name='created_at']").text();
        a_click_updated_at = $(this).find("[name='updated_at']").text();
        a_click_created_by_id = $(this).find("[name='created_by_id']").text();
        a_click_created_by_name = $(this).find("[name='created_by_name']").text();
        a_click_updated_by_id = $(this).find("[name='updated_by_id']").text();
        a_click_updated_by_name = $(this).find("[name='updated_by_name']").text();

        c_search_ready();
    });

    $('#a_tbody > tr').on('dblclick', function () {
        a_update_modal_in();
    });
}

function a_create_modal_in() {
    a_create_modal_reset('popup_off');

    if (window.matchMedia('(max-width: 1200px)').matches) {
        $('#md_fullscreen_create').trigger('click');

    $('#a_create_modal').modal("show");
}

    $("#a_create_modal #code").val('');
    $("#a_create_modal #name").val('');
    $("#a_create_modal #card_supplier").val('');
    $("#a_create_modal #validation_date").val('');

function a_create_submit() {
    let api_data = new FormData();

        api_data.append("name", nullapply($('#a_create_modal #name').val()));
        api_data.append("owner", nullapply($('#a_create_modal #owner').val()));
        api_data.append("card_supplier", nullapply($('#a_create_modal #card_supplier').val()));
        api_data.append("validation_date", nullapply($('#a_create_modal #validation_date').val()));
        api_data.append("is_valid", nullapply($('#a_create_modal #is_valid').val()));

function a_update_modal_reset(popup_off) {
    $("#a_update_modal #code").val(a_click_code);

function a_update_submit() {
    let api_data = new FormData();
        api_data.append("pk", a_click_id);
        api_data.append("code", nullapply($('#a_update_modal #code').val()));
        api_data.append("name", nullapply($('#a_update_modal #name').val()));
        api_data.append("owner", nullapply($('#a_update_modal #owner').val()));
        api_data.append("card_supplier", nullapply($('#a_update_modal #card_supplier').val()));

    fetch_gp('/cost_company_card_update_fn/', 'post', true, api_data, (done) => {
        $('#a_update_modal').modal("hide");

        alert(txt.update_ed);
    });

function a_delete_submit() {
    if (a_click_id == null) {
        alert(txt.delete_select);
        return;
    }

    let res = prompt(`[${a_click_code}] 카드를 삭제하시겠습니까?\n` + txt.delete_will_check);
    if (txt.delete_check.includes(res)) {
        let api_data = new FormData();
        api_data.append("pk", a_click_id);

        fetch_gp('/cost_company_card_delete_fn/', 'post', true, api_data, (done) => {
            a_nation.page = 1;
            a_click_id = null;

            a_search_ready();
            alert(txt.delete_ed);
        });
    } else {
        alert(txt.cancel);
    }
}

    fetch_gp("/cost_company_card_history_list_fn/" + query, 'GET', true, {}, (done) => {
        c_draw_table(done);
    });
}

function c_draw_table(done) {
    // console.log("c_draw_table: ", done);

    let data = done.results;
    if (data.length === 0) {
        let emptyRow = `
        <tr>
            <td colspan="99" style="text-align: center;">등록된 데이터가 없습니다.</td>
        </tr>`;
        $('#c_tbody').html(emptyRow);
        return;
    }

    let total_price_sum = 0;
    let num = ((c_nation.page - 1) * c_nation_data.page_size) + 1;
    let rows = "";
    for (let i = 0; i < data.length; i++) {
        let item = data[i];
        let total_price = parseFloat(item.price) || 0;
        total_price_sum += total_price;

        let user = item.user || {};
        let profileImage = user.profile_image
        ? `<img src="${user.profile_image}" alt="Profile Image" class="rounded-circle me-2" width="24" height="24">`
        : "";

        let userProfile = user.name
            ? `${profileImage} ${user.name} ${user.job_level || ""}`
            : "-";

        let imageUrl = item.image;
        let imageBtnHtml = "";
        if (imageUrl) {
            let fileName = imageUrl.split('/').pop();
            let fileBaseName = fileName.split('.').slice(0, -1).join('.');
            imageBtnHtml = `
                <button class="btn btn-outline-primary btn-sm text-truncate w-100 image-preview-btn" data-image-url="${imageUrl}">
                    <i class="fa-regular fa-image"></i>
                    <span class="ms-1">증빙 자료</span>
                </button>
            `;
        } else {
            imageBtnHtml = "";
        }

        let row = `
        <tr id='${item.id}' class='align-middle text-nowrap' style='cursor:pointer;'>
            <td>${num + i}</td>
            <td name='date'>${item.date || ""}</td>
            <td name='card_code'><span class="badge bg-info font-size-12 p-2" style="min-width: 50px;">${item.card_code || ""}</span></td>
            <td name='userProfile' class="py-1">${userProfile}</td>
            <td name='card_account_name'>${item.card_account_name || ""}</td>
            <td name='desc1'>${item.desc1 || ""}</td>
            <td name='price'>${formatNumber(item.price, 2) || ""}</td>
            <td name='desc2'>${item.desc2 || ""}</td>
            <td name='image_btn' class="py-1">${imageBtnHtml}</td>

            <td name='card_id' class='d-none'>${item.card_id || ""}</td>
            <td name='user_id' class='d-none'>${item.user.id || ""}</td>
            <td name='user_name' class='d-none'>${item.user.name || ""}</td>
            <td name='card_account_id' class='d-none'>${item.card_account_id || ""}</td>
            <td name='desc3' class='d-none'>${item.desc3 || ""}</td>
            <td name='file_name' class='d-none'>
                기존 첨부파일 : ${item.image ? decodeURIComponent(item.image.split('/').pop()) : "없음"}
            </td>

            <td name='created_at' class='d-none'>${item.created_at}</td>
            <td name='updated_at' class='d-none'>${item.updated_at}</td>
            <td name='created_by_id' class='d-none'>${item.created_by.id}</td>
            <td name='created_by_name' class='d-none'>${item.created_by.name}</td>
            <td name='updated_by_id' class='d-none'>${item.updated_by.id}</td>
            <td name='updated_by_name' class='d-none'>${item.updated_by.name}</td>
        </tr>`;
        rows += row;
    }

    let sumRow = `

function checkNumber(obj, cnt = 0) {
    let val = $(obj).val().replace(/[^0-9.\-]/g, '');

    if (val.startsWith('-')) {
        val = '-' + val.slice(1).replace(/-/g, '');
    } else {
        val = val.replace(/-/g, '');
    }

    obj.value = formatNumber(val, cnt);
}

function formatNumber(val, cnt = 0) {
    if (val == null) return '';  // null, undefined 방지
    val = String(val);           // 문자열 강제 변환

    if (!val || val === '-' || val === '.' || val === '-.') return val;

    const [intPart, decPart] = val.split('.');
    const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    // 사용자가 소수점 입력했을 때만 소수점 표시
    if (val.includes('.') && cnt > 0) {
        return `${intFormatted}.${(decPart || '').slice(0, cnt)}`;
    }

    return intFormatted;
}

function del_comma(val) {
    return typeof val === 'string' ? val.replace(/,/g, '') : val;
}

function formatDate(date) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');

    return `${yyyy}-${mm}-${dd}`;
}

function set_date_range(range) {
    const today = new Date();
    let start, end;

    if (range === 'yesterday') {
        start = end = new Date(today);
        start.setDate(today.getDate() - 1);
        end.setDate(today.getDate() - 1);
    } else if (range === 'today') {
        start = end = new Date(today);
    } else if (range === 'tomorrow') {
        start = end = new Date(today);
        start.setDate(today.getDate() + 1);
        end.setDate(today.getDate() + 1);
    } else if (range === 'last_week') {
        const day = today.getDay() || 7;
        end = new Date(today);
        end.setDate(today.getDate() - day);
        start = new Date(end);
        start.setDate(end.getDate() - 6);
    } else if (range === 'this_week') {
        const day = today.getDay() || 7;
        start = new Date(today);
        start.setDate(today.getDate() - day + 1);
        end = new Date(start);
        end.setDate(start.getDate() + 6);
    } else if (range === 'next_week') {
        const day = today.getDay() || 7;
        start = new Date(today);
        start.setDate(today.getDate() - day + 8);
        end = new Date(start);
        end.setDate(start.getDate() + 6);
    } else if (range === 'last_month') {
        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        end = new Date(today.getFullYear(), today.getMonth(), 0);
    } else if (range === 'this_month') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    } else if (range === 'next_month') {
        start = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        end = new Date(today.getFullYear(), today.getMonth() + 2, 0);
    }

    else if (range === 'last_year') {
        start = new Date(today.getFullYear() - 1, 0, 1);
        end = new Date(today.getFullYear() - 1, 11, 31); }

    else if (range === 'this_year') {
        start = new Date(today.getFullYear(), 0, 1);
        end = new Date(today.getFullYear(), 11, 31); }

    else if (range === 'next_year') {
        start = new Date(today.getFullYear() + 1, 0, 1);
        end = new Date(today.getFullYear() + 1, 11, 31); }


    $('#fr_date').val(formatDate(start));
    $('#to_date').val(formatDate(end));
    c_search_ready();
}
