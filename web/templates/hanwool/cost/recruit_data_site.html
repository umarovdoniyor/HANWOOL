<!-- 법인카드/경비 > 광고/경비 관리 > 지출 통계 (광고사이트) -->

<!DOCTYPE html>
<html style="overflow-x:hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}

<style>
/* select2 컨테이너 너비 지정 */
#sch_customer + .select2-container {
    width: 240px !important;
}

.sub_title {
    color: rgba(42,48,64,0.4);
    font-size: 20px;
    cursor: pointer;
    font-weight: 1000;
    transition: color 0.2s;
}
.sub_title:hover {
    color: #2a3040;
}
</style>

<!-- Content Area -->
<div class="row p-4">

    <!-- 게시물 목록 -->
    <div class="col-12">
        <div class="row gx-4">

            <!-- 상단 메뉴바 -->
            <div class="col-12">
                <div class="d-flex justify-content-between">
                    <div class="d-inline-block align-items-center mb-3" style="font-size: 20px; color: #2a3040; cursor: pointer; font-weight: 1000;" onclick="refresh()">
                        <i class="fa-solid fa-file-invoice-dollar me-2"></i>광고/경비 관리 <i class="fa-solid fa-angle-right px-1"></i> 지출 통계 (광고사이트)
                    </div>

                    <div class="d-inline-block align-items-center mb-3 sub_title" onclick="window.location.href='{% url 'recruit_data_manager_page' %}'">
                        매니저
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="card border border-light">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-3">
                            <div class="d-flex p-0">
                                <div class="d-none d-md-inline btn btn-secondary text-nowrap me-1 px-2.5" onclick="refresh()"
                                     data-toggle="tooltip" data-placement="top" title="새로고침 (F5)">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </div>

                                <select class="page_size form-select form-select-sm me-1" id="a_page_size"
                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="리스트에서 표시할 수량">
                                    <option value="10">10개</option>
                                    <option value="20" selected>20개</option>
                                    <option value="50">50개</option>
                                    <option value="100">100개</option>
                                    <option value="200">200개</option>
                                    <option value="500">500개</option>
                                </select>

                                <select class="page_size form-select form-select-sm me-1" id="a_year_filter" onchange="a_search_ready()">
                                    {% for year in year_range %}
                                        <option value="{{ year }}" {% if year == default_year %}selected{% endif %}>{{ year }}년</option>
                                    {% endfor %}
                                </select>

                                <div class="d-none d-xl-flex w-auto me-1" data-toggle="tooltip" data-placement="top" title="거래처 소분류 검색">
                                    <select class="page_size form-select form-select-sm me-1 sch_sel2" id="sch_customer"
                                            onchange="a_search_ready()">
                                    </select>
                                </div>

                                <div class="search-box d-flex me-1" data-toggle="tooltip" data-placement="top" title="카드번호, 소유자로 텍스트 검색">
                                    <div class="position-relative flex-grow-1">
                                        <input type="text" class="form-control rounded border-secondary" id="all_sch" placeholder="검색어 입력">
                                        <i class="mdi mdi-magnify search-icon"></i>
                                    </div>
                                </div>

                                <button class="btn btn-secondary text-nowrap me-1 px-2.5" onclick="a_search_ready()">
                                    <i class="fa-solid fa-magnifying-glass"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">검색</span>
                                </button>
                            </div>
                            
                            <div class="d-flex p-0">
                                <button class="btn btn-success text-nowrap ms-1 px-2.5" onclick="exportToExcel()">
                                    <i class="fa-solid fa-file-excel"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">엑셀 다운로드</span>
                                </button>
                            </div>
                        </div>

                        <!-- 본문 영역 -->
                        <div class="col-12">
                            <!-- 그래프 영역 -->
                            <div class="card border border-light">
                                <div class="card-body">
                                    <div class="" id="a_graph" style="height: 330px; max-height: 330px; margin-left: -10px;"></div>
                                </div>
                            </div>
                            
                            <!-- 테이블 영역 -->
                            <div class="custom_table table-responsive text-nowrap">
                                <table class="table">
                                    <thead class="thead-light">
                                        <tr class="text-nowrap">
                                            <th>순번</th>
                                            <th>공고사이트</th>
                                            <th>1월</th>
                                            <th>2월</th>
                                            <th>3월</th>
                                            <th>4월</th>
                                            <th>5월</th>
                                            <th>6월</th>
                                            <th>7월</th>
                                            <th>8월</th>
                                            <th>9월</th>
                                            <th>10월</th>
                                            <th>11월</th>
                                            <th>12월</th>
                                            <th>합 계</th>
                                        </tr>
                                    </thead>
                                    <tbody id="a_tbody"></tbody>
                                </table>
                                <div class="div_center mt-3" id="a_nation_id"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let a_year_filter;
let all_sch;
let sch_customer;

let a_nation_data = {
    cname: 'a_nation',  // 인스턴스 명과 일치해야함
    nation_id: 'a_nation_id',
    range: 5,
    page_size: 20,  // 세로 Row 수
};
let a_nation = new Nations(a_nation_data, a_search); // 인스턴스 명
a_nation.nation_display({});

$('#a_page_size').on('change', function () {
    localStorage.setItem('cost_recruit_data_page_size', $(this).val());
});

window.onkeydown = function (event) {
    if (event.keyCode == 116) {  // F5
        event.returnValue = false;
        refresh();
    }
}

document.getElementById("all_sch").addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
        a_search_ready();
    }
});

function refresh() {
    let baseUrl = window.location.origin + window.location.pathname;
    window.location.href = baseUrl;
}

$(function () {
    let savedPageSize = localStorage.getItem('cost_recruit_data_page_size');
    if (savedPageSize) { $('#a_page_size').val(savedPageSize);}
    
    main();
});

function main() {
    set_autocomplete('off');
    init_date_flatpickr();
    init_Select2('#sch_customer', '거래처 소분류 검색', '/sel2_factory_all_customer/', {id: 'id', txt: item => `${item.text}`});

    a_search_ready();
}

function select_this_year() {
    let selectElement = document.getElementById("a_year_filter");
    let currentYear = new Date().getFullYear();

    for (let i = 0; i < selectElement.options.length; i++) {
        if (selectElement.options[i].value == currentYear) {
            selectElement.selectedIndex = i;
            break;
        }
    }
}

// 선택대상 초기화 : 주로 create, delete 후 호출
function a_search_ready() {
    a_click_id = null;
    a_nation.page = 1;
    a_nation_data.page_size = $("#a_page_size").val();

    all_sch = $('#all_sch').val().trim();
    a_year_filter = $("#a_year_filter").val();
    sch_customer = $('#sch_customer').val();

    a_search();
}

// 선택대상 유지 : 주로 update 후 호출
function a_search() {
    let query = "?page=" + a_nation.page + "&page_size=" + a_nation_data.page_size;
    if (all_sch) { query += "&all_sch=" + all_sch; }
    if (a_year_filter) { query += "&a_year_filter=" + a_year_filter; }
    if (sch_customer) { query += "&sch_customer=" + sch_customer; }

    fetch_gp("/cost_recruit_data_fn/" + query, 'GET', true, {}, (done) => {
        a_draw_table(done);
        a_draw_graph(done.monthly_summary);
    });
}

function a_draw_table(done) {
    // console.log("a_draw_table: ", done);
    
    let summary = done.monthly_card_summary;
    if (!summary || Object.keys(summary).length === 0) {
        $('#a_tbody').html(`
            <tr class="empty-row">
                <td colspan="16" style="text-align: center;">월별 지출 요약 데이터가 없습니다.</td>
            </tr>`);
        return;
    }

    const selectedYear = a_year_filter || new Date().getFullYear();
    const shortYear = String(selectedYear).slice(-2);  // '2025' -> '25'
    const monthKeys = Array.from({ length: 12 }, (_, i) => `${shortYear}/${String(i + 1).padStart(2, '0')}`);

    // 사용자별 집계
    const cardMap = {};

    Object.entries(summary).forEach(([month, cardList]) => {
        cardList.forEach(card => {
            if (!cardMap[card.recruit_site__name]) {
                cardMap[card.recruit_site__name] = {
                    recruit_site__name: card.recruit_site__name,
                    user_profile_image: card.user__profile_image || '',
                    user_job_level: card.user__job_level__name || '',
                    data: {},
                    total: 0
                };
            }
            cardMap[card.recruit_site__name].data[month] = card.total_price;
            cardMap[card.recruit_site__name].total += card.total_price;
        });
    });

    let rows = '';
    let idx = 1;
    
    for (const [card_code, info] of Object.entries(cardMap)) {
        rows += `<tr class='align-middle text-nowrap'>
            <td>${idx++}</td>
            <td>${info.recruit_site__name}</td>`;

        for (const m of monthKeys) {
            const val = info.data[m] || 0;
            rows += `<td>${formatNumber(val)}</td>`;
        }

        rows += `<td class='fw-bold'>${formatNumber(info.total)}</td></tr>`;
    }

    // 마지막 합계 row 추가
    let totalRow = `<tr class='table-warning text-nowrap fw-bold' style="background-color: #f8f9fa;">
        <td></td>
        <td>합 계</td>`;

    let grandTotal = 0;
    for (const m of monthKeys) {
        let monthTotal = 0;
        for (const info of Object.values(cardMap)) {
            monthTotal += info.data[m] || 0;
        }
        grandTotal += monthTotal;
        totalRow += `<td>${formatNumber(monthTotal)}</td>`;
    }

    totalRow += `<td>${formatNumber(grandTotal)}</td></tr>`;
    rows += totalRow;

    $('#a_tbody').html(rows);
}

function formatNumber(val, cnt = 0) {
    if (val == null) return '';  // null, undefined 방지
    val = String(val);           // 문자열 강제 변환

    if (!val || val === '-' || val === '.' || val === '-.') return val;

    const [intPart, decPart] = val.split('.');
    const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    // 사용자가 소수점 입력했을 때만 소수점 표시
    if (val.includes('.') && cnt > 0) {
        return `${intFormatted}.${(decPart || '').slice(0, cnt)}`;
    }

    return intFormatted;
}

function add_comma(val) {
    const num = Number(val);
    return isNaN(num) ? val : num.toLocaleString();
}


function a_draw_graph(done) {
    // console.log("a_draw_graph: ", done);

    const container = document.querySelector("#a_graph");
    if (!container || !Array.isArray(done) || done.length === 0) {
        container.innerHTML = `
            <div class='d-flex justify-content-center align-items-center text-muted' style='height: 100%; min-height: 200px;'>
                등록된 데이터가 없습니다.
            </div>`;
        return;
    }

    const categories = [];
    const seriesData = [];

    done.forEach(item => {
        const label = item.month; // e.g. "2024-06"
        categories.push(label);
        seriesData.push(item.total_price || 0);
    });

    container.innerHTML = `<div id="a_graph_chart"></div>`;
    const chartEl = document.querySelector("#a_graph_chart");

    if (window.approval_cost_chart instanceof ApexCharts) {
        window.approval_cost_chart.destroy();
    }

    const chartOptions = {
        series: [{
            name: '지출 금액',
            data: seriesData
        }],
        chart: {
            height: 330,
            type: 'area',
            toolbar: { show: false },
            animations: {
                enabled: true,
                easing: 'easeInOut',
                speed: 800
            }
        },
        colors: ['#f39c12'],
        dataLabels: {
            enabled: true,
            formatter: function (val) {
                return add_comma(val.toFixed(0)) + ' 원';
            },
            style: {
                fontSize: '11px'
            }
        },
        stroke: {
            show: true,
            curve: 'smooth',
            width: 0
        },
        xaxis: {
            categories: categories,
            labels: {
                style: {
                    fontSize: '12px'
                }
            }
        },
        yaxis: {
            labels: {
                formatter: val => {
                    if (val >= 1e8) return `${add_comma((val / 1e8).toFixed(1))} 억`;
                    if (val >= 1e4) return `${add_comma((val / 1e4).toFixed(1))} 만`;
                    return add_comma(val.toFixed(0));
                },
                style: {
                    fontSize: '12px'
                }
            }
        },
        tooltip: {
            y: {
                formatter: val => add_comma(val.toFixed(0)) + ' 원'
            }
        }
    };

    window.approval_cost_chart = new ApexCharts(chartEl, chartOptions);
    window.approval_cost_chart.render();
}


function exportToExcel() {
    const tbody = document.querySelector('#a_tbody');
    const thead = document.querySelector('table thead');
    if (!tbody || !thead) return;

    let wb = XLSX.utils.book_new();
    let ws_data = [];

    // 헤더 수집
    let headerRow = [];
    thead.querySelectorAll('th').forEach(th => {
        headerRow.push(th.innerText.trim());
    });
    ws_data.push(headerRow);

    // 바디 수집
    tbody.querySelectorAll('tr').forEach(row => {
        let rowData = [];
        row.querySelectorAll('td').forEach(cell => {
            rowData.push(cell.innerText.trim());
        });
        if (rowData.length > 0) {
            ws_data.push(rowData);
        }
    });

    let ws = XLSX.utils.aoa_to_sheet(ws_data);
    XLSX.utils.book_append_sheet(wb, ws, "광고경비_지출통계");
    XLSX.writeFile(wb, "광고경비_지출통계.xlsx");
}
</script>
