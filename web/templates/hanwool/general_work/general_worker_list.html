<!DOCTYPE html>
<html style="overflow-x: hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}

<style>
html {
    overflow-y:hidden;
}
.table-container {
  overflow-y: auto;
}

.table-container table {
  width: 100%;
  border-collapse: collapse;
}

.table-container table thead th {
  position: sticky;
  top: 0;
  background-color: #fff; /* Required to cover rows scrolling beneath */
  z-index: 1000;
  box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.4); /* Optional: visual separation */
}
</style>
<!-- Content Area -->
<div class="row p-4">

    <!-- 게시물 목록 -->
    <div class="col-12">
        <div class="row gx-4">

            <!-- 상단 메뉴바 -->
            <div class="col-xxl-12">
                <div class="d-inline-block align-items-center mb-3" style="font-size: 20px; color: #2a3040; cursor: pointer; font-weight: 1000;" onclick="refresh()">
                    <i class="fa-solid fa-users me-2"></i>정규파견관리 <i class="fa-solid fa-angle-right px-1"></i> 근로계약
                    <i class="fa-solid fa-angle-right px-1"></i> [{{ work_order.subsidiary.name }}] {{ work_order.customer.name }}
                </div>
            </div>

            <div class="col-12">
                <div class="card border border-light">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-3">
                            <div class="d-flex p-0">
                                <div class="d-none d-md-inline btn btn-secondary text-nowrap me-1 px-2.5" onclick="refresh()"
                                     data-toggle="tooltip" data-placement="top" title="새로고침 (F5)">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </div>

                                <select class="page_size form-select form-select-sm me-1" id="a_page_size"

                                    <option value="20" selected>20개</option>

                                    <option value="200">200개</option>

                                <select class="d-none d-md-inline page_size form-select form-select-sm me-1" id="sch_status"

                                    <option value="진행">진행</option>

                                        <i class="mdi mdi-magnify search-icon"></i>
                                    </div>
                                </div>

                                <button class="btn btn-secondary text-nowrap me-1 px-2.5" onclick="a_search_ready()">
                                    <i class="fa-solid fa-magnifying-glass"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">검색</span>
                                </button>

                                </button>
                                <button class="btn btn-warning text-nowrap ms-1 px-2.5" onclick="send_contract()">

                        <!-- 본문 영역 -->

                            <div class="custom_table table-responsive table-container">

                                        <col style="width: 2%"/>
                                        <col style="width: 5%"/>
                                        <col style="width: 5%"/>
                                        <col style="width: 5%"/>
                                        <col style="width: 5%"/>
                                        <col style="width: 5%"/>
                                        <col style="width: 10%"/>
                                        <col style="width: 5%"/>
                                        <col style="width: 5%"/>
                                        <col style="width: 5%"/>

                                            <th>근무시작일</th>

                                            <th>서명일자</th>

<script>
let work_order_id = {% if work_order %} {{ work_order.id }} {% else %} null {% endif %};
let doc_clear_flag = false;  // 입사지원서 제거 플래그

let all_sch;
let sch_status;

let a_nation_data = {
    cname: 'a_nation',  // 인스턴스 명과 일치해야함
    nation_id: 'a_nation_id',
    range: 5,
    page_size: 20,  // 세로 Row 수
};
let a_nation = new Nations(a_nation_data, a_search); // 인스턴스 명
a_nation.nation_display({});

$('#a_page_size').on('change', function () {
    localStorage.setItem('general_worker_list_page_size', $(this).val());
});

window.onkeydown = function (event) {
    if (event.keyCode == 116) {  // F5
        event.returnValue = false;
        refresh();
    }
}

document.getElementById("all_sch").addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
        a_search_ready();
    }
});

function refresh() {
    window.location.href = window.location.href
}

$(function () {
    let savedPageSize = localStorage.getItem('general_worker_list_page_size');
    if (savedPageSize) { $('#a_page_size').val(savedPageSize);}

    main();

    let container = document.querySelector(".table-container");
    container.style.maxHeight = `${window.innerHeight - 250}px`;
});

function main() {
    set_autocomplete('off');
    init_date_flatpickr();

    a_search_ready();
}

$(document).ready(function () {
    $('#select_all').on('change', function (e) {
        let checked = $(this).is(':checked');
        $('.td_chk_box').each(function () {
            $(this).prop('checked', checked);
            $(this).closest('tr').toggleClass('bg-light', checked);
        });
    });
});

function a_search_ready() {
    a_click_id = null;
    a_nation.page = 1;
    a_nation_data.page_size = $("#a_page_size").val();

    all_sch = $('#all_sch').val();
    sch_status = $('#sch_status').val();

    doc_clear_flag = false;

    a_search();
}

function a_search() {
    let query = "?page=" + a_nation.page + "&page_size=" + a_nation_data.page_size;
    query += "&DOID=" + work_order_id;
    if (all_sch) { query += "&all_sch=" + all_sch; }
    if (sch_status) { query += "&sch_status=" + sch_status; }

    fetch_gp("/general_worker_list_fn/" + query, 'GET', true, {}, (done) => {
        a_draw_table(done);
    });
}

function a_draw_table(done) {
    // console.log("a_draw_table: ", done);

    let data = done.results;
    if (data.length === 0) {
        let emptyRow = `
        <tr>
            <td colspan="99" style="text-align: center;" class="no_data">등록된 파견인원이 없습니다.<br>[정규파견관리]에서 파견인원을 편성해주세요.</td>
        </tr>`;
        $('#a_tbody').html(emptyRow);
        return;
    }

    let num = ((a_nation.page - 1) * a_nation_data.page_size) + 1;
    let rows = "";
    for (let i = 0; i < data.length; i++) {
        let item = data[i];

        let profileImage = item.user.profile_image ? `<img src="${item.user.profile_image}" alt="Profile Image" class="rounded-circle me-2" width="24" height="24">` : "";

        let fileTd = item.doc_url
            ? `<div class="d-flex align-items-center gap-1" id="doc_wrap_${item.id}">
                    <input type="file" class="form-control form-control-sm d-none" id="doc_file_${item.id}" name="doc_file_${item.id}" autocomplete="off">
                    <a href="${item.doc_url}" download class="btn btn-outline-primary btn-sm flex-fill" id="doc_download_${item.id}">
                        <i class="fa-solid fa-download"></i> 입사지원서 다운로드
                    </a>
                    <button type="button" class="btn btn-sm btn-danger px-2.5" onclick="doc_clear_btn(${item.id})" id="doc_remove_btn_${item.id}">
                        <i class="fa-solid fa-trash-can"></i>
                        <span class="d-none d-xl-inline m-0 p-0 ms-1">제거</span>
                    </button>
                </div>`
            : `<div class="d-flex align-items-center gap-1" id="doc_wrap_${item.id}">
                    <input type="file" class="form-control form-control-sm" id="doc_file_${item.id}" name="doc_file_${item.id}" autocomplete="off">
                    <button type="button" class="btn btn-sm btn-danger px-2.5" onclick="doc_clear_btn(${item.id})" id="doc_remove_btn_${item.id}">
                        <i class="fa-solid fa-trash-can"></i>
                        <span class="d-none d-xl-inline m-0 p-0 ms-1">제거</span>
                    </button>
                </div>`;

        let row = `
        <tr id='${item.id}' class='align-middle text-nowrap'>
            <td name="check_box" class="form-check-info" style="text-align: center; vertical-align: middle;">
                ${item.status === "진행" ? `<input type="checkbox" class="form-check-input checkbox_lg td_chk_box" value="${item.id}">` : ""}
            </td>
            <td>${num + i}</td>
            <td name="user_name" id="user_name_${item.id}">${profileImage} ${item.user.name || ""}</td>
            <td>${item.user.phone || ""}</td>
            <td>${item.job_title_name || "총원데이터에서 "}</td>
            <td><input id="start_date_${item.id}" type="text" value="${item.start_date || ''}" class="form-control form-control-sm date_flatpickr"></td>
            <td><input id="end_date_${item.id}" type="text" value="${item.end_date || ''}" class="form-control form-control-sm date_flatpickr"></td>
            <td class="d-none d-xl-table-cell">${fileTd}</td>
            <td name="status_badge">
                <span class="badge ${item.status === "완료" ? 'bg-success' : 'bg-primary'} font-size-12 px-2 py-1" style="width: 50px;">
                    ${item.status === "완료" ? '완료' : '진행'}
                </span>
            </td>
            <td class="py-0">${item.image ? `<img src="${item.image}" style="max-height:40px; height:auto; width:auto;">` : ""}</td>
            <td name="date">${item.date || ""}</td>
            <td class="py-0">
                <button class="btn btn-info text-nowrap px-2.5" onclick="a_popup_open('${item.status}', '${work_order_id}', '${item.id}', '${item.pdf_url}', this)">
                    <i class="fa-solid fa-file-contract"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">근로계약서</span>
                </button>
            </td>
        </tr>`;
        rows += row;
    }

    a_nation.nation_display(done);
    $('#a_tbody').html(rows);

    $('#a_tbody').on('click', '.td_chk_box', function (e) {
        let row = $(this).closest('tr'); // 체크박스가 속한 행 선택
        if (this.checked) {
            row.addClass('bg-light');  // 체크되었을 때 배경색 변경
        } else {
            row.removeClass('bg-light');  // 체크 해제 시 배경색 제거
        }
    });

    flatpickr(".date_flatpickr", {
        dateFormat: "Y-m-d",
        locale: "ko",
        allowInput: false,
        disableMobile: true, // 모바일에서 flatpickr 강제적용
        minDate: "",
    });
    $(".date_flatpickr").on("input", function(item) {
        let id = $(this).id.replace("start", "end");
        let min_date = $(this).val();
        let max_date = "9999-12-31";
        if ($(this).id.substring(0, 5) == "end") {
            id = $(this).id.replace("end", "start");
            min_date = "";
            max_date = $(this).val();
        }
        flatpickr(`#${id}`, {
            dateFormat: "Y-m-d",
            locale: "ko",
            allowInput: false,
            disableMobile: true, // 모바일에서 flatpickr 강제적용
            minDate: min_date,
            maxDate: max_date,
        });
    })
}


function send_contract() {
    let checkedBoxes = $('.td_chk_box:checked');
    if (checkedBoxes.length === 0) {
        alert("근로계약서를 발송할 대상을 선택하세요.");
        return;
    }

    let ids = [];
    let excluded = [];

    const ret = save_contract(false, true);
    if (ret) {
        checkedBoxes.each(function () {
            const workerId = $(this).val();
            const startDate = $(`#start_date_${workerId}`).val();
            const endDate = $(`#end_date_${workerId}`).val();
            const workerName = $(this).closest('tr').find("td[name='user_name']").text().trim();

            if (!startDate || !endDate) {
                excluded.push(`${workerName} (근무기간 미입력)`);
            } else {
                ids.push(workerId);
            }
        });

        if (ids.length === 0) {
            let msg = "발송 가능한 근로자가 없습니다.";
            if (excluded.length > 0) {
                msg += `\n\n제외된 근로자:\n- ${excluded.join('\n- ')}`;
            }
            alert(msg);
            return;
        }

        if (!confirm(`${ids.length}명의 근무자에게 근로계약 알림톡을 발송하시겠습니까?`)) return;

        const api_data = { ids: ids };

        fetch_gp('/send_kakao_general/', 'POST', true, api_data,
            (done) => {
                let successCount = 0;
                let failCount = 0;
                let failNames = [];

                if (done.results && done.results.length > 0) {
                    done.errors.forEach(r => {
                        failCount++;
                        failNames.push(`${r.name} (${r.error})`);
                    });
                    successCount = done.results.length - done.errors.length;
                } else {
                    alert("서버에서 발송 결과를 받지 못했습니다.");
                    return;
                }

                let msg = `알림톡 발송 완료\n성공: ${successCount}건, 실패: ${failCount}건`;
                if (failNames.length > 0) msg += `\n\n실패한 근무자:\n- ${failNames.join('\n- ')}`;
                if (excluded.length > 0) msg += `\n\n제외된 근무자:\n- ${excluded.join('\n- ')}`;

                alert(msg);
            },
            (err) => {
                console.error("발송 오류:", err);
                alert("알림톡 발송 중 오류가 발생했습니다.");
            }
        );
    }
}

// 근로계약서 팝업
function a_popup_open(status, work_order_id, worker_id, pdf_url, obj) {
    if (status == "완료") {
        window.open(`/view_daily_contract_document/?pdf_url=${pdf_url}`, '_blank', 'width=1000,height=1000,scrollbars=yes,resizable=yes');
    } else {
        if (save_contract(false, false, $(obj).closest("tr"))) {
            let url = `/general/con/${work_order_id}/${worker_id}/`;
            window.open(url, '_blank', 'width=1000,height=1000,scrollbars=yes,resizable=yes');
        }
    }
}

function save_contract(show_msg, checked_only, $rows) {
    if (!$rows) {
        $rows = $('#a_tbody tr');
    }
    if ($rows.length === 0 || $rows.find('.no_data').length > 0) {
        alert("근로자 목록이 없습니다.");
        return false;
    }
    
    if (show_msg) {
        if (!confirm("전체 근무자 목록의 [근무 시작일]과 [근무 종료일]을 저장 하시겠습니까?")) return false;
    }

    let saveData = [];
    let error = false;
    $rows.each(function () {
        const $row = $(this);
        const checked = $row.find("td[name='check_box'] input[type='checkbox']").is(":checked");
        if (!checked_only || checked) {
            const workerId = $row.attr('id');
            const workerName = $row.find("td[name='user_name']").text().trim();

            const start_date = ($row.find(`#start_date_${workerId}`).val() || '').trim();
            const end_date = ($row.find(`#end_date_${workerId}`).val() || '').trim();

            // 둘 다 비어있으면 저장대상 제외
            //if (!start_date && !end_date) return;

            if (!start_date || !end_date) {
                alert(`[${workerName}]님의 계약기간이 불완전합니다. 시작일과 종료일을 모두 입력하세요.`);
                saveData = []; // 전송 중단
                error = true;
                return false;  // each 탈출
            }

            // 기간 역전 체크
            if (new Date(start_date) > new Date(end_date)) {
                alert(`[${workerName}]님의 계약기간이 올바르지 않습니다. 시작일이 종료일보다 빠르거나 같아야 합니다.`);
                saveData = [];
                error = true;
                return false;
            }

            saveData.push({ worker_id: workerId, start_date, end_date });
        }
    });

    if (!error) {
        if (saveData.length === 0) {
            alert("저장 가능한 항목이 없어 처리를 중단합니다.");
            return;
        }
        
        let api_data = new FormData();
            api_data.append('save_data', JSON.stringify(saveData));
            api_data.append("doc_clear_map", JSON.stringify(doc_clear_map));

        // 개별 파일 첨부
        $('#a_tbody tr').each(function () {
            const $row = $(this);
            const workerId = $row.attr('id');
            const fileInput = $row.find(`input[name='doc_file_${workerId}']`)[0];
            if (fileInput && fileInput.files.length > 0) {
                api_data.append(`doc_file_${workerId}`, fileInput.files[0]);
            }
        });

        fetch_gp('/general_worker_save_contract_fn/', 'post', true, api_data, (done) => {
            if (show_msg) {
                a_search();
                alert(txt.update_ed);

                doc_clear_map = {};  // 초기화
            }
        });

        return true;
    } else {
        return false;
    }
}

let doc_clear_map = {};

function doc_clear_btn(workerId) {
    const $input = $(`#doc_file_${workerId}`);
    const $download = $(`#doc_download_${workerId}`);

    // input 초기화 및 보이기
    $input.val('');
    $input.removeClass('d-none');

    // 다운로드 버튼 숨기기
    if ($download.length) {
        $download.addClass('d-none');
    }
