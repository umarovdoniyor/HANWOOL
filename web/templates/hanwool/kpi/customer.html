<!-- 손익관리 > 거래처별 -->

<!DOCTYPE html>
<html style="overflow-x:hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}

<style>
/* select2 컨테이너 너비 지정 */
#sch_customer_class + .select2-container, #sch_user + .select2-container {
    width: 260px !important;
}

.sub_title {
    color: rgba(42,48,64,0.4);
    font-size: 20px;
    cursor: pointer;
    font-weight: 1000;
    transition: color 0.2s;
}
.sub_title:hover {
    color: #2a3040;
}
</style>

<!-- Content Area -->
<div class="row p-4">

    <!-- 게시물 목록 -->
    <div class="col-12">
        <div class="row gx-4">

            <!-- 상단 메뉴바 -->
            <div class="col-12">
                <div class="d-flex justify-content-between">
                    <div class="d-inline-block align-items-center mb-3" style="font-size: 20px; color: #2a3040; cursor: pointer; font-weight: 1000;" onclick="refresh()">
                        <i class="fa-solid fa-chart-line me-2"></i>손익관리 <i class="fa-solid fa-angle-right px-1"></i> 거래처별
                    </div>
                    
                    <div class="d-flex align-items-center mb-3 sub_title gap-3">
                        <div onclick="window.location.href='{% url 'kpi_center_page' %}'">센터별</div>
                        <div onclick="window.location.href='{% url 'kpi_subsidiary_page' %}'">관리법인별</div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="card border border-light">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-3">
                            <div class="d-flex p-0">
                                <div class="d-none d-md-inline btn btn-secondary text-nowrap me-1 px-2.5" onclick="refresh()"
                                     data-toggle="tooltip" data-placement="top" title="새로고침 (F5)">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </div>

                                <select class="page_size form-select form-select-sm me-1" id="a_year_filter" onchange="a_search_ready()">
                                    {% for year in year_range %}
                                        <option value="{{ year }}" {% if year == default_year %}selected{% endif %}>{{ year }}년</option>
                                    {% endfor %}
                                </select>
                            
                                <div class="d-none d-md-flex input-group input-daterange w-auto me-1" data-toggle="tooltip" data-placement="top" title="거래처 검색">
                                    <select class="d-none d-md-inline page_size form-select form-select-sm me-1 sch_sel2" id="sch_customer_class"
                                            onchange="a_search_ready()">
                                    </select>
                                </div>
                            
                                <select class="d-none d-md-inline page_size form-select form-select-sm me-1" id="sch_cost_type" style="width: 120px;"
                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="금액 종류 보기">
                                    <option value="">전체</option>
                                    <option value="영업이익" selected>영업이익</option>
                                    <option value="매출">매출</option>
                                    <option value="비용">비용</option>
                                </select>

                                <button class="btn btn-secondary text-nowrap me-1 px-2.5" onclick="a_search_ready()">
                                    <i class="fa-solid fa-magnifying-glass"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">검색</span>
                                </button>
                            </div>
                            
                            <div class="d-flex p-0">
                                <button class="btn btn-success text-nowrap ms-1 px-2.5" onclick="exportToExcel()">
                                    <i class="fa-solid fa-file-excel"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">엑셀 다운로드</span>
                                </button>
                            </div>
                        </div>

                        <!-- 본문 영역 -->
                        <div class="col-12">
                            <!-- 그래프 영역 -->
                            <div class="card border border-light">
                                <div class="card-body">
                                    <div class="" id="a_graph" style="height: 330px; max-height: 330px; margin-left: -10px;"></div>
                                </div>
                            </div>
                            
                            <!-- 테이블 영역 -->
                            <div class="custom_table table-responsive text-nowrap">
                                <table class="table" id="data-list">
                                </table>
                                <div class="div_center mt-3" id="a_nation_id"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let a_year_filter;
let sch_cost_type;
let sch_customer_class;

window.onkeydown = function (event) {
    if (event.keyCode == 116) {  // F5
        event.returnValue = false;
        refresh();
    }
}

function refresh() {
    let baseUrl = window.location.origin + window.location.pathname;
    window.location.href = baseUrl;
}

$(function () {
    main();
});

function main() {
    set_autocomplete('off');
    init_date_flatpickr();
    init_Select2('#sch_customer_class', '거래처 검색', '/sel2_code_customer_class/', {id: 'id', txt: item => `${item.text}`}, null, true);

    a_search_ready();
}

function select_this_year() {
    let selectElement = document.getElementById("a_year_filter");
    let currentYear = new Date().getFullYear();

    for (let i = 0; i < selectElement.options.length; i++) {
        if (selectElement.options[i].value == currentYear) {
            selectElement.selectedIndex = i;
            break;
        }
    }
}

// 선택대상 초기화 : 주로 create, delete 후 호출
function a_search_ready() {
    a_click_id = null;

    a_year_filter = $("#a_year_filter").val();
    sch_customer_class = $('#sch_customer_class').val();
    if (sch_customer_class == null || sch_customer_class == "all") {
        sch_customer_class = "";
    }
    sch_cost_type = $('#sch_cost_type').val();

    a_search();
}

// 선택대상 유지 : 주로 update 후 호출
function a_search() {
    let query = "?";
    if (a_year_filter) { query += "&sch_year=" + a_year_filter; }
    if (sch_customer_class) { query += "&sch_customer_class=" + sch_customer_class; }
    fetch_gp("/kpi_customer_summary_fn/" + query, 'GET', true, {}, (done) => {
        console.log("done:", done);
        a_draw_graph(done);
        a_draw_table(done);
    });
}

function a_draw_table(done) {
    if (!done || done.monthly_sales_list.length === 0) {
        $('#data-list').html(`
            <tr class="empty-row">
                <td colspan="30" style="text-align: center;">월별 통계 데이터가 없습니다.</td>
            </tr>`);
        return;
    }

    const selectedYear = a_year_filter || new Date().getFullYear();
    const shortYear = String(selectedYear).slice(-2);
    const monthKeys = Array.from({ length: 12 }, (_, i) => `${shortYear}/${String(i + 1).padStart(2, '0')}`);

    let head_html = [];
    for (let i = 0; i < 12; i++) {
        if (sch_cost_type === "매출") {
            head_html.push(`<th class="text-start">${i + 1}월 매출</th>`);
        } else if (sch_cost_type === "영업이익") {
            head_html.push(`<th class="text-start">${i + 1}월 영업이익</th>`);
        } else if (sch_cost_type === "비용") {
            head_html.push(`<th class="text-start">${i + 1}월 비용</th>`);
        } else { // 전체
            head_html.push(`<th colspan="2" class="text-center">${i + 1}월 매출/이익</th>`);
        }
    }
    if (sch_cost_type === "매출") {
        head_html.push(`<th class="text-start">합계 매출</th>`);
    } else if (sch_cost_type === "영업이익") {
        head_html.push(`<th class="text-start">합계 영업이익</th>`);
    } else if (sch_cost_type === "비용") {
        head_html.push(`<th class="text-start">합계 비용</th>`);
    } else {
        head_html.push(`<th colspan="2" class="text-center">합 계</th>`);
    }
    let monthly_html = [];
    for (let i = 0; i < done.customer_list.length; i++) {
        let customer_item = done.customer_list[i];
        monthly_html.push(`<tr class="align-middle text-nowrap">`);
        monthly_html.push(`<td>${i + 1}</td>`);
        monthly_html.push(`<td>${customer_item.name}</td>`);
        for (let j = 0; j < 13; j++) {
            let sales = 0;
            let profit = 0;
            let daily_cost = 0;
            let general_cost = 0;
            let etc_cost = 0;

            for (let k = 0; k < done.monthly_sales_list.length; k++) {
                let summary_item = done.monthly_sales_list[k];
                if (customer_item.id == summary_item.customer_id && (j == 12 || parseInt(summary_item.month) == j + 1)) {
                    sales += summary_item.sum_request_price;
                }
            }
            for (let k = 0; k < done.daily_summary_list.length; k++) {
                let summary_item = done.daily_summary_list[k];
                if (customer_item.id == summary_item.customer_id && (j == 12 || parseInt(summary_item.month) == j + 1)) {
                    //sales += summary_item.sum_request_price;
                    daily_cost += parseInt(summary_item.sum_result_price);
                }
            }
            for (let k = 0; k < done.general_summary_list.length; k++) {
                let summary_item = done.general_summary_list[k];
                if (customer_item.id == summary_item.customer_id && (j == 12 || parseInt(summary_item.month) == j + 1)) {
                    //sales += summary_item.sum_request_price;
                    general_cost += parseInt(summary_item.sum_result_price);
                }
            }
            for (let k = 0; k < done.recruit_list.length; k++) {
                let recruit_item = done.recruit_list[k];
                if (customer_item.id == recruit_item.customer_id && (parseInt(recruit_item.month) == j + 1)) {
                    etc_cost += recruit_item.total_cost;
                }
            }
            for (let k = 0; k < done.cost_list.length; k++) {
                let cost_item = done.cost_list[k];
                if (customer_item.id == cost_item.customer_id && (j == 12 || parseInt(cost_item.month) == j + 1)) {
                    etc_cost += cost_item.total_cost;
                }
            }
            for (let k = 0; k < done.card_list.length; k++) {
                let card_item = done.card_list[k];
                if (customer_item.id == card_item.customer_id && (j == 12 || parseInt(card_item.month) == j + 1)) {
                    etc_cost += card_item.total_cost;
                }
            }
            profit = sales - daily_cost - general_cost;
            let net_profit = profit - etc_cost;
            let margin = Math.round(sales == 0 ? 0 : net_profit / sales * 100);
            if (sch_cost_type === "매출") {
                monthly_html.push(`<td class="td-sales text-dark" style="color:#27ae60;;font-family:monospace">${formatNumber(sales)}</td>`);
            } else if (sch_cost_type === "영업이익") {
                monthly_html.push(`<td class="td-profit text-primary" title="매출: ${sales}\n영업이익: ${profit}\n비용: ${etc_cost}\n순이익: ${net_profit}\n마진율: ${margin}" style="font-family:monospace">${formatNumber(profit)} <small>(${margin}%)</small></td>`);
            } else if (sch_cost_type === "비용") {
                monthly_html.push(`<td class="td-sales text-primary" style="font-family:monospace">${formatNumber(etc_cost)} <small>(${margin}%)</small></td>`);
            } else {
                monthly_html.push(`
                    <td class="td-sales text-dark" style="color:#27ae60;font-family:monospace">${formatNumber(sales)}</td>
                    <td class="td-profit text-primary" style="font-family:monospace">${formatNumber(profit)} <small>(${margin}%)</small></td>
                `);
            }
        }
        monthly_html.push(`</tr>`);
    }
    let html = `
        <thead class="thead-light">
            <tr>
                <th>순번</th>
                <th>거래처</th>
                ${head_html.join("")}
            </tr>
        </thead>
        <tbody>
            ${monthly_html.join("")}
        </tbody>
    `;
    $("#data-list").html(html);
}

function a_draw_graph(done) {
    const container = document.querySelector("#a_graph");
    if (!container) return;

    if (!done || done.monthly_sales_list.length === 0) {
        container.innerHTML = `
            <div class='d-flex justify-content-center align-items-center text-muted' style='height:100%; min-height:200px;'>
                등록된 데이터가 없습니다.
            </div>`;
        return;
    }

    const categories = [];
    const salesData = [];
    const costData = [];
    const profitData = [];
    const marginData = [];

    for (let i = 0; i < 12; i++) {
        sales = 0;
        profit = 0;
        daily_cost = 0;
        general_cost = 0;
        etc_cost = 0;
        net_profit = 0;
        margin = 0;
        for (let j = 0; j < done.customer_list.length; j++) {
            let customer_item = done.customer_list[j];
            let rowsHtml = [];
            for (let k = 0; k < done.monthly_sales_list.length; k++) {
                let summary_item = done.monthly_sales_list[k];
                if (customer_item.id == summary_item.customer_id && parseInt(summary_item.month) == i + 1) {
                    sales += summary_item.sum_request_price;
                }
            }
            for (let k = 0; k < done.daily_summary_list.length; k++) {
                let summary_item = done.daily_summary_list[k];
                if (customer_item.id == summary_item.customer_id && parseInt(summary_item.month) == i + 1) {
                    //sales += summary_item.sum_request_price;
                    daily_cost += parseInt(summary_item.sum_result_price);
                }
            }
            for (let k = 0; k < done.general_summary_list.length; k++) {
                let summary_item = done.general_summary_list[k];
                if (customer_item.id == summary_item.customer_id && parseInt(summary_item.month) == i + 1) {
                    //sales += summary_item.sum_request_price;
                    general_cost += parseInt(summary_item.sum_result_price);
                }
            }
            for (let k = 0; k < done.recruit_list.length; k++) {
                let recruit_item = done.recruit_list[k];
                if (customer_item.id == recruit_item.customer_id && parseInt(recruit_item.month) == i + 1) {
                    etc_cost += recruit_item.total_cost;
                }
            }
            for (let k = 0; k < done.cost_list.length; k++) {
                let cost_item = done.cost_list[k];
                if (customer_item.id == cost_item.customer_id && parseInt(cost_item.month) == i + 1) {
                    etc_cost += cost_item.total_cost;
                }
            }
            for (let k = 0; k < done.card_list.length; k++) {
                let card_item = done.card_list[k];
                if (customer_item.id == card_item.customer_id && (j == 12 || parseInt(card_item.month) == j + 1)) {
                    etc_cost += card_item.total_cost;
                }
            }
        }
        profit = sales - daily_cost - general_cost;
        net_profit = profit - etc_cost;
        categories.push(`${i + 1}월`);
        salesData.push(sales);
        costData.push(etc_cost);
        profitData.push(net_profit);
        margin = Math.round(sales == 0 ? 0 : net_profit / sales * 100);
        marginData.push(margin || 0);
    }

    container.innerHTML = `<div id="a_graph_chart"></div>`;
    const chartEl = document.querySelector("#a_graph_chart");

    if (window.approval_cost_chart instanceof ApexCharts) {
        window.approval_cost_chart.destroy();
    }

    const chartOptions = {
        series: [
            { name: '매출', type: 'area', data: salesData },
            { name: '비용', type: 'area', data: costData },
            { name: '영업이익', type: 'column', data: profitData }
        ],
        chart: {
            height: 330,
            type: 'line',   // mixed chart: series별로 type 지정
            toolbar: { show: false },
            animations: { enabled: true, easing: 'easeInOut', speed: 800 }
        },
        colors: ['rgba(115,119,140,0.5)', 'rgba(162, 80, 125, 0.5)', 'rgba(41,128,185,0.5)'], // 매출=초록, 이익=파랑
        dataLabels: { enabled: false },
        stroke: { curve: 'smooth', width: [0, 0] }, // area=라인, column=막대
        xaxis: { categories, labels: { style: { fontSize: '12px' } } },
        yaxis: [
            {
                labels: {
                    formatter: val => {
                        if (val >= 1e8) return `${add_comma((val / 1e8).toFixed(1))} 억`;
                        if (val >= 1e4) return `${add_comma((val / 1e4).toFixed(1))} 만`;
                        return add_comma(val.toFixed(0));
                    },
                    style: { fontSize: '12px' }
                }
            }
        ],
        tooltip: { y: { formatter: val => add_comma(val.toFixed(0)) + ' 원' } },
        legend: { position: 'top' }
    };

    window.approval_cost_chart = new ApexCharts(chartEl, chartOptions);
    window.approval_cost_chart.render();
}

function formatNumber(val, cnt = 0) {
    if (val == null) return '';  // null, undefined 방지
    val = String(val);           // 문자열 강제 변환

    if (!val || val === '-' || val === '.' || val === '-.') return val;

    const [intPart, decPart] = val.split('.');
    const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    // 사용자가 소수점 입력했을 때만 소수점 표시
    if (val.includes('.') && cnt > 0) {
        return `${intFormatted}.${(decPart || '').slice(0, cnt)}`;
    }

    return intFormatted;
}

function add_comma(val) {
    const num = Number(val);
    return isNaN(num) ? val : num.toLocaleString();
}

function exportToExcel() {
    const tbody = document.querySelector('#a_tbody');
    if (!tbody) return;

    let wb = XLSX.utils.book_new();
    let ws_data = [];

    // 헤더 동적 구성
    let headerRow = ["순번", "거래처"];

    for (let i = 1; i <= 12; i++) {
        if (sch_cost_type === "매출") {
            headerRow.push(`${i}월 매출`);
        } else if (sch_cost_type === "영업이익") {
            headerRow.push(`${i}월 영업이익`);
        } else {
            headerRow.push(`${i}월 매출`);
            headerRow.push(`${i}월 영업이익`);
        }
    }

    if (sch_cost_type === "매출") {
        headerRow.push("합계 매출");
    } else if (sch_cost_type === "영업이익") {
        headerRow.push("합계 영업이익");
    } else {
        headerRow.push("합계 매출");
        headerRow.push("합계 영업이익");
    }

    ws_data.push(headerRow);

    // 바디 데이터 수집
    tbody.querySelectorAll('tr').forEach(row => {
        let rowData = [];
        row.querySelectorAll('td').forEach(cell => {
            // 숫자/퍼센트 분리 → 퍼센트는 괄호 포함 그대로 붙임
            rowData.push(cell.innerText.trim());
        });
        if (rowData.length > 0) {
            ws_data.push(rowData);
        }
    });

    // 시트 생성 & 다운로드
    let ws = XLSX.utils.aoa_to_sheet(ws_data);
    XLSX.utils.book_append_sheet(wb, ws, "손익관리_거래처별");
    XLSX.writeFile(wb, "손익관리_거래처별.xlsx");
}

</script>
