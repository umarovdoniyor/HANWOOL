<!DOCTYPE html>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let a_year_filter;
let sch_subsidiary;

window.onkeydown = function (event) {
    if (event.keyCode == 116) {  // F5
        event.returnValue = false;
        refresh();
    }
}

function refresh() {
    let baseUrl = window.location.origin + window.location.pathname;
    window.location.href = baseUrl;
}

$(function () {
    main();
});

function main() {
    set_autocomplete('off');
    init_date_flatpickr();
    init_Select2('#sch_subsidiary', '관리법인 검색', '/sel2_hanwool_subsidiary/', {id: 'id', txt: item => `${item.text}`}, null, true);

    a_search_ready();
}

function select_this_year() {
    let selectElement = document.getElementById("a_year_filter");
    let currentYear = new Date().getFullYear();

    for (let i = 0; i < selectElement.options.length; i++) {
        if (selectElement.options[i].value == currentYear) {
            selectElement.selectedIndex = i;
            break;
        }
    }
}

// 선택대상 초기화 : 주로 create, delete 후 호출
function a_search_ready() {
    a_click_id = null;
    a_year_filter = $("#a_year_filter").val();
    sch_subsidiary = $('#sch_subsidiary').val();
    if (sch_subsidiary == null || sch_subsidiary == "all") {
        sch_subsidiary = "";
    }

    a_search();
}

// 선택대상 유지 : 주로 update 후 호출
function a_search() {
    let query = "?";
    if (a_year_filter) { query += "&sch_year=" + a_year_filter; }
    if (sch_subsidiary) { query += "&sch_subsidiary=" + sch_subsidiary; }
    fetch_gp("/kpi_subsidiary_summary_fn/" + query, 'GET', true, {}, (done) => {
        console.log("done:", done);
        a_draw_graph(done);
        a_draw_table(done);
    });
}

function a_draw_table(done) {
    if (!done || done.subsidiary_list.length === 0) {
        $('#data-list').html(`
            <tr class="empty-row">
                <td colspan="99" style="text-align: center;">월별 통계 데이터가 없습니다.</td>
            </tr>
        `);
        return;
    }

    $('#data-list').html("");
    let rowsHtml = [];
    let sales = 0;
    let profit = 0;
    let daily_cost = 0;
    let general_cost = 0;
    let etc_cost = 0;
    let net_profit = 0;
    let margin = 0;
    for (let i = 0; i < 12; i++) {
        sales = 0;
        profit = 0;
        daily_cost = 0;
        general_cost = 0;
        etc_cost = 0;
        net_profit = 0;
        margin = 0;
        for (let j = 0; j < done.subsidiary_list.length; j++) {
            let subsidiary_item = done.subsidiary_list[j];
            let rowsHtml = [];
            for (let k = 0; k < done.monthly_sales_list.length; k++) {
                let summary_item = done.monthly_sales_list[k];
                if (subsidiary_item.id == summary_item.subsidiary_id &&  parseInt(summary_item.month) == i + 1) {
                    sales += summary_item.sum_request_price;
                }
            }
            for (let k = 0; k < done.daily_summary_list.length; k++) {
                let summary_item = done.daily_summary_list[k];

                if (subsidiary_item.id == summary_item.subsidiary_id && parseInt(summary_item.month) == i + 1) {
                    daily_cost += parseInt(summary_item.sum_result_price);
                }
            }
            for (let k = 0; k < done.general_summary_list.length; k++) {
                let summary_item = done.general_summary_list[k];

                if (subsidiary_item.id == summary_item.subsidiary_id && parseInt(summary_item.month) == i + 1) {
                    general_cost += parseInt(summary_item.sum_result_price);
                }
            }
            for (let k = 0; k < done.recruit_list.length; k++) {
                let recruit_item = done.recruit_list[k];

                if (subsidiary_item.id == recruit_item.subsidiary_id && parseInt(recruit_item.month) == i + 1) {
                    etc_cost += recruit_item.total_cost;
                }
            }
            for (let k = 0; k < done.cost_list.length; k++) {
                let cost_item = done.cost_list[k];

                if (subsidiary_item.id == cost_item.subsidiary_id && parseInt(cost_item.month) == i + 1) {
                    etc_cost += cost_item.total_cost;
                }
            }
            for (let k = 0; k < done.card_list.length; k++) {
                let card_item = done.card_list[k];

                if (subsidiary_item.id == card_item.subsidiary_id && parseInt(card_item.month) == i + 1) {
                    etc_cost += card_item.total_cost;
                }
            }
            if (subsidiary_item.sum_salary) {
                for (let k = 0; k < subsidiary_item.sum_salary.length; k++) {
                    let salary_item = subsidiary_item.sum_salary[k];

                    if (parseInt(salary_item.start_date_month) == i + 1) {
                        etc_cost += salary_item.total_cost;
                    }
                }
            }
        }
        profit = sales - daily_cost - general_cost;
        net_profit = profit - etc_cost;
        margin = Math.round(sales == 0 ? 0 : net_profit / sales * 100);
        rowsHtml.push(get_table_row(i + 1, sales, profit, etc_cost, net_profit, margin));
    }
    let html = `
        <div class="col-12 col-lg-6 col-xl-6 col-xxl-6">
            <table class="table">
                ${get_table_header("전체 법인")}
                <tbody>
                ${rowsHtml.join("")}
                </tbody>
            </table>
        </div>
    `;
    $('#data-list').append(html);
    for (let i = 0; i < done.subsidiary_list.length; i++) {
        rowsHtml = [];
        let subsidiary_item = done.subsidiary_list[i];
        for (let j = 0; j < 12; j++) {
            sales = 0;
            profit = 0;
            daily_cost = 0;
            general_cost = 0;
            etc_cost = 0;
            for (let k = 0; k < done.monthly_sales_list.length; k++) {
                let summary_item = done.monthly_sales_list[k];
                if (subsidiary_item.id == summary_item.subsidiary_id && parseInt(summary_item.month) == j + 1) {
                    sales += summary_item.sum_request_price;
                }
            }
            for (let k = 0; k < done.daily_summary_list.length; k++) {
                let summary_item = done.daily_summary_list[k];

                if (subsidiary_item.id == summary_item.subsidiary_id && parseInt(summary_item.month) == j + 1) {
                    //sales += summary_item.sum_request_price;
                    daily_cost += parseInt(summary_item.sum_result_price);
                }
            }
            for (let k = 0; k < done.general_summary_list.length; k++) {
                let summary_item = done.general_summary_list[k];

                if (subsidiary_item.id == summary_item.subsidiary_id && parseInt(summary_item.month) == j + 1) {
                    //sales += summary_item.sum_request_price;
                    general_cost += parseInt(summary_item.sum_result_price);
                }
            }
            for (let k = 0; k < done.recruit_list.length; k++) {
                let recruit_item = done.recruit_list[k];

                if (subsidiary_item.id == recruit_item.subsidiary_id && parseInt(recruit_item.month) == j + 1) {
                    etc_cost += recruit_item.total_cost;
                }
            }
            for (let k = 0; k < done.cost_list.length; k++) {
                let cost_item = done.cost_list[k];

                if (subsidiary_item.id == cost_item.subsidiary_id && parseInt(cost_item.month) == j + 1) {
                    etc_cost += cost_item.total_cost;
                }
            }
            for (let k = 0; k < done.card_list.length; k++) {
                let card_item = done.card_list[k];

                if (subsidiary_item.id == card_item.subsidiary_id && parseInt(card_item.month) == j + 1) {
                    etc_cost += card_item.total_cost;
                }
            }
            if (subsidiary_item.sum_salary) {
                for (let k = 0; k < subsidiary_item.sum_salary.length; k++) {
                    let salary_item = subsidiary_item.sum_salary[k];

                    if (parseInt(salary_item.start_date_month) == i + 1) {
                        etc_cost += salary_item.total_cost;
                    }
                }
            }
            profit = sales - daily_cost - general_cost;
            net_profit = profit - etc_cost;
            margin = Math.round(sales == 0 ? 0 : net_profit / sales * 100);
            rowsHtml.push(get_table_row(j + 1, sales, profit, etc_cost, net_profit, margin));
        }
        let html = `
            <div class="col-12 col-lg-6 col-xl-6 col-xxl-6">
                <table class="table">
                    ${get_table_header(subsidiary_item.name)}
                    <tbody>
                    ${rowsHtml.join("")}
                    </tbody>
                </table>
            </div>
        `;
        $('#data-list').append(html);
    }
}

function get_table_header(name) {
    return `
        <thead class="thead-light">
            <tr>
                <th rowspan="2" class="text-nowrap subsidiary-group" style="width:6%">월</th>
                <th colspan="5" class="text-center subsidiary-group">${name}</th>
            </tr>
            <tr class="text-nowrap">
                <th style="width:20%">매출</th>
                <th style="width:20%">영업이익</th>
                <th style="width:20%">비용</th>
                <th style="width:20%">순이익</th>
                <th style="width:14%" class="subsidiary-group">이익률%</th>
            </tr>
        </thead>
    `;
}

function get_table_row(month, sales, profit, cost, netProfit, margin) {
    return `
        <tr>
            <td class="text-center subsidiary-group" style="font-family:monospace">${month}월</td>
            <td class="text-dark text-end" style="font-family:monospace">${formatNumber(sales)}</td>
            <td class="text-primary text-end" style="font-family:monospace">${formatNumber(profit)}</td>
            <td class="text-danger text-end" style="font-family:monospace">${formatNumber(cost)}</td>
            <td class="text-success fw-bold text-end" style="font-family:monospace">${formatNumber(netProfit)}</td>
            <td class="text-success text-end subsidiary-group" style="font-family:monospace">${margin}%</td>
        </tr>
    `;
}

function a_draw_graph(done) {
    const container = document.querySelector("#a_graph");
    if (!container) return;

    if (!done || done.monthly_sales_list.length === 0) {
        container.innerHTML = `
            <div class='d-flex justify-content-center align-items-center text-muted' style='height:100%; min-height:200px;'>
                등록된 데이터가 없습니다.
            </div>`;
        return;
    }

    const categories = [];
    const profitData = [];
    const marginData = [];

    for (let i = 0; i < 12; i++) {
        sales = 0;
        profit = 0;
        cost = 0;
        net_profit = 0;
        margin = 0;
        for (let j = 0; j < done.subsidiary_list.length; j++) {
            let subsidiary_item = done.subsidiary_list[j];
            let rowsHtml = [];
            for (let k = 0; k < done.monthly_sales_list.length; k++) {
                let summary_item = done.monthly_sales_list[k];
                if (subsidiary_item.id == summary_item.subsidiary_id && parseInt(summary_item.month) == i + 1) {
                    sales += summary_item.sum_request_price;
                }
            }
            for (let k = 0; k < done.daily_summary_list.length; k++) {
                let summary_item = done.daily_summary_list[k];

                if (subsidiary_item.id == summary_item.subsidiary_id && parseInt(summary_item.month) == i + 1) {
                    //sales += summary_item.sum_request_price;
                    profit += parseInt(summary_item.sum_profit);
                }
            }
            for (let k = 0; k < done.general_summary_list.length; k++) {
                let summary_item = done.general_summary_list[k];

                if (subsidiary_item.id == summary_item.subsidiary_id && parseInt(summary_item.month) == i + 1) {
                    //sales += summary_item.sum_request_price;
                    profit += parseInt(summary_item.sum_profit);
                }
            }
            for (let k = 0; k < done.recruit_list.length; k++) {
                let recruit_item = done.recruit_list[k];

                if (subsidiary_item.id == recruit_item.subsidiary_id && parseInt(recruit_item.month) == i + 1) {
                    cost += recruit_item.total_cost;
                }
            }
            for (let k = 0; k < done.cost_list.length; k++) {
                let cost_item = done.cost_list[k];

                if (subsidiary_item.id == cost_item.subsidiary_id && parseInt(cost_item.month) == i + 1) {
                    cost += cost_item.total_cost;
                }
            }
        }
        net_profit = profit - cost;
        categories.push(`${i + 1}월`);
        profitData.push(net_profit);
        margin = Math.round(sales == 0 ? 0 : net_profit / sales * 100);
        marginData.push(margin || 0);
    }

    container.innerHTML = `<div id="a_graph_chart"></div>`;
    const chartEl = document.querySelector("#a_graph_chart");

    if (window.approval_cost_chart instanceof ApexCharts) {
        window.approval_cost_chart.destroy();
    }

    // y축 범위 동적 계산
    const minMargin = Math.min(...marginData);
    const maxMargin = Math.max(...marginData);

    const chartOptions = {
        series: [
            { name: '순이익', type: 'column', data: profitData },
            { name: '이익률%', type: 'line', data: marginData }
        ],
        chart: {
            height: 330,
            type: 'line',
            stacked: false,
            toolbar: { show: false }
        },
        stroke: {
            width: [0, 2],
            curve: "smooth"
        },
        dataLabels: { enabled: false },
        xaxis: { categories },
        yaxis: [
            {
                title: { text: "순이익 (원)" },
                labels: {
                    formatter: val => {
                        if (val >= 1e8) return `${add_comma((val / 1e8).toFixed(1))} 억`;
                        if (val >= 1e4) return `${add_comma((val / 1e4).toFixed(1))} 만`;
                        return add_comma(val.toFixed(0));
                    }
                }
            },
            {
                opposite: true,
                title: { text: "이익률 (%)" },
                labels: { formatter: val => `${val.toFixed(1)}%` },
                min: Math.floor(minMargin / 10) * 10,  // 최소값을 실제 데이터 기준으로
                max: Math.ceil(maxMargin / 10) * 10    // 최대값도 실제 데이터 기준으로
            }
        ],
        tooltip: {
            shared: true,
            intersect: false,
            y: {
                formatter: (val, { seriesIndex }) => {
                    if (seriesIndex === 1) {
                        return `${parseFloat(val).toFixed(1)}%`;
                    } else {
                        if (val >= 1e8) return `${add_comma((val / 1e8).toFixed(1))} 억 원`;
                        if (val >= 1e4) return `${add_comma((val / 1e4).toFixed(1))} 만 원`;
                        return add_comma(val.toFixed(0)) + " 원";
                    }
                }
            }
        },
        legend: { position: "top" }
    };

    window.approval_cost_chart = new ApexCharts(chartEl, chartOptions);
    window.approval_cost_chart.render();
}

function formatNumber(val, cnt = 0) {
    if (val == null) return '';  // null, undefined 방지
    val = String(val);           // 문자열 강제 변환

    if (!val || val === '-' || val === '.' || val === '-.') return val;

    const [intPart, decPart] = val.split('.');
    const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    // 사용자가 소수점 입력했을 때만 소수점 표시
    if (val.includes('.') && cnt > 0) {
        return `${intFormatted}.${(decPart || '').slice(0, cnt)}`;
    }

    return intFormatted;
}

function add_comma(val) {
    const num = Number(val);
    return isNaN(num) ? val : num.toLocaleString();
}

function exportToExcel() {
    const tbody = document.querySelector('#a_tbody');
    if (!tbody) return;

    let wb = XLSX.utils.book_new();
    let ws_data = [];

    // -------------------------------
    // 헤더 2줄 (법인 그룹, 항목들)
    // -------------------------------
    const table = document.querySelector('.table');
    const thead = table.querySelector('thead');
    const headRows = thead.querySelectorAll('tr');

    headRows.forEach(tr => {
        let rowData = [];
        tr.querySelectorAll('th').forEach(th => {
            // 병합(colspan, rowspan) 반영
            const colspan = th.getAttribute("colspan");
            const rowspan = th.getAttribute("rowspan");
            let text = th.innerText.trim();

            if (colspan && colspan > 1) {
                rowData.push(text);
                for (let i = 1; i < colspan; i++) {
                    rowData.push(""); // 병합된 칸은 빈 문자열
                }
            } else {
                rowData.push(text);
            }
        });
        ws_data.push(rowData);
    });

    // -------------------------------
    // 본문 데이터
    // -------------------------------
    tbody.querySelectorAll('tr').forEach(tr => {
        let rowData = [];
        tr.querySelectorAll('td').forEach(td => {
            rowData.push(td.innerText.trim());
        });
        if (rowData.length > 0) ws_data.push(rowData);
    });

    // -------------------------------
    // 시트 생성 & 다운로드
    // -------------------------------
    let ws = XLSX.utils.aoa_to_sheet(ws_data);

    // 스타일 병합 (colspan/rowspan 지원)
    // thead 병합 처리
    let merge = [];
    let colIndex = 0;
    headRows.forEach((tr, rIdx) => {
        colIndex = 0;
        tr.querySelectorAll('th').forEach(th => {
            const colspan = parseInt(th.getAttribute("colspan") || "1");
            const rowspan = parseInt(th.getAttribute("rowspan") || "1");

            if (colspan > 1 || rowspan > 1) {
                merge.push({
                    s: { r: rIdx, c: colIndex },
                    e: { r: rIdx + rowspan - 1, c: colIndex + colspan - 1 }
                });
            }
            colIndex += colspan;
        });
    });
    ws['!merges'] = merge;

    XLSX.utils.book_append_sheet(wb, ws, "손익관리_관리법인별");
