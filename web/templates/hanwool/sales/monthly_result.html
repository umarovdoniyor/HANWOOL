<!-- 매출/지출관리 > 결제/미수관리 -->

<!DOCTYPE html>
<html style="overflow-x:hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}

<style>
/* select2 컨테이너 너비 지정 */
#sch_subsidiary + .select2-container {
    width: 180px !important;
}

#sch_customer_class + .select2-container {
    width: 160px !important;
}

#sch_customer + .select2-container {
    width: 220px !important;
}

</style>

<!-- Content Area -->
<div class="row p-4">

    <!-- 게시물 목록 -->
    <div class="col-12">
        <div class="row gx-4">

            <!-- 상단 메뉴바 -->
            <div class="col-xxl-12">
                <div class="d-inline-block align-items-center mb-3" style="font-size: 20px; color: #2a3040; cursor: pointer; font-weight: 1000;" onclick="refresh()">
                    <i class="fa-solid fa-money-check-dollar me-2"></i>결제/미수관리
                    <i class="fa-regular fa-circle-question fa-2xs" style="vertical-align: super;" data-toggle="tooltip" data-placement="top" onclick="event.stopPropagation();"
                    title="• 거래처별 결제상태와 미수현황을 관리하는 페이지 입니다.<br>• 수정하려는 항목에서 더블클릭하면 수정 팝업이 열립니다."></i>
                </div>
            </div>

            <div class="col-12">
                <div class="card border border-light">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-3">
                            <div class="d-flex p-0">
                                <div class="d-none d-md-inline btn btn-secondary text-nowrap me-1 px-2.5" onclick="refresh()"
                                     data-toggle="tooltip" data-placement="top" title="새로고침 (F5)">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </div>

                                <select class="d-none d-md-inline page_size form-select form-select-sm me-1" id="a_page_size"
                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="리스트에서 표시할 수량">
                                    <option value="10">10개</option>
                                    <option value="20" selected>20개</option>
                                    <option value="50">50개</option>
                                    <option value="100">100개</option>
                                    <option value="200">200개</option>
                                    <option value="500">500개</option>
                                </select>

                                <select id="sch_year" class="page_size form-select form-select-sm me-1"
                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="청구연도 검색">
                                    <option value="">전체</option>
                                    {% for year in year_range %}
                                        <option value="{{ year }}" {% if year == default_year %}selected{% endif %}>{{ year }}년</option>
                                    {% endfor %}
                                </select>
                                
                                <select id="sch_month" class="page_size form-select form-select-sm me-1"
                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="청구월 검색">
                                    <option value="">전체</option> <option value="01">1월</option > <option value="02">2월</option>
                                    <option value="03">3월</option> <option value="04">4월</option> <option value="05">5월</option>
                                    <option value="06">6월</option> <option value="07">7월</option> <option value="08">8월</option>
                                    <option value="09">9월</option> <option value="10">10월</option> <option value="11">11월</option>
                                    <option value="12">12월</option>
                                </select>
                                        
                                <div class="d-none d-lg-flex input-group input-daterange w-auto me-1" data-toggle="tooltip" data-placement="top" title="관리법인 검색">
                                    <select class="d-none d-md-inline page_size form-select form-select-sm me-1 sch_sel2" id="sch_subsidiary"
                                            onchange="a_search_ready()">
                                    </select>
                                </div>
                                
                                <div class="d-none d-md-flex input-group input-daterange w-auto me-1" data-toggle="tooltip" data-placement="top" title="거래처 검색">
                                    <select class="d-none d-md-inline page_size form-select form-select-sm me-1 sch_sel2" id="sch_customer_class"
                                            onchange="a_search_ready()">
                                    </select>
                                </div>

                                <div class="d-none d-md-flex input-group input-daterange w-auto me-1" data-toggle="tooltip" data-placement="top" title="센터 검색">
                                    <select class="d-none d-md-inline page_size form-select form-select-sm me-1 sch_sel2" id="sch_customer"
                                            onchange="a_search_ready()">
                                    </select>
                                </div>

                                <select class="d-none d-md-inline page_size form-select form-select-sm me-1" id="sch_is_send"
                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="청구 여부로 검색">
                                    <option value="">모두</option>
                                    <option value="true">청구</option>
                                    <option value="false">미청구</option>
                                </select>

                                <select class="d-none d-md-inline page_size form-select form-select-sm me-1" id="sch_is_done"
                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="결제 여부로 검색">
                                    <option value="">모두</option>
                                    <option value="true">결제</option>
                                    <option value="false">미수</option>
                                </select>

                                <button class="btn btn-secondary text-nowrap me-1 px-2.5" onclick="a_search_ready()">
                                    <i class="fa-solid fa-magnifying-glass"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">검색</span>
                                </button>
                            </div>

                            <div class="d-flex p-0">
                                <button class="btn btn-warning text-nowrap ms-1 px-2.5" onclick="a_update_modal_in()">
                                    <i class="fa-solid fa-pen"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">수정</span>
                                </button>

                                <div class="d-flex position-relative p-0">
                                    <div class="d-none d-md-block btn btn-info dropdown-toggle text-nowrap ms-1 px-2.5" data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="fa-solid fa-wand-sparkles"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">옵션</span></div>
                                        <ul class="dropdown-menu dropdown-menu-end">
                                            <li><button class="dropdown-item" type="button" onclick="a_popup_open()">
                                            <i class="fa-solid fa-file-invoice me-2"></i>결제/미수 통계</button></li>
                                        </ul>
                                </div>
                            </div>
                        </div>

                        <!-- 건별 게시물 -->
                        <div class="custom_table table-responsive">
                            <table class="table">
                                <thead class="thead-light">
                                    <tr class="text-nowrap">
                                        <th>순번</th>
                                        <th>청구월</th>
                                        <th>관리법인</th>
                                        <th>거래처</th>
                                        <th>센터</th>

                                        <th>청구여부</th>
                                        <th>총 청구액</th>
                                        <th>결제금액</th>
                                        <th>미수금액</th>
                                        <th>결제율(%)</th>
                                        <th>결제일</th>
                                        <th>결제여부</th>
                                    </tr>
                                </thead>
                                <tbody id="a_tbody"></tbody>
                            </table>
                        </div>
                        <div class="div_center mt-3" id="a_nation_id"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- a_update_modal -->
<div class="modal fade" id="a_update_modal" tabindex="-1" role="dialog" aria-labelledby="a_update_modal"
     data-bs-backdrop="static" data-bs-keyboard="true" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header d-flex justify-content-between align-items-center">
                <h5 class="modal-title mx-2">매출 관리 <i class="fa-solid fa-angle-right px-1"></i> 월별 청구 수정</h5>
                <div>
                    <i class="fa-solid fa-expand fa-lg text-white mx-2" title="전체화면" style="cursor: pointer;" id="md_fullscreen_update"></i>
                    <i class="fa-solid fa-rotate-right fa-lg text-white mx-2" title="초기화" style="cursor: pointer;" onclick="a_update_modal_reset()"></i>
                    <i class="fa-solid fa-xmark fa-xl text-white mx-2" title="닫기" style="cursor: pointer;" data-bs-dismiss="modal"></i>
                </div>
            </div>

            <div class="modal-body w-100 p-4">
                <!-- 단일 영역 -->
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label fw-bold">청구 일자</label>
                        <div class="d-flex align-items-center gap-2">
                            <label for="year" class="form-label mb-0">청구연도</label>
                            <select id="year" class="form-select form-select-sm me-3" style="width: auto;" disabled></select>
                            <label for="month" class="form-label mb-0">청구월</label>
                            <select id="month" class="form-select form-select-sm" style="width: auto;" disabled></select>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="subsidiary" class="form-label fw-bold">관리 법인
                            <button class="btn btn-sm px-1 py-0"
                                    onclick="window.open('{% url 'factory_customer_list_page' %}', '_blank', 'width=1500,height=900,left=100,top=50,noopener,noreferrer')">
                                <i class="fa-solid fa-up-right-from-square"></i>
                            </button>
                        </label>
                        <select class="form-control div_required" id="subsidiary" disabled></select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="customer" class="form-label fw-bold">센터
                            <button class="btn btn-sm px-1 py-0"
                                    onclick="window.open('{% url 'factory_customer_list_page' %}', '_blank', 'width=1500,height=900,left=100,top=50,noopener,noreferrer')">
                                <i class="fa-solid fa-up-right-from-square"></i>
                            </button>
                        </label>
                        <select class="form-control div_required" id="customer" disabled></select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="total_price" class="form-label">총 청구액</label>
                        <input id="total_price" type="text" class="form-control" onkeyup="checkNumber(this, 2)" disabled>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="is_send" class="form-label">청구 여부</label>
                        <select id="is_send" class="text-left form-select">
                            <option value="false">미청구</option>
                            <option value="true">청구</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="paid_price" class="form-label">결제금액</label>
                        <input id="paid_price" type="text" class="form-control" onkeyup="checkNumber(this, 2)">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="is_done" class="form-label">결제 여부</label>
                        <select id="is_done" class="text-left form-select">
                            <option value="false">미수</option>
                            <option value="true">결제</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="paid_date" class="form-label">결제일</label>
                        <input type="text" class="form-control date_flatpickr" id="paid_date">
                    </div>
                </div>
            </div>

            <div class="modal-footer d-flex justify-content-end">
                <div class="col-8 d-flex justify-content-end">
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" onclick="a_update_modal_reset()">초기화</div>
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" onclick="a_update_submit()">수정</div>
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" data-bs-dismiss="modal">닫기</div>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
let a_click_id;
let a_click_year;
let a_click_month;
let a_click_subsidiary_id;
let a_click_subsidiary_name;
let a_click_customer_id;
let a_click_customer_name;
let a_click_total_price;
let a_click_is_send;
let a_click_is_done;
let a_click_paid_price;
let a_click_paid_date;

let sch_year;
let sch_month;
let sch_subsidiary;
let sch_customer;
let sch_customer_class;
let sch_is_send;
let sch_is_done;

let a_nation_data = {
    cname: 'a_nation',  // 인스턴스 명과 일치해야함
    nation_id: 'a_nation_id',
    range: 5,
    page_size: 20,  // 세로 Row 수
};
let a_nation = new Nations(a_nation_data, a_search); // 인스턴스 명
a_nation.nation_display({});

$('#a_page_size').on('change', function () {
    localStorage.setItem('monthly_result_page_size', $(this).val());
});
$('#sch_is_send').on('change', function () {
    localStorage.setItem('monthly_result_sch_is_send', $(this).val());
});
$('#sch_is_done').on('change', function () {
    localStorage.setItem('monthly_result_sch_is_done', $(this).val());
});
$('#sch_month').on('change', function () {
    localStorage.setItem('monthly_result_sch_month', $(this).val());
});

window.onkeydown = function (event) {
    if (event.keyCode == 116) {  // F5
        event.returnValue = false;
        refresh();
    }
}

function refresh() {
    window.location.href = window.location.href
}

$(function () {
    let savedPageSize = localStorage.getItem('monthly_result_page_size');
    if (savedPageSize) { $('#a_page_size').val(savedPageSize);}

    let saved_sch_is_send = localStorage.getItem('monthly_result_sch_is_send');
    if (saved_sch_is_send) { $('#sch_is_send').val(saved_sch_is_send);}
    
    let saved_sch_is_done = localStorage.getItem('monthly_result_sch_is_done');
    if (saved_sch_is_done) { $('#sch_is_done').val(saved_sch_is_done);}
    
    let saved_sch_month = localStorage.getItem('monthly_result_sch_month');
    if (saved_sch_month) { $('#sch_month').val(saved_sch_month);}
    
    const today = new Date();
    const currentYear = today.getFullYear();
    $('#sch_year').val(currentYear);

    main();
});

function main() {
    set_autocomplete('off');
    init_date_flatpickr();
    a_search_ready();
    
    init_Select2('#sch_subsidiary', '관리법인 검색', '/sel2_hanwool_subsidiary/', {id: 'id', txt: item => `${item.text}`});
    init_Select2('#sch_customer', '센터 검색', '/sel2_hanwool_customer/', {id: 'id', txt: item => `${item.text}`});
    init_Select2('#sch_customer_class', '거래처 검색', '/sel2_code_customer_class/', {id: 'id', txt: item => `${item.text}`});
}

function a_search_ready() {
    a_click_id = null;
    a_nation.page = 1;
    a_nation_data.page_size = $("#a_page_size").val();

    sch_year = $('#sch_year').val();
    sch_month = $('#sch_month').val();
    sch_subsidiary = $('#sch_subsidiary').val();
    sch_customer = $('#sch_customer').val();
    sch_customer_class = $('#sch_customer_class').val();
    sch_is_send = $('#sch_is_send').val();
    sch_is_done = $('#sch_is_done').val();

    a_search();
}

function a_search() {
    let query = "?page=" + a_nation.page + "&page_size=" + a_nation_data.page_size;
    if (sch_year) { query += "&sch_year=" + sch_year; }
    if (sch_month) { query += "&sch_month=" + sch_month; }
    if (sch_subsidiary) { query += "&sch_subsidiary=" + sch_subsidiary; }
    if (sch_customer) { query += "&sch_customer=" + sch_customer; }
    if (sch_customer_class) { query += "&sch_customer_class=" + sch_customer_class; }
    if (sch_is_send) { query += "&sch_is_send=" + sch_is_send; }
    if (sch_is_done) { query += "&sch_is_done=" + sch_is_done; }

    fetch_gp("/sales_monthly_list_fn/" + query, 'GET', true, {}, (done) => {
        a_draw_table(done);
    });
}

function a_draw_table(done) {
    // console.log("a_draw_table: ", done);

    let data = done.results;
    if (data.length === 0) {
        let emptyRow = `
        <tr>
            <td colspan="99" style="text-align: center;">등록된 데이터가 없습니다.</td>
        </tr>`;
        $('#a_tbody').html(emptyRow);
        return;
    }

    let num = ((a_nation.page - 1) * a_nation_data.page_size) + 1;
    let rows = "";
    for (let i = 0; i < data.length; i++) {
        let item = data[i];
        
        let total = item.total_price || 0;
        let paid = item.paid_price || 0;
        let unpaid = total - paid;
        let paidRate = total > 0 ? ((paid / total) * 100).toFixed(0) : "0";

        let row = `
        <tr id='${item.id}' class='align-middle text-nowrap' style='cursor:pointer;'>
            <td>${num + i}</td>
            <td name='year_month'>${item.year || ""}년 ${item.month || ""}월</td>
            <td name='subsidiary_name'>${item.subsidiary_name || ""}</td>
            <td name='customer_class_name'>${item.customer_class_name || ""}</td>
            <td name='customer_name'>${item.customer_name || ""}</td>
            <td name='send_badge'>
                <span class="badge ${item.is_send === true ? 'bg-success' : 'bg-warning'} font-size-12 px-2 py-1" style="width: 50px;">
                    ${item.is_send === true ? '청구' : '미청구'}
                </span>
            </td>
            <td name='total_price'>${formatNumber(total, 2) || ""}</td>
            <td name='paid_price'>${formatNumber(paid, 2) || ""}</td>
            <td name='unpaid_price'>${formatNumber(unpaid, 2) || ""}</td>
            <td name='paid_rate'>${paidRate}%</td>
            <td name='paid_date'>${item.paid_date || ""}</td>
            <td name='done_badge'>
                <span class="badge ${item.is_done === true ? 'bg-success' : 'bg-primary'} font-size-12 px-2 py-1" style="width: 50px;">
                    ${item.is_done === true ? '결제' : '미수'}
                </span>
            </td>

            <td name='is_send' class='d-none'>${item.is_send}</td>
            <td name='is_done' class='d-none'>${item.is_done}</td>
            <td name='year' class='d-none'>${item.year}</td>
            <td name='month' class='d-none'>${item.month}</td>
            <td name='subsidiary_id' class='d-none'>${item.subsidiary_id || ""}</td>
            <td name='customer_id' class='d-none'>${item.customer_id || ""}</td>
        </tr>`;
        rows += row;
    }

    a_nation.nation_display(done);
    $('#a_tbody').html(rows);

    // 클릭한 행 유지
    if (a_click_id != null) {
        $("#a_tbody #" + a_click_id).addClass('clicked');
    }

    $('#a_tbody > tr').on('click', function () {
        $('#a_tbody > tr').removeClass('clicked');
        $(this).addClass('clicked');

        a_click_id = $(this).attr("id");
        a_click_year = $(this).find("[name='year']").text();
        a_click_month = $(this).find("[name='month']").text();
        a_click_subsidiary_id = $(this).find("[name='subsidiary_id']").text();
        a_click_subsidiary_name = $(this).find("[name='subsidiary_name']").text();
        a_click_customer_id = $(this).find("[name='customer_id']").text();
        a_click_customer_name = $(this).find("[name='customer_name']").text();
        a_click_total_price = $(this).find("[name='total_price']").text();
        a_click_is_send = $(this).find("[name='is_send']").text();
        a_click_is_done = $(this).find("[name='is_done']").text();
        a_click_paid_price = $(this).find("[name='paid_price']").text();
        a_click_paid_date = $(this).find("[name='paid_date']").text();
    });

    $('#a_tbody > tr').on('dblclick', function () {
        a_update_modal_in();
    });
}


function a_update_modal_in() {
    if (a_click_id == null) {
        alert(txt.update_select);
        return;
    }

    a_update_modal_reset('popup_off');

    if (window.matchMedia('(max-width: 1200px)').matches) {
        $('#md_fullscreen_update').trigger('click');
    }

    $('#a_update_modal').modal("show");
}

function a_update_modal_reset(popup_off) {
    $("#a_update_modal #is_send").val(a_click_is_send);
    $("#a_update_modal #is_done").val(a_click_is_done);
    $("#a_update_modal #total_price").val(a_click_total_price);
    $("#a_update_modal #paid_price").val(a_click_paid_price);
    $("#a_update_modal #paid_date").val(a_click_paid_date);
    
    init_year_month('a_update_modal', a_click_year, a_click_month);
    init_Select2_modal('#a_update_modal #customer', '선택', '/sel2_hanwool_customer/', {id: 'id', txt: item => `${item.text}`}, a_click_customer_id);
    init_Select2_modal('#a_update_modal #subsidiary', '선택', '/sel2_hanwool_subsidiary/', {id: 'id', txt: item => `${item.text}`}, a_click_subsidiary_id);

    modal_toast(popup_off, '#a_update_modal');
}

function a_update_submit() {
    let api_data = new FormData();
        api_data.append("pk", a_click_id);
        api_data.append("is_send", nullapply($('#a_update_modal #is_send').val()));
        api_data.append("is_done", nullapply($('#a_update_modal #is_done').val()));
        api_data.append("paid_price", nullapply(del_comma($('#a_update_modal #paid_price').val())));
        api_data.append("paid_date", nullapply(del_comma($('#a_update_modal #paid_date').val())));

    fetch_gp('/sales_monthly_result_fn/', 'post', true, api_data, (done) => {
        $('#a_update_modal').modal("hide");
        a_search_ready();
        alert(txt.update_ed);
    });
}

function a_delete_submit() {
    if (a_click_id == null) {
        alert(txt.delete_select);
        return;
    }
    
    let confirmed = confirm(`[${a_click_year}년 ${a_click_month}월 ${a_click_customer_name}]\n\n선택하신 월청구 항목을 삭제하시겠습니까?`);
    if (confirmed) {
        let api_data = new FormData();
        api_data.append("pk", a_click_id);

        fetch_gp('/sales_monthly_delete_fn/', 'post', true, api_data, (done) => {
            a_nation.page = 1;
            a_click_id = null;

            a_search_ready();
            alert(txt.delete_ed);
        });
    } else {
        alert(txt.cancel);
    }
}


function checkNumber(obj, cnt = 0) {
    let val = $(obj).val().replace(/[^0-9.\-]/g, '');

    if (val.startsWith('-')) {
        val = '-' + val.slice(1).replace(/-/g, '');
    } else {
        val = val.replace(/-/g, '');
    }

    obj.value = formatNumber(val, cnt);
}

function formatNumber(val, cnt = 0) {
    if (val == null) return '';  // null, undefined 방지
    val = String(val);           // 문자열 강제 변환

    if (!val || val === '-' || val === '.' || val === '-.') return val;

    const [intPart, decPart] = val.split('.');
    const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    // 사용자가 소수점 입력했을 때만 소수점 표시
    if (val.includes('.') && cnt > 0) {
        return `${intFormatted}.${(decPart || '').slice(0, cnt)}`;
    }

    return intFormatted;
}

function del_comma(val) {
    return typeof val === 'string' ? val.replace(/,/g, '') : val;
}


function init_year_month(modalType, year = null, month = null) {
    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth() + 1;

    // 연도 옵션 추가 (현재 연도 ±3년)
    $(`#${modalType} #year`).empty().append(`<option value="">전체</option>`);
    for (let y = currentYear - 10; y <= currentYear + 10; y++) {
        $(`#${modalType} #year`).append(`<option value="${y}">${y}년</option>`);
    }

    // 월 옵션 추가 (1~12)
    $(`#${modalType} #month`).empty().append(`<option value="">전체</option>`);
    for (let m = 1; m <= 12; m++) {
        let mm = m.toString().padStart(2, '0');
        $(`#${modalType} #month`).append(`<option value="${mm}">${m}월</option>`);
    }

    // 기본값 설정
    $(`#${modalType} #year`).val(year || currentYear);
    $(`#${modalType} #month`).val(month?.toString().padStart(2, '0') || currentMonth.toString().padStart(2, '0'));
}

const modalConfigs = [
    { modalId: 'a_create_modal', iconId: 'md_fullscreen_create' },

];

modalConfigs.forEach(({ modalId, iconId }) => {
    const modalElement = document.getElementById(modalId);
    const iconElement = document.getElementById(iconId);

    if (modalElement && iconElement) {
        iconElement.addEventListener('click', () => {
            toggleModalFullscreen(modalElement, iconElement);
        });

        $(`#${modalId}`).on('hidden.bs.modal', () => {
            resetModalFullscreen(modalElement, iconElement);
        });

});
