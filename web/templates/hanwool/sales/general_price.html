<style>
/* 테이블 입력 필드 최적화 */

    height: 26px;                  /* 세로 높이 살짝 키움 */

<!-- Content Area -->

                    <i class="fa-solid fa-angle-right px-1"></i> [{{ year }}년 {{ month }}월] {{ customer.name }}

                            <div class="d-flex p-0">

                                <div class="search-box d-flex me-1">

                                            <th>산재보험</th>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="{% static 'js/NanumGothic-normal.js' %}"></script>
<script>
let work_order_id = {% if work_order %} {{ work_order.id }} {% else %} null {% endif %};
let customer_id = {% if customer %} {{ customer.id }} {% else %} null {% endif %};
let monthly_sales_id = {% if monthly_sales %} {{ monthly_sales.id }} {% else %} null {% endif %};
const DEFAULT_DATE_STR = new Date().toISOString().slice(0, 10);
const today = DEFAULT_DATE_STR ? new Date(DEFAULT_DATE_STR) : new Date();

let sch_year = {% if year %} {{ year }} {% else %} null {% endif %};
let sch_month = {% if month %} {{ month }} {% else %} null {% endif %};
let all_sch;

window.onkeydown = function (event) {
    if (event.keyCode == 116) {  // F5
        event.returnValue = false;
        refresh();
    }
}

document.getElementById("all_sch").addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
        a_search_ready();
    }
});

function refresh() {
    window.location.href = window.location.href
}

$(function () {
    main();
});

function main() {
    set_autocomplete('off');
    init_date_flatpickr();

    a_search_ready();
}

function a_search_ready() {
    all_sch = $('#all_sch').val();

    a_search();
}

function a_search() {
    let query = "?sch_year=" + sch_year;
    query += "&sch_month=" + sch_month;
    if (work_order_id) { query += "&work_order=" + work_order_id; }
    if (all_sch) { query += "&all_sch=" + all_sch; }

    fetch_gp("/general_worker_salary_read_fn/" + query, 'GET', true, {}, (done) => {
        a_draw_table(done);
    });
}


function a_draw_table(done) {
    // console.log("a_draw_table: ", done);

    let data = done.results;
    if (data.length === 0) {
        let emptyRow = `
        <tr>
            <td colspan="99" style="background-color: white; text-align: center;"><br>등록된 근무인원이 없습니다.<br>[정규파견관리]에서 근무인원을 편성해주세요.<br>&nbsp;</td>
        </tr>`;
        $('#a_tbody').html(emptyRow);
        return;
    }

    let num = 1;
    let rows = "";

    let total_sum_price = 0;
    let total_extra_price = 0;
    let total_extra_price2 = 0;
    let total_mgmt = 0;
    let total_pension = 0;
    let total_health = 0;
    let total_emp = 0;
    let total_acc = 0;
    let total_ltc = 0;
    let total_extra_indirect_price = 0;
    let total_extra_indirect_price2 = 0;
    let total_final_price = 0;

    for (let i = 0; i < data.length; i++) {
        let item = data[i];
        const insMap = {};
        if (item.insurance_data) {
            item.insurance_data.forEach(ins => insMap[ins.k] = ins);
        }

        const base = (item.sum_price || 0) + (item.extra_price || 0) + (item.extra_price2 || 0);

        const rateVal = (key) => insMap[key] ? (insMap[key].rate * 100).toFixed(3) : '0.000';
        const calcAmount = (key) => Math.round(base * (insMap[key]?.rate || 0));

        // 건강보험 금액 먼저 계산
        const health_amount = calcAmount('health');
        const ltc_rate = insMap['ltc'] ? insMap['ltc'].rate : 0; // 0.1295(12.95%)
        const ltc_amount = Math.round(health_amount * ltc_rate);

        // 합계 계산
        total_sum_price += (item.sum_price || 0);
        total_extra_price += (item.extra_price || 0);
        total_extra_price2 += (item.extra_price2 || 0);
        total_mgmt += calcAmount('mgmt');
        total_pension += calcAmount('pension');
        total_health += health_amount;
        total_emp += calcAmount('emp');
        total_acc += calcAmount('acc');
        total_ltc += ltc_amount;
        total_extra_indirect_price += (item.extra_indirect_price || 0);
        total_extra_indirect_price2 += (item.extra_indirect_price2 || 0);
        total_final_price += (item.final_price || 0);

        rows += `
        <tr id="row_${item.worker_id}" class="align-middle text-nowrap">
            <td>${num + i}</td>
            <td>${item.user ? item.user.name : ''}</td>

            <!-- 직접비 항목 -->
            <td><input type="text" class="form-control form-control-sm text-end sum_price" value="${formatNumber(item.sum_price || 0)}"
                       oninput="calc_row(this)" onkeyup="checkNumber(this, 2)" readonly></td>
            <td><input type="text" class="form-control form-control-sm text-end extra_price" value="${formatNumber(item.extra_price || 0)}"
                       oninput="calc_row(this)" onkeyup="checkNumber(this, 2)" readonly></td>
            <td style="border-right: 1px solid #dee2e6;"><input type="text" class="form-control form-control-sm text-end extra_price2" value="${formatNumber(item.extra_price2 || 0)}"
                       oninput="calc_row(this)" onkeyup="checkNumber(this, 2)" readonly></td>

            <!-- 관리비 -->
            <td><input type="text" class="form-control form-control-sm text-end rate" data-key="mgmt" value="${rateVal('mgmt')}"
                       oninput="calc_row(this)" onkeyup="checkNumber(this, 3)" readonly></td>
            <td><input type="text" class="form-control form-control-sm text-end amount" data-key="mgmt" value="${formatNumber(calcAmount('mgmt'))}" readonly></td>

            <!-- 국민연금 -->
            <td><input type="text" class="form-control form-control-sm text-end rate" data-key="pension" value="${rateVal('pension')}"
                       oninput="calc_row(this)" onkeyup="checkNumber(this, 3)" readonly></td>
            <td><input type="text" class="form-control form-control-sm text-end amount" data-key="pension" value="${formatNumber(calcAmount('pension'))}" readonly></td>

            <!-- 건강보험 -->
            <td><input type="text" class="form-control form-control-sm text-end rate" data-key="health" value="${rateVal('health')}"
                       oninput="calc_row(this)" onkeyup="checkNumber(this, 3)" readonly></td>
            <td><input type="text" class="form-control form-control-sm text-end amount" data-key="health" value="${formatNumber(health_amount)}" readonly></td>

            <!-- 고용보험 -->
            <td><input type="text" class="form-control form-control-sm text-end rate" data-key="emp" value="${rateVal('emp')}"
                       oninput="calc_row(this)" onkeyup="checkNumber(this, 3)" readonly></td>
            <td><input type="text" class="form-control form-control-sm text-end amount" data-key="emp" value="${formatNumber(calcAmount('emp'))}" readonly></td>

            <!-- 산재보험 -->
            <td><input type="text" class="form-control form-control-sm text-end rate" data-key="acc" value="${rateVal('acc')}"
                       oninput="calc_row(this)" onkeyup="checkNumber(this, 3)" readonly></td>
            <td><input type="text" class="form-control form-control-sm text-end amount" data-key="acc" value="${formatNumber(calcAmount('acc'))}" readonly></td>

            <!-- 장기요양 (건강보험 × 장기요양률) -->
            <td><input type="text" class="form-control form-control-sm text-end rate" data-key="ltc" value="${(ltc_rate * 100).toFixed(3)}"
                       oninput="calc_row(this)" onkeyup="checkNumber(this, 3)" readonly></td>
            <td style="border-right: 1px solid #dee2e6;"><input type="text" class="form-control form-control-sm text-end amount" data-key="ltc" value="${formatNumber(ltc_amount)}" readonly></td>

            <!-- 기타 간접비 및 최종 청구액 -->
            <td><input type="text" class="form-control form-control-sm text-end extra_indirect_price" value="${formatNumber(item.extra_indirect_price || 0)}"
                       oninput="calc_row(this)" onkeyup="checkNumber(this, 2)" readonly></td>
            <td><input type="text" class="form-control form-control-sm text-end extra_indirect_price2" value="${formatNumber(item.extra_indirect_price2 || 0)}"
                       oninput="calc_row(this)" onkeyup="checkNumber(this, 2)" readonly></td>
            <td><input type="text" class="form-control form-control-sm text-end final_price" value="${formatNumber(item.final_price || 0)}"
                       onkeyup="checkNumber(this, 2)" readonly></td>
        </tr>`;
    }

    // === 합계줄 추가 ===
    let sumRow = `
    <tr class="no-click fw-bold text-nowrap" style="background: #f8f8f8; border-top: 1px solid #d9dee3;">
        <td class="text-center"></td>        
        <td class="text-center">합계</td>
        <td class="text-end">${formatNumber(total_sum_price)}</td>
        <td class="text-end">${formatNumber(total_extra_price)}</td>
        <td class="text-end" style="border-right:1px solid #dee2e6;">${formatNumber(total_extra_price2)}</td>

        <td></td><td class="text-end" id="total_fee">${formatNumber(total_mgmt)}</td>
        <td></td><td class="text-end">${formatNumber(total_pension)}</td>
        <td></td><td class="text-end">${formatNumber(total_health)}</td>
        <td></td><td class="text-end">${formatNumber(total_emp)}</td>
        <td></td><td class="text-end">${formatNumber(total_acc)}</td>
        <td></td><td class="text-end" style="border-right:1px solid #dee2e6;">${formatNumber(total_ltc)}</td>

        <td class="text-end">${formatNumber(total_extra_indirect_price)}</td>
        <td class="text-end">${formatNumber(total_extra_indirect_price2)}</td>
        <td class="text-end" id="total_price">${formatNumber(total_final_price)}</td>
    </tr>`;

    rows += sumRow;
    $('#a_tbody').html(rows);
}

function calc_row(obj) {
    const tr = $(obj).closest('tr');

    const sum_price = Number(del_comma(tr.find('.sum_price').val())) || 0;
    const extra_price = Number(del_comma(tr.find('.extra_price').val())) || 0;
    const extra_price2 = Number(del_comma(tr.find('.extra_price2').val())) || 0;
    const base = sum_price + extra_price + extra_price2;

    let total_insurance = 0;
    let health_amount = 0;

    tr.find('.rate').each(function () {
        const key = $(this).data('key');
        const rate = Number($(this).val()) / 100;

        let amount = 0;
        if (key === 'ltc') return; // 장기요양은 뒤에서 별도 계산

        amount = Math.round(base * rate);
        if (key === 'health') health_amount = amount;

        tr.find(`.amount[data-key='${key}']`).val(formatNumber(amount));
        total_insurance += amount;
    });

    // 장기요양보험은 건강보험금액 × 장기요양률
    const ltc_rate = Number(tr.find(".rate[data-key='ltc']").val()) / 100;
    const ltc_amount = Math.round(health_amount * ltc_rate);
    tr.find(".amount[data-key='ltc']").val(formatNumber(ltc_amount));
    total_insurance += ltc_amount;

    // 간접비 항목
    const extra_indirect_price = Number(del_comma(tr.find('input').eq(-3).val())) || 0;
    const extra_indirect_price2 = Number(del_comma(tr.find('input').eq(-2).val())) || 0;

    // 최종 청구액
    const final_price = Math.round(base + total_insurance + extra_indirect_price + extra_indirect_price2);
    tr.find('.final_price').val(formatNumber(final_price));
}


function save_salary() {
    let api_data = new FormData();
        api_data.append("pk", monthly_sales_id);
        api_data.append("total_total", del_comma($('#total_price').text().trim()));
        api_data.append("total_fee", del_comma($('#total_fee').text().trim()));

    fetch_gp('/sales_monthly_general_price_fn/', 'post', true, api_data, (done) => {
        a_search();
        alert(txt.update_ed);
    });
}


function checkNumber(obj, cnt = 0) {
    let val = $(obj).val().replace(/[^0-9.\-]/g, '');

    if (val.startsWith('-')) {
        val = '-' + val.slice(1).replace(/-/g, '');
    } else {
        val = val.replace(/-/g, '');
    }

    obj.value = formatNumber(val, cnt);
}

function formatNumber(val, cnt = 0) {
    if (val == null) return '';  // null, undefined 방지
    val = String(val);           // 문자열 강제 변환

    if (!val || val === '-' || val === '.' || val === '-.') return val;

    const [intPart, decPart] = val.split('.');
    const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    // 사용자가 소수점 입력했을 때만 소수점 표시
    if (val.includes('.') && cnt > 0) {
        return `${intFormatted}.${(decPart || '').slice(0, cnt)}`;
    }

    return intFormatted;
}

function del_comma(val) {
    return typeof val === 'string' ? val.replace(/,/g, '') : val;
}

function exportToExcel() {
    const tbody = document.querySelector('#a_tbody');
    const thead = document.querySelector('table thead');
    if (!tbody || !thead) return;

    let wb = XLSX.utils.book_new();
    let ws_data = [];

    // 헤더 수집
    let headerRow = [];
    thead.querySelectorAll('th').forEach(th => {
        headerRow.push(th.innerText.trim());
    });
    ws_data.push(headerRow);

    // 바디 수집
    tbody.querySelectorAll('tr').forEach(row => {
        let rowData = [];
        row.querySelectorAll('td').forEach(cell => {
            // <input>이 있으면 value 읽기, 없으면 textContent
            const input = cell.querySelector('input');
            if (input) {
                rowData.push(input.value.trim());
            } else {
                rowData.push(cell.textContent.trim());
            }
        });
        if (rowData.length > 0) ws_data.push(rowData);
    });

    // 워크시트 생성
    let ws = XLSX.utils.aoa_to_sheet(ws_data);

    // 엑셀 파일 생성
    XLSX.utils.book_append_sheet(wb, ws, `{{ customer.name }}`);
    XLSX.writeFile(wb, `파견정규직 근무내역_{{ year }}년 {{ month }}월_{{ customer.name }}.xlsx`);
}


function exportToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('l', 'pt', 'a4'); // 가로방향, pt 단위, A4 용지

    // === 한글 폰트 등록 ===
    doc.addFileToVFS("NanumGothic.ttf", NanumGothic);
    doc.addFont("NanumGothic.ttf", "NanumGothic", "normal");
    doc.setFont("NanumGothic");

    // 실제 테이블
    const table = document.querySelector('#sheet table');
    if (!table) return;

    // <input> value를 텍스트로 바꾼 복사본 생성
    const clonedTable = table.cloneNode(true);
    clonedTable.querySelectorAll('input').forEach(input => {
        const val = input.value || '';
        const span = document.createElement('span');
        span.textContent = val;
        input.parentNode.replaceChild(span, input);
    });

    // PDF 생성
    doc.autoTable({
        html: clonedTable,
        startY: 40,
        theme: 'grid',
        styles: {
            font: "NanumGothic",
            fontSize: 7,
            cellPadding: 2,
            valign: 'middle',
        },
        headStyles: {
            fillColor: [52, 193, 142],
            textColor: [255, 255, 255],
            fontStyle: 'bold'
        },
        didDrawPage: function (data) {
            doc.setFontSize(10);
            doc.text(
                `파견정규직 근무내역 [${sch_year}년 ${sch_month}월] - {{ customer.name }}`,
                40, 25
            );
        }
    });

    // 파일 저장
    doc.save(`파견정규직 근무내역_${sch_year}년_${sch_month}월_{{ customer.name }}.pdf`);
}


// 팝업창 닫힘신호 전송
window.onunload = function() {
    if (window.opener && !window.opener.closed) {
        // 부모창의 특정 함수 실행
        window.opener.a_search();
    }
};
</script>
