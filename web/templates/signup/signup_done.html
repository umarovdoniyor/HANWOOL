<!-- 회원가입 > 2차 페이지 -->

<!DOCTYPE html>
<html style="overflow-x:hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}

<style>
body {
    background: url('{% static 'img/login_office.jpg' %}') no-repeat center center/cover;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    position: relative;
    overflow: hidden;
}

body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: black;
    opacity: 0.1;
    z-index: 0;
}

.loginbox {
    background-color: rgba(245, 245, 245, 0.8);
    border: 20px double #fff;
    z-index: 1;
}

.main-text {
    font-size: 30px;
    font-weight: bold;
    background: linear-gradient(to right, rgba(52, 58, 64, 0.8), rgba(52, 58, 64, 0.5));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
}

.sub-text {
    font-size: 20px;
    font-weight: bold;
    background: linear-gradient(to right, rgba(52, 58, 64, 0.8), rgba(52, 58, 64, 0.5));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
}

</style>

<div class="container-fluid">
    <div class="box-margin row no-gutters justify-content-center align-items-start align-items-md-center flex-column">
        <div class="loginbox card col-11 col-md-8 col-lg-6 col-xl-4 align-self-center my-4">

            <div class="card-body p-4 p-md-5">
                <div class="text-center">
                    <img class="mb-4 img-fluid" src="{% static '/img/tost_office_color_1200px.png' %}"
                         onclick="refresh()" style="cursor: pointer; max-width: 200px;">
                </div>

                <div class="titlebox text-center my-4">
                    <h1 class="main-text mb-4">{{ company_name }}<br>회원 가입을 환영합니다</h1>
                    <p class="sub-text">이제 가입하신 ID({{ user_id }})로<br>로그인 하실 수 있습니다.</p>
                </div>

                <div class="d-flex justify-content-center">
                    <button class="btn btn-success w-50 p-2 mt-3" onclick="refresh()">로그인 페이지</button>
                </div>

            </div>
        </div>

        <div class="row no-gutters justify-content-center align-items-center m-0 p-2 w-100" style="z-index: 1;">
            <div class="d-flex flex-nowrap justify-content-center align-items-center text-white text-center text-nowrap">
                <a href="{% url 'brand_page' %}" class="text-decoration-none text-white">토스트 오피스</a>
                <span class="mx-2">|</span>
                <span>문의 : tost.korea@gmail.com</span>
            </div>
        </div>
    </div>
</div>


<script>
    $(function () {
        main();
    });

    function main() {
        set_autocomplete('off');
    }

    function refresh() {
        window.location.href = "/index/"
    }

</script>
