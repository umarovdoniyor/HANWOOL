// 미리 정의된 뱃지색상 목록 ----------
let badge_colors = [
    'rgb(52, 193, 142)',
    'rgb(239, 179, 75)',
    'rgb(242, 105, 105)',
    'rgb(79, 164, 239)',
    'rgb(84, 109, 228)',

];

let categoryColorMap = {};
let colorIndex = 0;

function getBadgeColor(categoryName) {
    if (!categoryColorMap[categoryName]) {
        categoryColorMap[categoryName] = badge_colors[colorIndex % badge_colors.length];
        colorIndex++;

// 부트스트랩 툴팁 적용 : data-toggle="tooltip" data-placement="top" title="툴팁내용입력" //
$(document).ready(function(){

    });
});

function updateViewHeight() {
    // 헤더와 메인 콘텐츠의 높이 계산
    let headerHeight = $("#page-topbar").outerHeight(true); // margin 포함
    let mainContent = $("#main-content");

    // 브라우저 전체 높이에서 헤더 높이와 패딩을 뺀 값 계산
    let availableHeight = $(window).height() - headerHeight - parseInt(mainContent.css('padding-top')) - parseInt(mainContent.css('padding-bottom'));

    // iframe 높이 설정
    $('#dynamic-iframe').css('height', availableHeight + 'px');
}

function url_click(url, element) {
    // 1. 먼저 해당 URL이 존재하는지 확인
    fetch(url, { method: 'HEAD' })
        .then(response => {
            if (!response.ok) {
                notiToast("이미 삭제되었거나 만료된 페이지입니다.");
                throw new Error("Invalid page");  // 이후 코드 실행 방지
            }

            if (typeof noti_search === 'function') {
                noti_search();
            }

            const mainContent = document.getElementById('main-content');

            // 기존 iframe 제거
            let iframe = document.getElementById('dynamic-iframe');
            if (iframe) {
                iframe.remove();
            }

            // 새로운 iframe 생성
            iframe = document.createElement('iframe');
            iframe.id = 'dynamic-iframe';
            iframe.style.width = '100%';
            iframe.style.border = 'none';
            iframe.style.overflowY = 'auto';
            iframe.src = url;

            mainContent.appendChild(iframe);
            updateViewHeight();
            window.addEventListener('resize', updateViewHeight);

            document.querySelectorAll("#side-menu a").forEach(item => {
                item.classList.remove("menu_clicked");
            });
            document.querySelectorAll("#side-menu li").forEach(item => {
                item.classList.remove("mm-active");
            });

            if (element) {
                element.classList.add("menu_clicked");
                if (element.closest('.sub-menu')) {
                    let menuItem = element.closest('.menu_item');
                    if (menuItem) {
                        menuItem.classList.add('mm-active');
                    }
                }
            }

            document.body.classList.remove("sidebar-enable");
        })
        .catch(() => {
            notiToast("이미 삭제되었거나 만료된 페이지입니다.");
        });
}

function url_click_request(url) {
    window.parent.postMessage({ type: 'url_click', url: url }, '*');
}

window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'url_click') {
        url_click(event.data.url);
        {% comment %}noti_search();{% endcomment %}
    }
});

function set_autocomplete(val) {
    if (['on', 'off'].includes(val)) {
        const inputElements = document.querySelectorAll('input');
        inputElements.forEach(inputElement => {

        });
    }
}

function init_date_flatpickr() {
    flatpickr(".date_flatpickr", {
        dateFormat: "Y-m-d",
        locale: "ko",
        allowInput: true,
        disableMobile: true, // 모바일에서 flatpickr 강제적용 
    });
}

function init_datetime_flatpickr() {
    document.querySelectorAll(".datetime_flatpickr").forEach((element) => {
        let defaultTime = element.dataset.defaultTime || "09:00"; // 기본값 설정
        let [defaultHour, defaultMinute] = defaultTime.split(":").map(Number); // 시간과 분 분리

        flatpickr(element, {
            enableTime: true,
            noCalendar: false, // 달력은 그대로 유지
            dateFormat: "Y-m-d H:i",
            time_24hr: true,
            locale: "ko",
            allowInput: true,
            disableMobile: true, // 모바일에서 flatpickr 강제적용 
            defaultHour: defaultHour, // 기본 시간 설정
            defaultMinute: defaultMinute // 기본 분 설정
        });
    });
}

function reset_date_flatpickr(selector) {
    return flatpickr(selector, {
        dateFormat: "Y-m-d",
        locale: "ko",
        allowInput: true,
        disableMobile: true, // 모바일에서 flatpickr 강제적용 
        defaultDate: new Date()
    });
}

function reset_datetime_flatpickr(selector) {
    return flatpickr(selector, {

function toggleModalFullscreen(modalElement, iconElement) {
    const modalDialog = modalElement.querySelector('.modal-dialog');
    if (!modalDialog) return;

    if (!modalDialog.classList.contains('fullscreen')) {
        modalElement.style.left = '0';
        modalElement.style.top = '0';
        modalElement.style.transform = 'none';
        modalDialog.classList.add('fullscreen');
        iconElement.classList.replace('fa-expand', 'fa-compress');
        iconElement.setAttribute('title', '기본화면');
        $(modalElement).draggable('disable');
    } else {
        modalDialog.classList.remove('fullscreen');
        iconElement.classList.replace('fa-compress', 'fa-expand');
        iconElement.setAttribute('title', '전체화면');
        $(modalElement).draggable('enable');
    }
}

function resetModalFullscreen(modalElement, iconElement) {
    const modalDialog = modalElement.querySelector('.modal-dialog');
    if (!modalDialog) return;

    modalDialog.classList.remove('fullscreen');
    iconElement.classList.replace('fa-compress', 'fa-expand');
    iconElement.setAttribute('title', '전체화면');
    $(modalElement).draggable('enable');
}

// 전자결재 첨부파일 렌더링 함수
function renderFileAttachment(div_id, apv_attach, fileSize = null) {
    let fileListContainer = $(`#${div_id}`);

    if (apv_attach) {
        let fileUrl = apv_attach;
        let fileName = decodeURIComponent(fileUrl.split('/').pop()); // 파일명 디코딩
        let fileIconClass = getFileIconClass(fileName); // 확장자에 따른 아이콘 클래스 가져오기

        // 파일 크기 변환 (바이트 → MB, KB 변환)
        let formattedSize = fileSize ? formatFileSize(fileSize) : '';

        // 파일 리스트 요소 생성
        fileListContainer.html(`
            <div class="d-flex justify-content-between align-items-center">
                <a href="${fileUrl}" target="_blank" download="${fileName}">
                    <i class="${fileIconClass} me-2"></i>${fileName} ${formattedSize}
                </a>
                <div class="btn btn-white py-0 px-1" style="border: none;" id="removeFileBtn" onclick="removeFile('${div_id}')">
                    <i class="fa-solid fa-xmark fa-lg"></i>
                </div>
            </div>
        `);
    } else {
        fileListContainer.text("첨부된 파일이 없습니다.");
    }
}

// 파일 크기 변환 함수 (바이트 → KB, MB)
function formatFileSize(size) {
    if (size >= 1024 * 1024) {
        return `(${(size / (1024 * 1024)).toFixed(1)} MB)`;
    } else if (size >= 1024) {
        return `(${(size / 1024).toFixed(1)} KB)`;
    } else {
        return `(${size} B)`;
    }
}

// 전자결재 첨부파일 제거 함수
function removeFile(div_id) {
    $(`#${div_id}`).html("첨부된 파일이 없습니다.");
    $('#attached_file').val('');
}

// 새로운 첨부파일 선택 시 기존 파일 제거 후 추가하는 함수
function updateFileAttachment(div_id, fileInput) {
    let file = fileInput.files[0]; // 선택한 파일 가져오기

    if (!file) return; // 파일이 선택되지 않았다면 종료

    // 파일 크기 제한 (5MB 초과 시 경고)
    const MAX_SIZE = 5 * 1024 * 1024; // 5MB
    if (file.size > MAX_SIZE) {
        alert("첨부파일 용량은 5MB를 초과할 수 없습니다.");
        fileInput.value = ""; // 파일 선택 초기화
        return;
    }

    let fileListContainer = $(`#${div_id}`);
    let fileUrl = URL.createObjectURL(file); // 파일의 임시 URL 생성
    let fileName = file.name; // 파일명 가져오기
    let fileSize = file.size; // 파일 크기 가져오기 (바이트 단위)
    let fileIconClass = getFileIconClass(fileName); // 확장자에 따른 아이콘 클래스 가져오기

    // 기존 파일 제거 후 새 파일 추가
    fileListContainer.html(`
        <div class="d-flex justify-content-between align-items-center">
            <a href="${fileUrl}" target="_blank" download="${fileName}">
                <i class="${fileIconClass} me-2"></i>${fileName} ${formatFileSize(fileSize)}
            </a>
            <div class="btn btn-white py-0 px-1" style="border: none;" id="removeFileBtn" onclick="removeFile('${div_id}')">
                <i class="fa-solid fa-xmark fa-lg"></i>
            </div>
        </div>
    `);
}

// 전자결재 첨부파일 렌더링 아이콘 함수
function getFileIconClass(fileName) {
    let iconClassMap = {
        'default': 'fa-regular fa-file fa-lg',
        'txt': 'fa-regular fa-file-lines fa-lg',
        'hwp': 'fa-regular fa-file-lines fa-lg',
        'hwpx': 'fa-regular fa-file-lines fa-lg',
        'jpg': 'fa-regular fa-file-image fa-lg',
        'png': 'fa-regular fa-file-image fa-lg',
        'pdf': 'fa-regular fa-file-powerpoint fa-lg',
        'doc': 'fa-regular fa-file-word fa-lg',
        'docx': 'fa-regular fa-file-word fa-lg',
        'ppt': 'fa-regular fa-file-powerpoint fa-lg',
        'pptx': 'fa-regular fa-file-powerpoint fa-lg',
        'xls': 'fa-regular fa-file-excel fa-lg',
        'xlsx': 'fa-regular fa-file-excel fa-lg',
        'zip': 'fa-regular fa-file-zipper fa-lg',
    };
    let fileExtension = fileName.split('.').pop().toLowerCase();
    return iconClassMap[fileExtension] || iconClassMap['default'];
}

// 첨부파일 드랍존 오버레이 활성화
function init_drop_overlay() {
    let fileInput = $("#attached_file");
    let dropOverlay = $("#drop_overlay"); // 전역 드롭존
    let dragCounter = 0; // 드래그 상태 추적

    // **전역 드래그 감지**: 사용자가 파일을 드래그하면 오버레이 표시
    $(document).on("dragenter", function (event) {
        event.preventDefault();
        event.stopPropagation();
        dragCounter++;
        dropOverlay.fadeIn(200).css("display", "flex"); // 드롭존 활성화
    });

    // **드래그 상태 유지**
    $(document).on("dragover", function (event) {
        event.preventDefault();
        event.stopPropagation();
    });

    // **전역 드래그 해제 감지 (드래그 취소 시 오버레이 제거)**
    $(document).on("dragleave", function (event) {
        event.stopPropagation();
        dragCounter--;
        if (dragCounter === 0) { // 모든 드래그가 종료되면 오버레이 제거
            dropOverlay.fadeOut(200);
        }
    });

    // **전역 드롭 이벤트 처리**
    $(document).on("drop", function (event) {
        event.preventDefault();
        event.stopPropagation();
        dragCounter = 0;
        dropOverlay.fadeOut(200); // 오버레이 숨김

        let droppedFiles = event.originalEvent.dataTransfer.files;
        if (droppedFiles.length > 0) {
            fileInput[0].files = droppedFiles; // 파일을 input[type=file]에 적용
            fileInput.trigger("change"); // 기존 updateFileAttachment 함수 실행
        }
    });

    // **파일 선택 (클릭 업로드)도 정상적으로 동작**
    fileInput.on("change", function () {
        updateFileAttachment('file_list', this);
    });
}

let comment_draw_url;

function comment_draw_table(docType, docId) {
     if (docType === 'apv') {
        comment_draw_url = `/comment_apv_read_fn/${docId}/`;
    } else if (docType === 'board') {
        comment_draw_url = `/comment_board_read_fn/${docId}/`;
    } else if (docType === 'project') {
        comment_draw_url = `/comment_project_read_fn/${docId}/`;
    }
    
    fetch(`${comment_draw_url}`)
        .then(response => response.json())
        .then(data => {
            // console.log("comment_draw_table: ", data);

            if (!data || !Array.isArray(data.results)) {
                console.error("데이터 형식이 올바르지 않습니다. results가 배열이 아님:", data);
                return;
            }

            let comments = data.results; // Pagination 적용된 경우
            let commentList = document.getElementById(`comment_list`);
            commentList.innerHTML = "";

            if (comments.length === 0) {
                commentList.innerHTML = `
                    <div class="text-muted text-center p-2">
                        <i class="fa-regular fa-comment-dots"></i> 아직 등록된 댓글이 없습니다.
                    </div>
                `;
                return;
            }

            comments.forEach(comment => {
                let editDeleteButtons = comment.is_owner ? `
                    <i class="fa-solid fa-pen text-warning me-2" onclick="comment_update_submit(${comment.id})" style="cursor:pointer;"></i>
                    <i class="fa-solid fa-trash-can text-danger me-2" onclick="comment_delete_submit(${comment.id}, ${docId})" style="cursor:pointer;"></i>
                ` : "";

                let editedText = comment.created_at !== comment.updated_at ? " <span class='text-muted' style='font-size: 12px;'>(수정됨)</span>" : "";

                let commentHTML = `
                    <div id="comment-${comment.id}" class="d-flex align-items-start mb-1 p-2 ${comment.is_owner ? "bg-info-subtle-25" : "bg-secondary-subtle-25"} rounded">
                        <img class="avatar-sm p-1 me-2" src="${comment.profile_image}" alt="프로필 사진"
                             style="border-radius: 8px; width: 40px; height: 40px; object-fit: cover;">
                        <div class="flex-grow-1">
                            <h6 class="fw-bold mb-1 d-flex align-items-center justify-content-between">
                                <span>
                                    ${comment.created_by} ${comment.created_by_job_level}
                                    <span class="text-muted fw-normal" style="font-size: 12px;"> · ${comment.updated_at} ${editedText}</span>
                                </span>
                                <span class="text-muted" style="font-size: 13px;">
                                    ${editDeleteButtons}
                                </span>
                            </h6>
                            <p class="mb-0 comment-content" style="white-space: pre-line;">${comment.content}</p>
                        </div>
                    </div>
                `;
                commentList.innerHTML += commentHTML;
            });
        })
        .catch(error => {
            console.error("댓글을 불러오는 중 오류 발생:", error);
        });
}


function comment_create_submit(docType, docId) {
    if (docType === 'apv') {
        comment_create_url = `/comment_apv_create_fn/${docId}/`;
    } else if (docType === 'board') {
        comment_create_url = `/comment_board_create_fn/${docId}/`;
    } else if (docType === 'project') {
        comment_create_url = `/comment_project_create_fn/${docId}/`;
    }
    
    let commentInput = document.getElementById("comment_input");
    if (!commentInput) {
        console.error("댓글 입력창을 찾을 수 없습니다.");
        return;
    }

    let content = commentInput.value.trim();
    if (!content) {
        alert("댓글 내용을 입력하세요.");
        return;
    }

    fetch(`${comment_create_url}`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCSRFToken()
        },
        body: JSON.stringify({ content: content })
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
        } else {
            comment_draw_table(docType, docId);
            commentInput.value = "";
        }
    });
}

function comment_update_submit(commentId) {
    let commentElement = document.querySelector(`#comment-${commentId} .comment-content`);
    let editButton = document.querySelector(`#edit-btn-${commentId}`); // 수정 버튼 선택
    
    // 이미 textarea가 있으면 중복 실행 방지 및 수정버튼 감추기
    if (commentElement.querySelector('textarea')) {
        if (editButton) {
            editButton.style.display = "none";
        }
        return;
    }
    
    let originalContent = commentElement.innerHTML.replace(/<br>/g, "\n").trim();
    commentElement.dataset.originalContent = originalContent;

    let editHTML = `
        <textarea id="edit-text-${commentId}" class="form-control" rows="3" style="resize: none; margin-top: -14px; margin-bottom: -10px;">${originalContent}</textarea>
        <div class="d-flex">
            <button class="btn btn-success btn-sm me-2" onclick="saveEditedComment(${commentId})">저장</button>
            <button class="btn btn-secondary btn-sm" onclick="cancelEditComment(${commentId})">취소</button>
        </div>
    `;

    commentElement.innerHTML = editHTML;
}

function saveEditedComment(commentId) {
    let editedContent = document.querySelector(`#edit-text-${commentId}`).value.trim();
    let editButton = document.querySelector(`#edit-btn-${commentId}`);

    if (!editedContent) {
        alert("댓글 내용을 입력하세요.");
        return;
    }

    fetch(`/comment_update_fn/${commentId}/`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCSRFToken()
        },
        body: JSON.stringify({ content: editedContent })
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
        } else {
            let commentElement = document.querySelector(`#comment-${commentId} .comment-content`);
            commentElement.innerHTML = data.content.replace(/\n/g, "<br>");

            let timestampElement = document.querySelector(`#comment-${commentId} h6 span .text-muted.fw-normal`);
            if (timestampElement) {
                timestampElement.innerHTML = ` · ${data.updated_at} <span class='text-muted' style='font-size: 12px;'>(수정됨)</span>`;
            }

            if (editButton) {
                editButton.style.display = "inline";
            }
        }
    });
}

function cancelEditComment(commentId) {
    let commentElement = document.querySelector(`#comment-${commentId} .comment-content`);
    let editButton = document.querySelector(`#edit-btn-${commentId}`); // 수정 버튼 선택
    let originalContent = commentElement.dataset.originalContent || "";
    commentElement.innerHTML = originalContent.replace(/\n/g, "<br>");

    commentElement.dataset.editing = "false";
    if (editButton) {
        editButton.style.display = "inline";

}

function notiToast(message, options = {}) {
    const {
        position = 'top: 0.5rem; right: 0.5rem;',
        delay = 3000,
        width = '450px',
    } = options;

    const toastId = `toast_${Date.now()}`;

    $('#noti_toast_area').append(`
        <div id="${toastId}" class="toast position-fixed animate-slide-in" style="${position} z-index: 10000; width: ${width}; border: 1px solid rgba(0, 0, 0, 0.1);">
          <div class="toast-header bg-dark text-white p-1">

          </div>
          <div class="toast-body" style="color: #2b2d30; font-size: 12px; font-family: sans-serif;">
            ${message}
          </div>
        </div>
    `);

    const toastElement = $(`#${toastId}`);
    toastElement.toast({ delay });
    toastElement.toast('show');

    setTimeout(function () {
        toastElement
            .removeClass('animate-slide-in')
            .addClass('animate-slide-out');
        setTimeout(function () {
            toastElement.remove();
        }, 500); // 애니메이션 시간(0.5초) 후 삭제

}

    // 팝업 로드 완료 후 body id 부여 및 create 모드 실행
    const interval = setInterval(() => {
        if (codeWindow && codeWindow.document && codeWindow.document.readyState === 'complete') {
            const body = codeWindow.document.body;
            if (body && !body.id) {
                body.id = 'codeWindow';
            }

            if (create && typeof codeWindow.a_create_modal_in === 'function') {
                codeWindow.a_create_modal_in();
            }

            clearInterval(interval);
        }
    }, 200);
}
