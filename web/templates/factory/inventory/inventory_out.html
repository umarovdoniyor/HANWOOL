<!-- 팩토리 > 재고관리 > 재고출고 -->

<!DOCTYPE html>
<html style="overflow-x: hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}
<style>
/* select2 컨테이너 너비 지정 */
#sch_item + .select2-container {
    width: 250px !important;
}
/* select2 선택창 높이 및 스타일 form-select-sm과 동일하게 */
#sch_item + .select2-container .select2-selection--single {
    height: 36.53px !important;
    line-height: 32px !important;
    padding: 0.25rem 0.5rem !important;
    border: 1px solid #6c757d !important; /* border-secondary */
    border-radius: 0.2rem !important;
    position: relative;
}
/* 선택된 항목 텍스트 정렬 */
#sch_item + .select2-container .select2-selection__rendered {
    line-height: 30px !important;
    padding-left: 0 !important;
}
/* 화살표 위치 조정 */
#sch_code + .select2-container .select2-selection__arrow {
    height: 36.53px !important;
    top: 0 !important;
}
/* 클리어버튼 위치 조정 */
#sch_item + .select2-container .select2-selection__clear {
    right: 2.5rem !important;
    top: 50%;
    transform: translateY(-50%);
    position: absolute;
    z-index: 10;
}

</style>

<!-- Content Area -->
<div class="row p-4">

    <!-- 게시물 목록 -->
    <div class="col-12">
        <div class="row gx-4">

            <!-- 상단 메뉴바 -->
            <div class="col-xxl-12">
                <div class="d-inline-block align-items-center mb-3" style="font-size: 20px; color: #2a3040; cursor: pointer; font-weight: 1000;" onclick="refresh()">
                    <i class="fa-solid fa-cubes me-2"></i>재고출고
                    <i class="fa-regular fa-circle-question fa-2xs" style="vertical-align: super;" data-toggle="tooltip" data-placement="top" onclick="event.stopPropagation();"
                    title="• 자재를 출고처리 등록 및 수정, 삭제할 수 있는 페이지입니다."></i>
                </div>
            </div>

            <div class="col-12">
                <div class="card border border-light">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-3">
                            <div class="d-flex p-0">
                                <div class="d-none d-md-inline btn btn-secondary text-nowrap me-1 px-2.5" onclick="refresh()"
                                     data-toggle="tooltip" data-placement="top" title="새로고침 (F5)">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </div>

                                <select class="page_size form-select form-select-sm me-1" id="a_page_size"
                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="리스트에서 표시할 수량">
                                    <option value="10">10개</option>
                                    <option value="20" selected>20개</option>
                                    <option value="50">50개</option>
                                    <option value="100">100개</option>
                                    <option value="200">200개</option>
                                    <option value="500">500개</option>
                                </select>

                                <div class="d-none d-md-flex input-group input-daterange w-auto me-1" data-toggle="tooltip" data-placement="top" title="출고 일자 검색">
                                    <input id="fr_date" type="text" placeholder="시작일 검색" onchange="a_search_ready()" autocomplete="off"
                                           class="form-control date_flatpickr border border-secondary" style="max-width: 120px;">
                                    <input id="to_date" type="text" placeholder="종료일 검색" onchange="a_search_ready()" autocomplete="off"
                                           class="form-control date_flatpickr border border-secondary" style="max-width: 120px;">
                                </div>

                                <div class="d-none d-md-flex input-group input-daterange w-auto me-1" data-toggle="tooltip" data-placement="top" title="품목명 검색">
                                    <select class="d-none d-md-inline page_size form-select form-select-sm me-1" id="sch_item"
                                            onchange="a_search_ready()">
                                    </select>
                                </div>

                                <div class="search-box d-flex me-1">
                                    <div class="position-relative flex-grow-1" data-toggle="tooltip" data-placement="top"
                                         title="품번, 고객사, 출고창고, 자재분류, 품목정보, 출고구분, 비고, 불량사유 텍스트 검색">
                                        <input type="text" class="form-control rounded border-secondary" id="all_sch" placeholder="검색어 입력">
                                        <i class="mdi mdi-magnify search-icon"></i>
                                    </div>
                                </div>

                                <button class="btn btn-secondary text-nowrap me-1 px-2.5" onclick="a_search_ready()">
                                    <i class="fa-solid fa-magnifying-glass"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">검색</span>
                                </button>
                            </div>

                            <div class="d-flex p-0">
                                <button class="btn btn-success text-nowrap ms-1 px-2.5" onclick="a_create_modal_in()">
                                    <i class="fa-solid fa-plus"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">등록</span>
                                </button>
                                <button class="btn btn-warning text-nowrap ms-1 px-2.5" onclick="a_update_modal_in()">
                                    <i class="fa-solid fa-pen"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">수정</span>
                                </button>
                                <button class="btn btn-danger text-nowrap ms-1 px-2.5" onclick="a_delete_submit()">
                                    <i class="fa-solid fa-trash-can"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">삭제</span>
                                </button>
                            </div>
                        </div>

                        <!-- 건별 게시물 -->
                        <div class="col-xxl-12">
                            <div class="custom_table table-responsive">
                                <table class="table table-hover">
                                    <thead class="thead-light">
                                        <tr class="text-nowrap">
                                            <th>순번</th>
                                            <th>출고번호</th>
                                            <th>출고일자</th>
                                            <th>품번</th>
                                            <th>품명</th>
                                            <th>제품정보1</th>
                                            <th>제품정보2</th>
                                            <th>자재분류</th>
                                            <th>출고수량</th>
                                            <th>출고창고</th>
                                            <th>출고구분</th>
                                            <th>비고</th>
                                        </tr>
                                    </thead>
                                    <tbody id="a_tbody"></tbody>
                                </table>
                            </div>
                            <div class="div_center mt-3" id="a_nation_id"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- a_create_modal -->

                                    <button class="btn btn-sm px-1 py-0" onclick="openFactoryCodePage('factory_faulty_class', 'create')">
                                        <i class="fa-solid fa-gear"></i>
                                    </button>
                                </label>
                                <select class="form-control" id="faulty_class"></select>
                            </div>
        
                            <div class="col-md-4 mb-3">
                                <label for="desc1" class="form-label">출고 구분</label>
                                <input type="text" class="form-control" id="desc1">
                            </div>
        
                            <div class="col-md-4 mb-3">
                                <label for="desc2" class="form-label">비고</label>
                                <input type="text" class="form-control" id="desc2">
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-6 col-md-3 ps-3">
                        <div class="col-12">
                            <label for="warehouse" class="form-label fw-bold">출고 창고
                                <button class="btn btn-sm px-1 py-0" onclick="openFactoryCodePage('factory_warehouse', 'create')">
                                    <i class="fa-solid fa-gear"></i>
                                </button>
                            </label>
                            <div class="d-none">
                                <select class="form-control div_required" id="warehouse"></select>
                            </div>
                        </div>
                        
                        <div class="card border border-light div_required mb-2">
                            <div class="card-body p-2">
                                <div id="warehouse_list" style="max-height: 280px; overflow-y: auto;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer d-flex justify-content-end">
                <div class="col-8 d-flex justify-content-end">
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" onclick="a_create_modal_reset()">초기화</div>

                    <div class="btn btn-secondary text-nowrap mx-1 px-3" data-bs-dismiss="modal">닫기</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let a_click_id;
let a_click_code;
let a_click_item_id;
let a_click_item_code;
let a_click_item_name; 
let a_click_warehouse_id;
let a_click_warehouse_name;
let a_click_faulty_class_id;
let a_click_faulty_class_name;
let a_click_customer_id;
let a_click_customer_name;
let a_click_date;
let a_click_total_amount;
let a_click_faulty_amount;
let a_click_result_amount;
let a_click_price;
let a_click_desc1;
let a_click_desc2;
let a_click_desc3;
let a_click_updated_by_name;
let a_click_updated_at;

let fr_date;
let to_date;
let all_sch;
let sch_item;

let a_nation_data = {
    cname: 'a_nation',  // 인스턴스 명과 일치해야함
    nation_id: 'a_nation_id',
    range: 5,
    page_size: 20,  // 세로 Row 수
};

function a_search_ready() {
    a_click_id = null;
    a_nation.page = 1;
    a_nation_data.page_size = $("#a_page_size").val();
    
    all_sch = $('#all_sch').val();
    fr_date = $('#fr_date').val();
    to_date = $('#to_date').val();
    sch_item = $('#sch_item').val();

    a_search();
}

function a_search() {
    let query = "?page=" + a_nation.page + "&page_size=" + a_nation_data.page_size;
    if (all_sch) { query += "&all_sch=" + all_sch; }
    if (fr_date) { query += "&fr_date=" + fr_date; }
    if (to_date) { query += "&to_date=" + to_date; }
    if (sch_item) { query += "&sch_item=" + sch_item; }

    fetch_gp("/factory_inventory_out_read_fn/" + query, 'GET', true, {}, (done) => {
        a_draw_table(done);
    });
}

function a_draw_table(done) {

            <td colspan="99" style="text-align: center;">등록된 데이터가 없습니다.</td>
        </tr>`;
        $('#a_tbody').html(emptyRow);
        return;
    }

    let num = ((a_nation.page - 1) * a_nation_data.page_size) + 1;
    let rows = "";
    for (let i = 0; i < data.length; i++) {
        let item = data[i];

        let row = `
        <tr id='${item.id}' class='align-middle text-nowrap' style='cursor:pointer;'>
            <td>${num + i}</td>
            <td name='code'>${item.code || ""}</td>
            <td name='date'>${item.date || ""}</td>
            <td name='item_code'>${item.item.code || ""}</td>

            <td name='warehouse_name'>${item.warehouse_name || ""}</td>

function draw_warehouse_list(done, modalType, default_warehouse) {
    // console.log("draw_warehouse_list: ", done)
    
    let targetModal = `#${modalType}`;
    let data = done.results;
    if (!data || data.length === 0) {
        let emptyRow = `
            <div class="text-center py-4">등록된 데이터가 없습니다.</div>
        `;
        $(targetModal +' #warehouse_list').html(emptyRow);
        return;
    }

    let html = "";
    data.forEach((item, idx) => {
        html += `
            <div class="card border border-light mb-2 warehouse-card"
                 data-index="${idx}"
                 data-warehouse-id="${item.warehouse_id}"
                 style="cursor: pointer;">
                <div class="card-body d-flex p-2">
                    <div class="col-4 d-flex justify-content-center align-items-center">
                        <i class="fa-solid fa-warehouse" style="font-size: 24px;"></i>
                    </div>
                    <div class="col-8">
                        <div class="fw-bold">${item.warehouse_name || ''}</div>
                        <div class="d-flex justify-content-start align-items-center">
                            <span class="badge bg-info px-2 py-1">현재고</span>
                            <span class="ms-2">${formatNumber(item.warehouse_item_stock, 2) || ""}</span>
                        </div>
                    </div>
                </div>
            </div>
        `;
    });

    $(targetModal +' #warehouse_list').html(html);

    // 좌클릭: 출고창고 지정
    $(targetModal +' .warehouse-card').on('click', function (e) {
        $(targetModal +' .warehouse-card').removeClass('bg-danger-subtle');
        $(this).addClass('bg-danger-subtle');

        let warehouseId = $(this).data('warehouse-id');
        init_Select2_modal(targetModal + ' #warehouse', '선택', '/sel2_code_warehouse/', {id: 'id', txt: item => `${item.text}`}, warehouseId);
    });
    
    $(targetModal +` .warehouse-card[data-warehouse-id="${default_warehouse}"]`).addClass('bg-danger-subtle');
}

function get_result_amount(obj, cnt, modalType) {
    let targetModal = `#${modalType}`;
    let totalRaw = $(targetModal + ' #total_amount').val().replace(/,/g, '');
    let faultyRaw = $(targetModal + ' #faulty_amount').val().replace(/,/g, '');

    let total = parseFloat(totalRaw || 0);
    let faulty = parseFloat(faultyRaw || 0);
    let result = total - faulty;

    let resultStr = (totalRaw.includes('.') || faultyRaw.includes('.'))
        ? result.toFixed(cnt)
        : String(result);  // 정수는 소수점 제거

    $(targetModal + ' #result_amount').val(formatNumber(resultStr, cnt));
    checkNumber(obj, cnt);
}

function checkNumber(obj, cnt = 0) {
    let val = $(obj).val().replace(/[^0-9.\-]/g, '');

    if (val.startsWith('-')) {
        val = '-' + val.slice(1).replace(/-/g, '');
    } else {
        val = val.replace(/-/g, '');
    }

    obj.value = formatNumber(val, cnt);
}

function formatNumber(val, cnt = 0) {
    if (val == null) return '';  // null, undefined 방지
    val = String(val);           // 문자열 강제 변환
    
    if (!val || val === '-' || val === '.' || val === '-.') return val;

    const [intPart, decPart] = val.split('.');
    const intFormatted = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    // 사용자가 소수점 입력했을 때만 소수점 표시
    if (val.includes('.') && cnt > 0) {
        return `${intFormatted}.${(decPart || '').slice(0, cnt)}`;
    }

    return intFormatted;
}

function del_comma(val) {
    return typeof val === 'string' ? val.replace(/,/g, '') : val;
}


const modalConfigs = [
    { modalId: 'a_create_modal', iconId: 'md_fullscreen_create' },
    { modalId: 'a_update_modal', iconId: 'md_fullscreen_update' },
];

modalConfigs.forEach(({ modalId, iconId }) => {
    const modalElement = document.getElementById(modalId);
    const iconElement = document.getElementById(iconId);

    if (modalElement && iconElement) {
        iconElement.addEventListener('click', () => {
            toggleModalFullscreen(modalElement, iconElement);
        });

        $(`#${modalId}`).on('hidden.bs.modal', () => {
            resetModalFullscreen(modalElement, iconElement);
        });
    }
});

document.querySelectorAll('.modal-header').forEach(header => {
    header.addEventListener('dblclick', function () {
        const modalElement = this.closest('.modal');
        const iconElement = this.querySelector('.fa-expand, .fa-compress');
        if (modalElement && iconElement) {
            toggleModalFullscreen(modalElement, iconElement);
        }
    });
});

</script>
