<!-- 오류 페이지 -->

<!DOCTYPE html>
<html style="overflow-x:hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}

<style>
body {
    background: url('{% static 'img/login_office.jpg' %}') no-repeat center center/cover;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    position: relative;
    overflow: hidden;
}

body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: black;
    opacity: 0.1;
    z-index: 0;
}

.loginbox {
    background-color: rgba(245, 245, 245, 0.8);
    border: 20px double #fff;
    z-index: 1;
}

@media (max-width: 768px) {
    .box-margin {
        transform: translateY(-50px);
    }
}

</style>

<div class="container-fluid">
    <div class="box-margin row no-gutters justify-content-center align-items-start align-items-md-center flex-column">
        <div class="loginbox card col-11 col-md-8 col-lg-6 col-xl-4 align-self-center my-4">

            <div class="card-body p-4 p-md-5">
                <div class="col-12">
                    <div class="text-center">
                        <div>
                            <div class="text-warning" style="font-size: 100px;"><i class="fa-solid fa-triangle-exclamation"></i></div>
                            <h1 class="text-dark fs-3 fw-bold">오류 발생</h1>
                            <h1 class="text-dark fs-5 mb-3">{{ message }}</h1>
                            <div class="text-muted fs-6 mb-5">이용에 불편을 드려 죄송합니다</div>

                            <div class="d-flex justify-content-center">
                                <button class="btn btn-dark w-50 p-2" onclick="refresh()">돌아가기</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
window.onkeydown = function (event) {
    if (event.keyCode == 116) {  // F5
        event.returnValue = false;
        refresh();
    }
}

function refresh() {
    window.location.href = "/index/"
}

</script>
