<!-- 프로젝트 > 태스크 간트 -->

<!DOCTYPE html>
<html style="overflow-x: hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}

<style>
/* 전체 컨테이너 */
#gantt-container {
    overflow-x: auto;
}
#month-header, #timeline, #gantt-table {
    width: fit-content;
}

/* 행 레이아웃 기본 */
.month-row, .date-row, .project-row {
    display: flex;
    min-width: max-content;
    border-bottom: 1px solid #dee2e6;
}

/* 월/일 공통 셀 스타일 */
.month-cell, .day-cell {
    width: 30px;
    min-width: 30px;
    height: 32px;
    line-height: 32px;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
    text-align: center;
    border-right: 1px solid #dee2e6;
    box-sizing: border-box;
    background-color: white;
    transition: background-color 0.2s ease;
}

/* 사용자 셀 */
.project-title {
    width: 150px;
    min-width: 150px;
    border-right: 1px solid #dee2e6;
    background-color: white;
    box-sizing: border-box;
    font-size: 0.75rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: inline-block;
    align-items: center;
    padding: 6px 8px;
    position: sticky;
    left: 0;
    z-index: 7;
}

.project-info {
    width: 100px;
    min-width: 100px;
    border-right: 1px solid #dee2e6;
    background-color: white;
    box-sizing: border-box;
    font-size: 0.75rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: inline-block;
    align-items: center;
    padding: 6px 8px;
}

.project-no {
    width: 45px;
    min-width: 45px;
    border-right: 1px solid #dee2e6;
    background-color: white;
    box-sizing: border-box;
    font-size: 0.75rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    padding: 6px 8px;
}

.project-title.info-header, .project-info.info-header, .project-no.info-header {
    font-weight: 600;
    background-color: #f8f9fa;
    text-align: center;
}

/* day-row : 주말 cell 표시 */
.day-cell.weekend {
    background-color: rgba(255, 182, 193, 0.2);
}

/* day-row : 사용자 휴가 cell 표시 */
.day-cell.user-leave {
    background-color: rgba(240, 128, 128, 0.3);
    z-index: 6;
    position: relative;
}
.day-cell.user-leave.today {
    z-index: 6;
}

/* day-row : 공휴일 cell 표시 */
.day-cell.holiday {
    background-color: rgba(240, 128, 128, 0.2);
}

/* day-row : 오늘 cell 표시 */
.day-cell.today {
    border-left: 2px solid #ffc107 !important;
    border-right: 2px solid #ffc107 !important;
    z-index: 2;
}

.day-header.day-cell.today {
    background-color: #ffc107 !important;
    z-index: 2;
}

/* day-row : 프로젝트 cell 표시 */
.day-cell.project-active {
    background-color: rgba(135, 206, 250, 0.2) !important;
}

/* day-row : 프로젝트 + 주말(공휴일) cell 표시 */
.day-cell.weekend.project-active, .day-cell.holiday.project-active {
    background-color: rgba(135, 206, 250, 0.4) !important;
}

/* 프로젝트 행 내 셀 */
.project-row .day-cell {
    border-right: 1px solid #dee2e6;
    height: 32px;
    z-index: 2;
}

.project-row {
    position: relative;
}

.project-row.clicked .project-no, .project-row.clicked .project-title, .project-row.clicked .project-info {
    background-color: rgb(245,245,245) !important;
}

/* 실제일정바 */
.real-bar {
    margin-top: 4px;
    height: 24px;
    background-color: rgba(52, 193, 142, 0.5);
    position: absolute;
    top: 0;
    z-index: 5;

    color: white;
    font-size: 12px;
    text-align: start;
    padding-left: 6px;
    line-height: 24px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
}
.real-container {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%; /* 전체 day-cell 영역 기준 */
    {% comment %}z-index: 5;{% endcomment %}
}


/* context-menu 스타일 */
#custom-context-menu {
    min-width: 150px;
    padding: 5px 0;
}
#custom-context-menu .dropdown-item {
    padding: 8px 16px;
    cursor: pointer;
}
#custom-context-menu .dropdown-item:hover {
    background-color: rgba(135, 206, 250, 0.5);
}

/* 드래그 스타일 */
.day-cell.drag-selected {
    background-color: rgba(0, 123, 255, 0.3) !important;
    border: 2px solid #007bff !important;
}


/* select2 컨테이너 너비 지정 */
.input_sel2 + .select2-container {
    width: 180px !important;
}

/* select2 선택창 높이 및 스타일 form-select-sm과 동일하게 */
.input_sel2 + .select2-container .select2-selection--single {
    height: 36.53px !important;
    line-height: 32px !important;
    padding: 0.25rem 0.5rem !important;
    border: 1px solid #6c757d !important; /* border-secondary */
    border-radius: 0.2rem !important;
    position: relative;
}

/* 선택된 항목 텍스트 정렬 */
.input_sel2 + .select2-container .select2-selection__rendered {
    line-height: 30px !important;
    padding-left: 0 !important;
}

/* 화살표 위치 조정 */
.input_sel2 + .select2-container .select2-selection__arrow {
    height: 36.53px !important;
    top: 0 !important;
}

/* 클리어버튼 위치 조정 */
.input_sel2 + .select2-container .select2-selection__clear {
    right: 2.5rem !important;
    top: 50%;
    transform: translateY(-50%);
    position: absolute;
    z-index: 10;
}

</style>

<!-- Content Area -->
<div class="row p-4">

    <!-- 게시물 목록 -->
    <div class="col-12">
        <div class="row gx-4">

            <!-- 상단 메뉴바 -->
            <div class="col-xxl-12">
                <div class="d-inline-block align-items-center mb-3" style="font-size: 20px; color: #2a3040; cursor: pointer; font-weight: 1000;" onclick="refresh()">

                    <i class="fa-regular fa-circle-question fa-2xs" style="vertical-align: super;" data-toggle="tooltip"
                       data-placement="top" onclick="event.stopPropagation();"
                       title="• 사용자 일정관리를 확인할 수 있는 간트차트 입니다.<br>• 태스크 위에서 마우스 왼쪽 클릭하여 태스크를 수정할 수 있습니다.<br>• 날짜 드래그 후 마우스 오른쪽 클릭하여 태스크를 등록할 수 있습니다."></i>
                </div>
            </div>
            
            <div class="col-12">
                <div class="card border border-light">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-3">
                            <div class="d-flex p-0">
                                <div class="d-none d-md-inline btn btn-secondary text-nowrap me-1 px-2.5" onclick="refresh()"
                                     data-toggle="tooltip" data-placement="top" title="새로고침 (F5)">
                                    <i class="fa-solid fa-rotate-right"></i>
                                </div>

                                <select class="d-none d-md-inline page_size form-select form-select-sm me-1" id="a_page_size"
                                        onchange="a_search_ready()" data-toggle="tooltip" data-placement="top" title="리스트에서 표시할 수량">
                                    <option value="10">10개</option>
                                    <option value="20" selected>20개</option>
                                    <option value="50">50개</option>
                                    <option value="100">100개</option>
                                    <option value="200">200개</option>
                                    <option value="500">500개</option>
                                </select>

                                <div class="d-none d-md-flex input-group input-daterange position-relative w-auto me-1"
                                     id="date_filter" data-toggle="tooltip" data-placement="top" title="태스크 계획일로 검색">
                                    <input id="fr_date" type="text" placeholder="시작일 검색" onchange="a_search_ready()" autocomplete="off"
                                           class="form-control date_flatpickr border border-secondary" style="max-width: 120px;">
                                    <input id="to_date" type="text" placeholder="종료일 검색" onchange="a_search_ready()" autocomplete="off"
                                           class="form-control date_flatpickr border border-secondary" style="max-width: 120px; border-top-right-radius: 4px; border-bottom-right-radius: 4px;">
                                    
                                    <div id="date_dropdown" class="d-none position-absolute bg-light border border-secondary-subtle rounded shadow-sm p-1"
                                         style="top: 100%; left: 0; z-index: 1000; min-width: 150px;">
                                        <div class="d-flex align-items-center my-2">
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('yesterday')">어제</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('today')">오늘</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('tomorrow')">내일</button>
                                        </div>
                                        <div class="d-flex align-items-center my-2">
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('last_week')">지난주</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('this_week')">이번주</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('next_week')">다음주</button>
                                        </div>
                                        <div class="d-flex align-items-center my-2">
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('last_month')">지난달</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('this_month')">이번달</button>
                                            <button class="btn btn-sm btn-secondary text-nowrap mx-1 px-2.5" style="width: 60px;" onclick="set_date_range('next_month')">다음달</button>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="d-none d-xl-flex w-auto me-1" data-toggle="tooltip" data-placement="top" title="담당자 팀으로 검색">
                                    <select class="page_size form-select form-select-sm me-1 input_sel2" id="sch_team"
                                            onchange="a_search_ready()">
                                    </select>
                                </div>
                                
                                <div class="d-none d-xl-flex w-auto me-1" data-toggle="tooltip" data-placement="top" title="담당자로 검색">
                                    <select class="page_size form-select form-select-sm me-1 input_sel2" id="sch_tasker"
                                            onchange="a_search_ready()">
                                    </select>
                                </div>
                                
                                <div class="search-box d-flex me-1" data-toggle="tooltip" data-placement="top" title="태스크 코드, 제목, 설명 / 프로젝트 등 텍스트 검색">
                                    <div class="position-relative flex-grow-1">
                                        <input type="text" class="form-control rounded border-secondary" id="all_sch" placeholder="검색어 입력">
                                        <i class="mdi mdi-magnify search-icon"></i>
                                    </div>
                                </div>

                                <button class="btn btn-secondary text-nowrap me-1 px-2.5" onclick="a_search_ready()">
                                    <i class="fa-solid fa-magnifying-glass"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">검색</span>
                                </button>
                                
                                <button class="btn btn-secondary text-nowrap me-1 px-2.5" onclick="openCodePage('project_category', 'create')">
                                    <i class="fa-solid fa-gear"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">코드</span>
                                </button>
                            </div>

                            {% comment %}<div class="d-flex p-0">
                                <button class="btn btn-success text-nowrap ms-1 px-2.5" onclick="a_create_modal_in()">
                                    <i class="fa-solid fa-plus"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">등록</span>
                                </button>
                                <button class="btn btn-warning text-nowrap ms-1 px-2.5" onclick="a_update_modal_in()">
                                    <i class="fa-solid fa-pen"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">수정</span>
                                </button>
                                <button class="btn btn-danger text-nowrap ms-1 px-2.5" onclick="a_delete_submit()">
                                    <i class="fa-solid fa-trash-can"></i><span class="d-none d-xl-inline m-0 p-0 ms-2">삭제</span>
                                </button>
                            </div>{% endcomment %}
                        </div>

                        <!-- 간트 차트 -->
                        <div class="col-12 d-flex align-items-start mb-3">
                            <div class="table-responsive border rounded shadow-sm w-100" id="gantt-container">
                                <div id="gantt-table" class="w-100">
                                    <!-- 여기에 JS로 표 구조 삽입 -->
                                </div>
                            </div>
                        </div>
        
                        <div class="div_center" id="a_nation_id"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- a_create_modal -->
<div class="modal fade" id="a_create_modal" tabindex="-1" role="dialog" aria-labelledby="a_create_modal"
     data-bs-backdrop="static" data-bs-keyboard="true" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">

            <div class="modal-header d-flex justify-content-between align-items-center">
                <h5 class="modal-title mx-2">태스크 간트 <i class="fa-solid fa-angle-right px-1"></i> 등록</h5>
                <div>
                    <i class="fa-solid fa-expand fa-lg text-white mx-2" title="전체화면" style="cursor: pointer;" id="md_fullscreen_create"></i>
                    <i class="fa-solid fa-rotate-right fa-lg text-white mx-2" title="초기화" style="cursor: pointer;" onclick="a_create_modal_reset()"></i>
                    <i class="fa-solid fa-xmark fa-xl text-white mx-2" title="닫기" style="cursor: pointer;" data-bs-dismiss="modal"></i>
                </div>
            </div>

            <div class="modal-body w-100 p-4">
                <div class="row">
                    <div class="col-4 mb-3 d-none">
                        <label for="code" class="form-label">태스크 코드</label>
                        <input type="text" class="form-control" id="code" placeholder="자동 생성" disabled>
                    </div>
                    <div class="col-4 mb-3">
                        <label for="project" class="form-label fw-bold">프로젝트</label>
                        <select class="form-control div_required" id="project"></select>
                    </div>
                    <div class="col-4 mb-3">
                        <label for="title" class="form-label fw-bold">태스크 제목</label>
                        <input type="text" class="form-control div_required" id="title">
                    </div>
                    <div class="col-4 mb-3">
                        <label for="tasker" class="form-label">담당자</label>
                        <select class="form-control" id="tasker"></select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4 mb-3">
                        <label for="cat1" class="form-label">대분류</label>
                        <select class="form-control" id="cat1"></select>
                    </div>
                    <div class="col-4 mb-3">
                        <label for="cat2" class="form-label">중분류</label>
                        <select class="form-control" id="cat2"></select>
                    </div>
                    <div class="col-4 mb-3">
                        <label for="cat3" class="form-label">소분류</label>
                        <select class="form-control" id="cat3"></select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-3 mb-3">
                        <label for="plan_start" class="form-label">계획 시작일</label>
                        <input type="text" class="form-control date_flatpickr" id="plan_start">
                    </div>
                    <div class="col-3 mb-3">
                        <label for="plan_end" class="form-label">계획 목표일</label>
                        <input type="text" class="form-control date_flatpickr" id="plan_end">
                    </div>
                    <div class="col-2 mb-3">
                        <label for="plan_time" class="form-label">예상 업무시간</label>
                        <input type="number" class="form-control" id="plan_time" value="0" min="0">
                    </div>
                    <div class="col-4 mb-3">
                        <label for="planner" class="form-label">매니저</label>
                        <select class="form-control" id="planner"></select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-3 mb-3">
                        <label for="real_start" class="form-label">실제 시작일</label>
                        <input type="text" class="form-control date_flatpickr" id="real_start">
                    </div>
                    <div class="col-3 mb-3">
                        <label for="real_end" class="form-label">실제 종료일</label>
                        <input type="text" class="form-control date_flatpickr" id="real_end">
                    </div>
                    <div class="col-2 mb-3">
                        <label for="real_time" class="form-label">실제 업무시간</label>
                        <input type="number" class="form-control" id="real_time" value="0" min="0">
                    </div>
                    <div class="col-2 mb-3">
                        <label for="progress" class="form-label">진행률</label>
                        <input type="number" class="form-control" id="progress" value="0" min="0" max="100">
                    </div>
                    <div class="col-2 mb-3">
                        <label for="select_status" class="form-label">진행상태</label>
                        <select class="form-select" id="select_status">
                            <option value="대기">대기</option>
                            <option value="진행">진행</option>
                            <option value="완료">완료</option>
                            <option value="중단">중단</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 mb-3">
                        <label for="detail" class="form-label">세부내용</label>
                        <textarea class="form-control" id="detail" rows="4"></textarea>
                    </div>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label for="tasker_comment" class="form-label">담당자 코멘트</label>
                        <input type="text" class="form-control" id="tasker_comment">
                    </div>
                    <div class="col-6 mb-3">
                        <label for="planner_comment" class="form-label">매니저 코멘트</label>
                        <input type="text" class="form-control" id="planner_comment">
                    </div>
                </div>
            </div>

            <div class="modal-footer d-flex justify-content-end">
                <div class="col-8 d-flex justify-content-end">
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" onclick="a_create_modal_reset()">초기화</div>
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" onclick="a_create_submit()">등록</div>
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" data-bs-dismiss="modal">닫기</div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- a_update_modal -->

let start_date_padding = 4; // day-cell 앞쪽 여유일
let end_date_padding = 10; // day-cell 뒤쪽 여유일

function draw_gantt_chart(items) {
    const $gantt = $('#gantt-table');
    $gantt.empty();

    if (!items || items.length === 0) {
        $gantt.append(`
            <div class="text-center text-muted py-5" style="font-size: 26px; margin: 100px 0;">
                <i class="fa-solid fa-exclamation-triangle fa-2x mb-3" style="font-size: 100px;"></i><br>
                검색 조건을 만족하는 사용자 및 태스크가 없습니다.<br>검색 조건을 다시 확인해주세요.
            </div>
        `);
        return;
    }

    const dates = getMinMaxDates(items.flatMap(u => u.tasks));
    const startDate = new Date(dates.startDate);
    const endDate = new Date(dates.endDate);
    startDate.setDate(startDate.getDate() - start_date_padding);
    endDate.setDate(endDate.getDate() + end_date_padding);
    globalStartDate = new Date(startDate);

    const dayCount = Math.floor((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    $gantt.append(renderMonthHeader(startDate, dayCount));
    $gantt.append(renderDateHeader(startDate, dayCount, today));

    let rowNo = ((a_nation.page - 1) * a_nation_data.page_size) + 1;
    items.forEach(user => {
        const profileHTML = user.profile_image ? `<img src="${user.profile_image}" alt="프로필" class="d-none d-md-inline-block" style="width: 20px; height: 20px; border-radius: 50%; vertical-align: middle; margin-right: 4px;">` : '';
        const job_level = user.job_level || '';
        const userLabel = `${profileHTML}<span>${user.name} ${job_level}</span>`;

        const userRow = $(`
            <div class="project-row" data-tasker_id="${user.id}">
                <div class="project-no">${rowNo++}</div>
                <div class="project-title">${userLabel}</div>
            </div>`);

        const container = $('<div style="position: relative;"></div>');
        const dayCellRow = $('<div style="display: flex;"></div>');
        const realContainer = $('<div class="real-container"></div>');
        
        for (let i = 0; i < dayCount; i++) {
            const currentDate = new Date(startDate);
            currentDate.setDate(startDate.getDate() + i);
            const ymd = currentDate.toISOString().split("T")[0];
        
            const holiday = getHoliday(currentDate);
            const isWeekend = currentDate.getDay() === 0 || currentDate.getDay() === 6;
            const isToday = isSameDate(currentDate, today);
        
            // 셀 생성
            const cell = $('<div class="day-cell"></div>');
            if (isWeekend) cell.addClass('weekend');
            if (holiday) cell.addClass('holiday');
            if (isToday) cell.addClass('today');
        
            // 휴가 여부 판단 및 툴팁 처리
            if (userHolidays && userHolidays.results) {
                const leave = userHolidays.results.find(leave => {
                    if (!leave.created_by || leave.created_by.id !== user.id) return false;
                    const from = new Date(leave.start_date);
                    const to = new Date(leave.end_date);
                    return currentDate >= from && currentDate <= to;
                });
        
                if (leave) {
                    cell.addClass('user-leave');
                    cell.attr({
                        'data-bs-toggle': 'tooltip',
                        'title': `${leave.title} (${leave.start_date} ~ ${leave.end_date})`
                    });
                }
            }
        
            dayCellRow.append(cell);
        }

        container.append(dayCellRow);
        container.append(realContainer);
        userRow.append(container);
        $gantt.append(userRow);

        user.tasks.forEach(task => {
            if (!task.real_start || !task.real_end) return;

            const realStart = new Date(task.real_start);
            const realEnd = new Date(task.real_end);

            const offset = (realStart - startDate) / (1000 * 60 * 60 * 24);
            const length = (realEnd - realStart) / (1000 * 60 * 60 * 24) + 1;

            const progressBarColor =
                task.status === '완료' ? 'rgba(52, 193, 142, 0.8)' :
                task.status === '중단' ? 'rgba(255, 99, 132, 0.5)' :
                task.status === '대기' ? 'rgba(108, 117, 125, 0.5)' :
                'rgba(0,157,255,0.7)';

            const realBar = $('<div class="real-bar"></div>').text(task.title);  // 태스크 이름 표시
            const cellWidth = 30;
            const barMargin = 8;

                a_click_real_start = t.real_start;
                a_click_real_end = t.real_end;

        container.on('contextmenu', function (e) {

            // real-bar 전용 항목 토글

            $('.realbar_only').toggle(isOnRealBar);

            $('.project-row').removeClass('clicked');
            $(this).addClass('clicked');
    
            $('#custom-context-menu').css({
                display: 'block',
                left: e.pageX,
                top: e.pageY
            });

                    a_click_project_title = t.project?.title;

            }
    
            return false;
        });
    
        // 다른 곳 클릭 시 메뉴 숨기기
        $(document).on('click', function () {
            $('#custom-context-menu').hide();
        });
    
        return container;
    });
}

// real_start와 real_end만으로 테이블 구성
function getMinMaxDates(items) {
    const dates = items.flatMap(i => {
        const starts = [i.real_start].filter(Boolean).map(d => new Date(d));
        const ends = [i.real_end].filter(Boolean).map(d => new Date(d));
        return [...starts, ...ends];
    });

    if (dates.length === 0) {
        const today = new Date();
        return {
            startDate: today,
            endDate: today
        };
    }

    return {
        startDate: new Date(Math.min(...dates)),
        endDate: new Date(Math.max(...dates))
    };
}

function renderMonthHeader(startDate, dayCount) {
    let html = `<div class="month-row">
                <div class="project-no info-header" style="border-right: none !important;"></div>
                <div class="project-title info-header" style="border-right: none !important; width: 150px;"></div>
                `;
    let span = 0;
    let currentDate = new Date(startDate);
    let prevMonth = currentDate.getMonth();
    let labelDate = new Date(currentDate);

    for (let i = 0; i <= dayCount; i++) {
        const loopMonth = currentDate.getMonth();
        if (loopMonth !== prevMonth || i === dayCount) {
            const label = `${labelDate.getFullYear()}년 ${String(prevMonth + 1).padStart(2)}월`;
            html += `<div class="month-cell" style="width:${span * 30}px;">${label}</div>`;
            span = 0;
            prevMonth = loopMonth;
            labelDate = new Date(currentDate);
        }
        span++;
        currentDate.setDate(currentDate.getDate() + 1);
    }
    html += `</div>`;
    return html;
}

function renderDateHeader(startDate, dayCount, today) {
    let html = `<div class="date-row">
                <div class="project-no info-header">순번</div>
                <div class="project-title info-header" style="width: 150px;">이름</div>
                `;

    for (let i = 0; i < dayCount; i++) {
        const d = new Date(startDate);
        d.setDate(startDate.getDate() + i);

        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const isToday = isSameDate(d, today);
        const holiday = getHoliday(d);

        let classes = "day-cell";
        if (isWeekend) classes += " weekend";
        if (holiday) classes += " holiday";
        if (isToday) classes += " today";

        const tooltip = holiday ?
            `data-bs-toggle="${holiday.toggle}" data-bs-placement="${holiday.placement}" title="${d.toISOString().split("T")[0]} ${holiday.name}"` :
            "";

        html += `<div class="day-header ${classes}" ${tooltip}>${d.getDate()}</div>`;
    }
    html += `</div>`;
    return html;
}

// 주말 반영 함수
function getHoliday(date) {
    const ymd = date.toISOString().split("T")[0];
    const h = customWeekends.find(h => {
        const start = new Date(h.start_date).toISOString().split("T")[0];
        const end = new Date(h.end_date).toISOString().split("T")[0];
        return start <= ymd && ymd <= end;
    });

    if (h) {
        return {
            ...h,
            toggle: "tooltip",
            placement: "top"
        };
    }
    return null;
}

// 오늘 반영 함수
function isSameDate(d1, d2) {
    return (
        d1.getFullYear() === d2.getFullYear() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getDate() === d2.getDate()
    );
}

// 드래그 데이트 이벤트
let a_click_start_drag;
let a_click_end_drag;
let instant_plan_start_drag;
let instant_plan_end_drag;
let globalStartDate = null;
let isDraggingPlan = false;
let dragStartIndex = null;
let dragEndIndex = null;
let dayCells = [];

$(document).on('mousedown', '.project-row .day-cell', function (e) {
    if (e.which !== 1) return;  // 좌클릭만 허용 (오른쪽: 3 또는 2, 왼쪽: 1)

    clearDragHighlight();  // 기존 드래그 셀 초기화

    isDraggingPlan = true;
    dayCells = $(this).closest('.project-row').find('.day-cell');
    dragStartIndex = dayCells.index(this);
    dragEndIndex = dragStartIndex;
    highlightDragRange();
});

$(document).on('mouseover', '.project-row .day-cell', function (e) {
    if (!isDraggingPlan) return;
    const currentIndex = dayCells.index(this);
    dragEndIndex = currentIndex;
    highlightDragRange();
});

$(document).on('mouseup', '.project-row .day-cell', function (e) {
    if (!isDraggingPlan) return;
    isDraggingPlan = false;

    const row = $(this).closest('.project-row');
    const isEmptyRow = !row.data('id');
    const start = Math.min(dragStartIndex, dragEndIndex);
    const end = Math.max(dragStartIndex, dragEndIndex);

    const startBase = globalStartDate || new Date();
    const startDate = new Date(startBase);
    const endDate = new Date(startBase);
    startDate.setDate(startBase.getDate() + start);
    endDate.setDate(startBase.getDate() + end);

    const formattedStart = formatDate(startDate);
    const formattedEnd = formatDate(endDate);

    a_click_start_drag = formattedStart;
    a_click_end_drag = formattedEnd;
    a_click_tasker_id = row.data('tasker_id');
});

function highlightDragRange() {
    dayCells.removeClass('drag-selected');
    const start = Math.min(dragStartIndex, dragEndIndex);
    const end = Math.max(dragStartIndex, dragEndIndex);
    for (let i = start; i <= end; i++) {
        dayCells.eq(i).addClass('drag-selected');
    }
}

function clearDragHighlight() {
    $('.day-cell').removeClass('drag-selected');
}

function formatDate(date) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
}

function set_date_range(range) {
    const today = new Date();
    let start, end;
    
    if (range === 'yesterday') {
        start = end = new Date(today);
        start.setDate(today.getDate() - 1);
        end.setDate(today.getDate() - 1);
    } else if (range === 'today') {
        start = end = new Date(today);
    } else if (range === 'tomorrow') {
        start = end = new Date(today);
        start.setDate(today.getDate() + 1);
        end.setDate(today.getDate() + 1);
    } else if (range === 'last_week') {
        const day = today.getDay() || 7;
        end = new Date(today);
        end.setDate(today.getDate() - day);
        start = new Date(end);
        start.setDate(end.getDate() - 6);
    } else if (range === 'this_week') {
        const day = today.getDay() || 7;
        start = new Date(today);
        start.setDate(today.getDate() - day + 1);
        end = new Date(start);
        end.setDate(start.getDate() + 6);
    } else if (range === 'next_week') {
        const day = today.getDay() || 7;
        start = new Date(today);
        start.setDate(today.getDate() - day + 8);
        end = new Date(start);
        end.setDate(start.getDate() + 6);
    } else if (range === 'last_month') {
        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        end = new Date(today.getFullYear(), today.getMonth(), 0);
    } else if (range === 'this_month') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    } else if (range === 'next_month') {
        start = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        end = new Date(today.getFullYear(), today.getMonth() + 2, 0);
    }
    
    $('#fr_date').val(formatDate(start));
    $('#to_date').val(formatDate(end));
    a_search_ready();
}
