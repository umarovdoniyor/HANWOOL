<!DOCTYPE html>
<html style="overflow-x: hidden;">

{% load static %}
{% include 'header.html' %}
{% include 'footer.html' %}
{% include 'html_lib.html' %}

<style>
/* 전체 컨테이너 */
#gantt-container {
    overflow-x: auto;
}
#month-header, #timeline, #gantt-table {
    width: fit-content;
}

/* 행 레이아웃 기본 */
.month-row, .date-row, .project-row {
    display: flex;
    min-width: max-content;
    border-bottom: 1px solid #dee2e6;
}

/* 월/일 공통 셀 스타일 */
.month-cell, .day-cell {
    width: 30px;
    min-width: 30px;
    height: 32px;
    line-height: 32px;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
    text-align: center;
    border-right: 1px solid #dee2e6;
    box-sizing: border-box;
    background-color: white;
    transition: background-color 0.2s ease;
}

/* 프로젝트셀 공용 */
.project-cell {
    border-right: 1px solid #dee2e6;
    background-color: white;
    box-sizing: border-box;
    font-size: 0.75rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: inline-block;
    align-items: center;
    padding: 6px 8px;
}

.project-no {
    width: 45px;
    min-width: 45px;
    display: flex;
}

.project-title {
    width: 250px;
    min-width: 250px;
    position: sticky;
    left: 0;
    z-index: 7;
}

.project-info {
    width: 100px;
    min-width: 100px;
}

.project-title.info-header, .project-info.info-header, .project-no.info-header {
    font-weight: 600;
    background-color: #f8f9fa;
    text-align: center;
}

/* 사용자 필드 스크롤시 고정 */
.user_top_fixed {
    position: sticky;
    left: 250px;
    z-index: 7;
    width: 150px;
}

/* day-row : 주말 cell 표시 */
.day-cell.weekend {
    background-color: rgba(255, 182, 193, 0.2);
}

/* day-row : 공휴일 cell 표시 */
.day-cell.holiday {
    background-color: rgba(240, 128, 128, 0.2);
}

/* day-row : 오늘 cell 표시 */
.day-cell.today {
    border-left: 2px solid #ffc107 !important;
    border-right: 2px solid #ffc107 !important;
    z-index: 2;
}

.day-header.day-cell.today {
    background-color: #ffc107 !important;
    z-index: 2;
}

/* day-row : 프로젝트 cell 표시 */
.day-cell.project-active {
    background-color: rgba(135, 206, 250, 0.2) !important;
}

/* day-row : 프로젝트 + 주말(공휴일) cell 표시 */
.day-cell.weekend.project-active, .day-cell.holiday.project-active {
    background-color: rgba(135, 206, 250, 0.4) !important;
}

/* 프로젝트 행 내 셀 */
.project-row .day-cell {
    border-right: 1px solid #dee2e6;
    height: 32px;
}

.project-row {
    position: relative;
    cursor: pointer;
}

.project-row.clicked .project-no, .project-row.clicked .project-title, .project-row.clicked .project-info {
    background-color: rgb(245,245,245) !important;
}

/* 실제일정바 */
.real-bar {
    margin-top: 0.5rem;
    height: 16px;
    background-color: rgba(52, 193, 142, 0.7);
    position: absolute;
    top: 0;
    z-index: 5;
}
.real-container {
    position: relative;
    width: fit-content;
    height: 0;
}

/* context-menu 스타일 */
#custom-context-menu {
    min-width: 150px;
    padding: 5px 0;
}
#custom-context-menu .dropdown-item {
    padding: 8px 16px;
    cursor: pointer;
}
#custom-context-menu .dropdown-item:hover {
    background-color: rgba(135, 206, 250, 0.5);
}

/* 드래그 스타일 */
.day-cell.drag-selected {
    background-color: rgba(0, 123, 255, 0.3) !important;
    border: 2px solid #007bff !important;
}

/* 신규등록 row 확인 이벤트 */
.project-row.updated_row .project-no, .project-row.updated_row .project-title, .project-row.updated_row .project-info {
    animation: fadeOutHighlight 10s ease-out forwards;
}

/* 부드럽게 밝은 파란색에서 흰색으로 흐려지며 사라짐 */
@keyframes fadeOutHighlight {
    0% {
        background-color: #d0f0ff; /* 연한 하늘색 */
    }
    20% {
        background-color: #85e2ff;
    }
    40% {
        background-color: #b3ecff;
    }
    60% {
        background-color: #e0f7ff;
    }
    80% {
        background-color: #f5fcff;
    }
    100% {
        background-color: #ffffff; /* 흰색으로 자연스럽게 사라짐 */
    }
}

/* select2 컨테이너 너비 지정 */
.input_sel2 + .select2-container {
    width: 180px !important;
}

/* select2 선택창 높이 및 스타일 form-select-sm과 동일하게 */
.input_sel2 + .select2-container .select2-selection--single {
    height: 36.53px !important;
    line-height: 32px !important;
    padding: 0.25rem 0.5rem !important;
    border: 1px solid #6c757d !important; /* border-secondary */
    border-radius: 0.2rem !important;
    position: relative;
}

/* 선택된 항목 텍스트 정렬 */
.input_sel2 + .select2-container .select2-selection__rendered {
    line-height: 30px !important;
    padding-left: 0 !important;
}

/* 화살표 위치 조정 */
.input_sel2 + .select2-container .select2-selection__arrow {
    height: 36.53px !important;
    top: 0 !important;
}

/* 클리어버튼 위치 조정 */
.input_sel2 + .select2-container .select2-selection__clear {
    right: 2.5rem !important;
    top: 50%;
    transform: translateY(-50%);
    position: absolute;
    z-index: 10;
}

</style>

                    <div class="btn btn-secondary text-nowrap mx-1 px-3" onclick="a_create_modal_reset()">초기화</div>
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" onclick="a_create_submit()">등록</div>
                    <div class="btn btn-secondary text-nowrap mx-1 px-3" data-bs-dismiss="modal">닫기</div>
                </div>
            </div>
        </div>
    </div>
</div>


<!-- a_update_modal -->

     data-bs-backdrop="static" data-bs-keyboard="true" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">

            <div class="modal-header d-flex justify-content-between align-items-center">

                <div>

let start_date_padding = 4; // day-cell 앞쪽 여유일
let end_date_padding = 10; // day-cell 뒤쪽 여유일

function draw_gantt_chart(items) {
    const $gantt = $('#gantt-table');
    $gantt.empty();

    if (!items || items.length === 0) {
        $gantt.append(`
            <div class="text-center text-muted py-5" style="font-size: 26px; margin: 100px 0;">
                <i class="fa-solid fa-exclamation-triangle fa-2x mb-3" style="font-size: 100px;"></i><br>
                검색 조건을 만족하는 태스크가 없습니다.<br>검색 조건을 다시 확인해주세요.
            </div>
        `);
        return;
    }

    const dates = getMinMaxDates(items);
    const startDate = new Date(dates.startDate);
    const endDate = new Date(dates.endDate);
    startDate.setDate(startDate.getDate() - start_date_padding);
    endDate.setDate(endDate.getDate() + end_date_padding);
    globalStartDate = new Date(startDate);

    const dayCount = Math.floor((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    $gantt.append(renderMonthHeader(startDate, dayCount));
    $gantt.append(renderDateHeader(startDate, dayCount, today));

    let num = ((a_nation.page - 1) * a_nation_data.page_size) + 1;
    items.forEach((item) => {
        $gantt.append(renderProjectRow(item, startDate, dayCount, today, num));
        num++;
    });

function instant_task_create() {
    const prjVal = $('#instant_project').val();
    const titleVal = $('#instant_title').val().trim();

    if (!prjVal) {
        alert('프로젝트를 선택해주세요.');
        return;
    }
    if (!titleVal) {
        alert('태스크 제목을 입력해주세요.');
        return;
    }
    if (!confirm('해당 태스크를 등록하시겠습니까?')) return;

    let api_data = new FormData();
    api_data.append("prj_id", nullapply(prjVal));
    api_data.append("title", nullapply(titleVal));
    api_data.append("cat1", nullapply($('#instant_cat1').val()));
    api_data.append("cat2", nullapply($('#instant_cat2').val()));
    api_data.append("cat3", nullapply($('#instant_cat3').val()));
    api_data.append("plan_start", nullapply($('#instant_plan_start').val()));
    api_data.append("plan_end", nullapply($('#instant_plan_end').val()));
    api_data.append("progress", nullapply($('#instant_progress').val()));
    api_data.append("status", nullapply($('#instant_status').val()));
    api_data.append("tasker", nullapply($('#instant_tasker').val()));
    api_data.append("planner", '{{ request.user.id }}');

    fetch_gp('/task_create_fn/', 'post', true, api_data, (done) => {
        a_search_ready();
        alert('태스크가 등록되었습니다.');
        show_updated_row(done.id);
    });
}

function show_updated_row(updated_row_id) {
    setTimeout(() => {
        $('.project-row').each(function () {
            if ($(this).data('id') === updated_row_id) {
                $(this).addClass('updated_row');
                setTimeout(() => {
                    $(this).removeClass('updated_row');
                }, 9000);  // 9초 후 제거
            }
        });
    }, 500);  // 0.5초 후에 처리 시작
}

function getMinMaxDates(items) {
    const dates = items.flatMap(i => {
        const starts = [i.plan_start, i.real_start].filter(Boolean).map(d => new Date(d));
        const ends = [i.plan_end, i.real_end].filter(Boolean).map(d => new Date(d));
        return [...starts, ...ends];
    });
    return {
        startDate: new Date(Math.min(...dates)),
        endDate: new Date(Math.max(...dates))
    };
}

function renderMonthHeader(startDate, dayCount) {
    let html = `<div class="month-row">
                <div class="project-cell project-no info-header" style="border-right: none !important;"></div>
                <div class="project-cell project-info info-header" style="border-right: none !important; width: 200px;"></div>
                <div class="project-cell project-title info-header" style="border-right: none !important;"></div>
                <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
                <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
                <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
                <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
                <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
                <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
                <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
                <div class="project-cell project-info info-header user_top_fixed" style="border-right: none !important;"></div>`;
    let span = 0;
    let currentDate = new Date(startDate);
    let prevMonth = currentDate.getMonth();
    let labelDate = new Date(currentDate);

    for (let i = 0; i <= dayCount; i++) {
        const loopMonth = currentDate.getMonth();
        if (loopMonth !== prevMonth || i === dayCount) {
            const label = `${labelDate.getFullYear()}년 ${String(prevMonth + 1).padStart(2)}월`;
            html += `<div class="month-cell" style="width:${span * 30}px;">${label}</div>`;
            span = 0;
            prevMonth = loopMonth;
            labelDate = new Date(currentDate);
        }
        span++;
        currentDate.setDate(currentDate.getDate() + 1);
    }
    html += `</div>`;
    return html;
}

function renderDateHeader(startDate, dayCount, today) {
    let html = `<div class="date-row">
                <div class="project-cell project-no info-header">순번</div>
                <div class="project-cell project-info info-header" style="width: 200px;">프로젝트</div>

                <div class="project-cell project-info info-header">진행률</div>
                <div class="project-cell project-info info-header user_top_fixed">담당자</div>`;

        d.setDate(startDate.getDate() + i);

        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const isToday = isSameDate(d, today);
        const holiday = getHoliday(d);

        let classes = "day-cell";
        if (isWeekend) classes += " weekend";
        if (holiday) classes += " holiday";
        if (isToday) classes += " today";

        const tooltip = holiday ?
            `data-bs-toggle="${holiday.toggle}" data-bs-placement="${holiday.placement}" title="${d.toISOString().split("T")[0]} ${holiday.name}"` :
            "";

        html += `<div class="day-header ${classes}" ${tooltip}>${d.getDate()}</div>`;

    return html;

// 주말 반영 함수
function getHoliday(date) {
    const ymd = date.toISOString().split("T")[0];
    const h = customWeekends.find(h => {
        const start = new Date(h.start_date).toISOString().split("T")[0];
        const end = new Date(h.end_date).toISOString().split("T")[0];
        return start <= ymd && ymd <= end;
    });

    if (h) {
        return {
            ...h,
            toggle: "tooltip",
            placement: "top"
        };
    }
    return null;
}

// 오늘 반영 함수
function isSameDate(d1, d2) {
    return (
        d1.getFullYear() === d2.getFullYear() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getDate() === d2.getDate()
    );
}

    const popupUrl = `/prj/prj_viewer/${a_click_project_id}/`;

    const popup = window.open(
        popupUrl,
        'projectPopup',
        `width=${screen.width},height=${screen.height},top=0,left=0,scrollbars=yes,resizable=yes`
    );

    if (popup) {
        popup.moveTo(0, 0);
        popup.resizeTo(screen.width, screen.height);
        popup.focus();
    }
}


// 드래그 데이트 이벤트
let a_click_start_drag;
let a_click_end_drag;
let instant_plan_start_drag;
let instant_plan_end_drag;
let globalStartDate = null;
let isDraggingPlan = false;
let dragStartIndex = null;
let dragEndIndex = null;
let dayCells = [];

$(document).on('mousedown', '.project-row .day-cell', function (e) {
    if (e.which !== 1) return;  // 좌클릭만 허용 (오른쪽: 3 또는 2, 왼쪽: 1)

    clearDragHighlight();  // 기존 드래그 셀 초기화

    isDraggingPlan = true;
    dayCells = $(this).closest('.project-row').find('.day-cell');
    dragStartIndex = dayCells.index(this);
    dragEndIndex = dragStartIndex;
    highlightDragRange();
});

$(document).on('mouseover', '.project-row .day-cell', function (e) {
    if (!isDraggingPlan) return;
    const currentIndex = dayCells.index(this);
    dragEndIndex = currentIndex;
    highlightDragRange();
});

$(document).on('mouseup', '.project-row .day-cell', function (e) {
    if (!isDraggingPlan) return;
    isDraggingPlan = false;

    const row = $(this).closest('.project-row');
    const isEmptyRow = !row.data('id');
    const start = Math.min(dragStartIndex, dragEndIndex);
    const end = Math.max(dragStartIndex, dragEndIndex);

    const startBase = globalStartDate || new Date();
    const startDate = new Date(startBase);
    const endDate = new Date(startBase);
    startDate.setDate(startBase.getDate() + start);
    endDate.setDate(startBase.getDate() + end);

    const formattedStart = formatDate(startDate);
    const formattedEnd = formatDate(endDate);

    if (isEmptyRow) {
        // 빈줄 드래그 시
        instant_plan_start_drag = formattedStart;
        instant_plan_end_drag = formattedEnd;
        $('#instant_plan_start').val(formattedStart);
        $('#instant_plan_end').val(formattedEnd);
    } else {
        // 일반 태스크 드래그 시
        a_click_start_drag = formattedStart;
        a_click_end_drag = formattedEnd;
    }
});

function highlightDragRange() {
    dayCells.removeClass('drag-selected');
    const start = Math.min(dragStartIndex, dragEndIndex);
    const end = Math.max(dragStartIndex, dragEndIndex);
    for (let i = start; i <= end; i++) {
        dayCells.eq(i).addClass('drag-selected');
    }
}

function clearDragHighlight() {
    $('.day-cell').removeClass('drag-selected');
}

function formatDate(date) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
}

    let api_data = new FormData();
        api_data.append("pk", a_click_id);

$('#date_filter').on('mouseenter', function () {
    $('#date_dropdown').removeClass('d-none');

$('#date_filter').on('mouseleave', function () {
    $('#date_dropdown').addClass('d-none');

function set_date_range(range) {
    const today = new Date();
    let start, end;
    
    if (range === 'yesterday') {
        start = end = new Date(today);
        start.setDate(today.getDate() - 1);
        end.setDate(today.getDate() - 1);
    } else if (range === 'today') {
        start = end = new Date(today);
    } else if (range === 'tomorrow') {
        start = end = new Date(today);
        start.setDate(today.getDate() + 1);
        end.setDate(today.getDate() + 1);
    } else if (range === 'last_week') {
        const day = today.getDay() || 7;
        end = new Date(today);
        end.setDate(today.getDate() - day);
        start = new Date(end);
        start.setDate(end.getDate() - 6);
    } else if (range === 'this_week') {
        const day = today.getDay() || 7;
        start = new Date(today);
        start.setDate(today.getDate() - day + 1);
        end = new Date(start);
        end.setDate(start.getDate() + 6);
    } else if (range === 'next_week') {
        const day = today.getDay() || 7;
        start = new Date(today);
        start.setDate(today.getDate() - day + 8);
        end = new Date(start);
        end.setDate(start.getDate() + 6);
    } else if (range === 'last_month') {
        start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        end = new Date(today.getFullYear(), today.getMonth(), 0);
    } else if (range === 'this_month') {
        start = new Date(today.getFullYear(), today.getMonth(), 1);
        end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    } else if (range === 'next_month') {
        start = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        end = new Date(today.getFullYear(), today.getMonth() + 2, 0);
    }
    
    $('#fr_date').val(formatDate(start));
    $('#to_date').val(formatDate(end));
    a_search_ready();
}


const modalConfigs = [
    { modalId: 'a_create_modal', iconId: 'md_fullscreen_create' },
    { modalId: 'a_update_modal', iconId: 'md_fullscreen_update' },
];

modalConfigs.forEach(({ modalId, iconId }) => {
    const modalElement = document.getElementById(modalId);
    const iconElement = document.getElementById(iconId);

    if (modalElement && iconElement) {
        iconElement.addEventListener('click', () => {
            toggleModalFullscreen(modalElement, iconElement);
        });

        $(`#${modalId}`).on('hidden.bs.modal', () => {
            resetModalFullscreen(modalElement, iconElement);
        });
    }
});

        const modalElement = this.closest('.modal');

        }
    });
});
