<style>
/* 전체 컨테이너 */
#gantt-container {
    overflow-x: auto;
}
#month-header, #timeline, #gantt-table {
    width: fit-content;
}

/* 행 레이아웃 기본 */
.month-row, .date-row, .project-row {
    display: flex;
    min-width: max-content;
    border-bottom: 1px solid #dee2e6;
}

/* 월/일 공통 셀 스타일 */
.month-cell, .day-cell {
    width: 30px;
    min-width: 30px;
    height: 32px;
    line-height: 32px;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
    text-align: center;
    border-right: 1px solid #dee2e6;
    box-sizing: border-box;
    background-color: white;
    transition: background-color 0.2s ease;
}

/* 프로젝트셀 공용 */
.project-cell {
    border-right: 1px solid #dee2e6;
    background-color: white;
    box-sizing: border-box;
    font-size: 0.75rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: inline-block;
    align-items: center;
    padding: 6px 8px;
}

.project-no {
    width: 45px;
    min-width: 45px;
    display: flex;
}

.project-title {
    width: 250px;
    min-width: 250px;
    position: sticky;
    left: 0;
    z-index: 7;
}

.project-info {
    width: 100px;
    min-width: 100px;
}

.project-title.info-header, .project-info.info-header, .project-no.info-header {
    font-weight: 600;
    background-color: #f8f9fa;
    text-align: center;
}

/* 사용자 필드 스크롤시 고정 */
.user_top_fixed {
    position: sticky;
    left: 250px;
    z-index: 7;
    width: 150px;
}

/* day-row : 주말 cell 표시 */
.day-cell.weekend {
    background-color: rgba(255, 182, 193, 0.2);
}

/* day-row : 공휴일 cell 표시 */
.day-cell.holiday {
    background-color: rgba(240, 128, 128, 0.2);
}

/* day-row : 오늘 cell 표시 */
.day-cell.today {
    border-left: 2px solid #ffc107 !important;
    border-right: 2px solid #ffc107 !important;
    z-index: 2;
}

.day-header.day-cell.today {
    background-color: #ffc107 !important;
    z-index: 2;
}

/* day-row : 프로젝트 cell 표시 */
.day-cell.project-active {
    background-color: rgba(135, 206, 250, 0.2) !important;
}

/* day-row : 프로젝트 + 주말(공휴일) cell 표시 */
.day-cell.weekend.project-active, .day-cell.holiday.project-active {
    background-color: rgba(135, 206, 250, 0.4) !important;
}

/* 프로젝트 행 내 셀 */
.project-row .day-cell {
    border-right: 1px solid #dee2e6;
    height: 32px;
}

.project-row {
    position: relative;
    cursor: pointer;
}

.project-row.clicked .project-no, .project-row.clicked .project-title, .project-row.clicked .project-info {
    background-color: rgb(245,245,245) !important;
}

/* 실제일정바 */
.real-bar {
    margin-top: 0.5rem;
    height: 16px;
    background-color: rgba(52, 193, 142, 0.7);
    position: absolute;
    top: 0;
    z-index: 5;
}
.real-container {
    position: relative;
    width: fit-content;
    height: 0;
}

/* 멤버 아바타 그룹 */
.members_avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    vertical-align: middle;
    display: inline-block;
    position: relative;
    border: 1px solid #fff;
    transition: all 0.3s;
}
.members_avatar:hover {
    z-index: 3;
    transform: scale(1.3);
}

/* context-menu 스타일 */
#custom-context-menu {
    min-width: 150px;
    padding: 5px 0;
}
#custom-context-menu .dropdown-item {
    padding: 8px 16px;
    cursor: pointer;
}
#custom-context-menu .dropdown-item:hover {
    background-color: rgba(135, 206, 250, 0.5);
}


/* select2 컨테이너 너비 지정 */
.input_sel2 + .select2-container {
    width: 180px !important;
}

/* select2 선택창 높이 및 스타일 form-select-sm과 동일하게 */
.input_sel2 + .select2-container .select2-selection--single {
    height: 36.53px !important;
    line-height: 32px !important;
    padding: 0.25rem 0.5rem !important;
    border: 1px solid #6c757d !important; /* border-secondary */
    border-radius: 0.2rem !important;
    position: relative;
}

/* 선택된 항목 텍스트 정렬 */
.input_sel2 + .select2-container .select2-selection__rendered {
    line-height: 30px !important;
    padding-left: 0 !important;
}

/* 화살표 위치 조정 */
.input_sel2 + .select2-container .select2-selection__arrow {
    height: 36.53px !important;
    top: 0 !important;
}

/* 클리어버튼 위치 조정 */
.input_sel2 + .select2-container .select2-selection__clear {
    right: 2.5rem !important;
    top: 50%;
    transform: translateY(-50%);
    position: absolute;
    z-index: 10;
}
</style>

function draw_gantt_chart(items) {
    const $gantt = $('#gantt-table');
    $gantt.empty();

    if (!items || items.length === 0) {
        $gantt.append(`
        <div class="text-center text-muted py-5" style="font-size: 26px; margin: 100px 0;">
            <i class="fa-solid fa-exclamation-triangle fa-2x mb-3" style="font-size: 100px;"></i><br>
            검색 조건을 만족하는 프로젝트가 없습니다.<br>검색 조건을 다시 확인해주세요.
        </div>
    `);
        return;
    }

    const dates = getMinMaxDates(items);
    const startDate = dates.startDate;
    const endDate = dates.endDate;
    const dayCount = Math.floor((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    $gantt.append(renderMonthHeader(startDate, dayCount));
    $gantt.append(renderDateHeader(startDate, dayCount, today));

    items.forEach((item, index) => {
        $gantt.append(renderProjectRow(item, startDate, dayCount, today, index + 1));
    });
}

function getMinMaxDates(items) {
    const dates = items.flatMap(i => {
        const starts = [i.plan_start, i.real_start].filter(Boolean).map(d => new Date(d));
        const ends = [i.plan_end, i.real_end].filter(Boolean).map(d => new Date(d));
        return [...starts, ...ends];
    });
    return {
        startDate: new Date(Math.min(...dates)),
        endDate: new Date(Math.max(...dates))
    };
}

function renderMonthHeader(startDate, dayCount) {
    let html = `<div class="month-row">
    <div class="project-cell project-no info-header" style="border-right: none !important;"></div>
    <div class="project-cell project-title info-header" style="border-right: none !important;"></div>
    <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
    <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
    <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
    <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
    <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
    <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
    <div class="project-cell project-info info-header" style="border-right: none !important;"></div>
    <div class="project-cell project-info info-header user_top_fixed" style="border-right: none !important;"></div>
    <div class="project-cell project-info info-header" style="border-right: none !important;"></div>`;
    let span = 0;
    let currentDate = new Date(startDate);
    let prevMonth = currentDate.getMonth();
    let labelDate = new Date(currentDate);

    for (let i = 0; i <= dayCount; i++) {
        const loopMonth = currentDate.getMonth();
        if (loopMonth !== prevMonth || i === dayCount) {
            const label = `${labelDate.getFullYear()}년 ${String(prevMonth + 1).padStart(2)}월`;
            html += `<div class="month-cell" style="width:${span * 30}px;">${label}</div>`;
            span = 0;
            prevMonth = loopMonth;
            labelDate = new Date(currentDate);
        }
        span++;
        currentDate.setDate(currentDate.getDate() + 1);
    }
    html += `</div>`;
    return html;
}

function renderDateHeader(startDate, dayCount, today) {
    let html = `<div class="date-row">
    <div class="project-cell project-no info-header">순번</div>
    <div class="project-cell project-title info-header">프로젝트</div>
    <div class="project-cell project-info info-header">대분류</div>
    <div class="project-cell project-info info-header">중분류</div>
    <div class="project-cell project-info info-header">소분류</div>
    <div class="project-cell project-info info-header">계획시작일</div>
    <div class="project-cell project-info info-header">계획목표일</div>
    <div class="project-cell project-info info-header">잔여일 / 계획일</div>
    <div class="project-cell project-info info-header">진행률</div>
    <div class="project-cell project-info info-header user_top_fixed">매니저</div>
    <div class="project-cell project-info info-header">멤버</div>`;

    for (let i = 0; i < dayCount; i++) {
        const d = new Date(startDate);
        d.setDate(startDate.getDate() + i);

        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const isToday = isSameDate(d, today);
        const holiday = getHoliday(d);

        let classes = "day-cell";
        if (isWeekend) classes += " weekend";
        if (holiday) classes += " holiday";
        if (isToday) classes += " today";

        const tooltip = holiday ?
            `data-bs-toggle="${holiday.toggle}" data-bs-placement="${holiday.placement}" title="${d.toISOString().split("T")[0]} ${holiday.name}"` :
            "";

        html += `<div class="day-header ${classes}" ${tooltip}>${d.getDate()}</div>`;
    }
    html += `</div>`;
    return html;
}

function renderProjectRow(item, startDate, dayCount, today, row_no) {
    const rowHTML = $('<div class="project-row"></div>');
    const progress = parseInt(item.progress) || 0;
    const status = item.status ?? '';
    let progressText = '';

    if (status === '대기') {
        progressText = `대기`;
    } else if (status === '완료') {
        progressText = `완료`;
    } else if (status === '중단') {
        progressText = `중단 (${progress}%)`;
    } else {
        progressText = `진행 (${progress}%)`;
    }

    const progressBarColor =
        status === '완료' ? 'rgba(52, 193, 142, 0.8)' :    // 초록
        status === '중단' ? 'rgba(255, 99, 132, 0.5)' :     // 빨강
        status === '대기' ? 'rgba(108, 117, 125, 0.5)' :    // 회색
        'rgba(0,157,255,0.7)';                           // 파랑 (진행)
    
    let remainingLeft = '-';
    let remainingRight = '-';
    let remainingDisplay = '-';
    
    // 완료 상태는 total_days만 단독 표시
    if (status === '완료' && typeof item.total_days === 'number' && !isNaN(item.total_days)) {
        remainingDisplay = `${item.total_days}일`;
    } else {
        // 남은 일수 (왼쪽)
        if (typeof item.remaining_days === 'number' && !isNaN(item.remaining_days)) {
            if (item.remaining_days >= 0) {
                remainingLeft = `${item.remaining_days}일`;
            } else {
                remainingLeft = `<span style="color: red;">+${Math.abs(item.remaining_days)}일</span>`;
            }
        }
    
        // 전체 일수 (오른쪽)
        if (typeof item.total_days === 'number' && !isNaN(item.total_days)) {
            remainingRight = `${item.total_days}일`;
        }
    
        remainingDisplay = `${remainingLeft} / ${remainingRight}`;
    }

    let manager_html = '-';
    if (item.manager.name) {
        manager_html = `
            <img src="${item.manager.profile_image}" alt="프로필" class="d-none d-md-inline-block"
                 style="width: 20px; height: 20px; border-radius: 50%; vertical-align: middle; display: inline-block;">
            <span style="margin-left: 2px; display: inline-block; vertical-align: middle;">
                ${item.manager.name} ${item.manager.job_level || ''}</span>
            </span>
        `;
    }
    
    let members_html = '-';
    if (item.members && item.members.length > 0) {
        members_html = '';
        let overlap = item.members.length >= 1;
        item.members.some(function(member, index) {   // ← some() 사용
            if (index >= 5) {  // 6번째부터는 +N 하나만 표시
                const remain = item.members.length - 5;
                let hidden_members = item.members.slice(5).map(m => `${m.name} ${m.job_level || ''}`).join('<br>');
                
                members_html += `
                    <div class="members_avatar bg-warning text-center"
                         style="display: inline-block; width: 20px; height: 20px; font-size: 9px; border-radius:50%; padding: 2px; margin-left:-11px;"
                         data-bs-toggle="tooltip" data-bs-placement="top" title='<div class="text-start">${hidden_members}</div>'>
                        +${remain}
                    </div>
                `;
                return true;  // 반복 중단 (some은 true면 break)
            }
            let marginStyle = overlap && index > 0 ? 'margin-left: -11px;' : 'margin-right: 0;';
            members_html += `
                <img src="${member.profile_image}" alt="${member.name}" class="members_avatar"
                     data-bs-toggle="tooltip" data-bs-placement="top" title="${member.name} ${member.job_level || ''}"
                     style="${marginStyle}">
            `;
        });
    }

    const projectInfo = `
            <div class="project-cell project-no">${row_no}</div>
            <div class="project-cell project-title">${item.title}</div>
            <div class="project-cell project-info">${item.cat1_name || '-'}</div>
            <div class="project-cell project-info">${item.cat2_name || '-'}</div>
            <div class="project-cell project-info">${item.cat3_name || '-'}</div>
            <div class="project-cell project-info">${item.plan_start || '-'}</div>
            <div class="project-cell project-info">${item.plan_end || '-'}</div>
            <div class="project-cell project-info">${remainingDisplay}</div>
            <div class="project-cell project-info d-flex align-items-center">
                <div class="progress-container" style="position: relative; background-color: rgba(135,206,250,0.2); border-radius: 4px; height: 16px; width: 100%;">
                    <div class="progress-bar" style="width: ${status === '완료' ? '100%' : progress + '%'}; background-color: ${progressBarColor}; height: 14px; border-radius: 4px; box-shadow: 0 2px 4px 0 ${progressBarColor}; transition: width 0.8s ease;"></div>
                    <span class="progress-text" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 0.65rem; color: #222; z-index: 2;">${progressText}</span>
                </div>
            </div>
            <div class="project-cell project-info user_top_fixed">${manager_html}</div>
            <div class="project-cell project-info">${members_html}</div>
        `;
    rowHTML.append(projectInfo);

    rowHTML.attr({
        'data-id': item.id,
        'data-code': item.code,
        'data-title': item.title,
        'data-manager_id': item.manager?.id ?? '',
        'data-manager_name': item.manager?.name ?? '',
        'data-customer': item.customer ?? '',
        'data-cat1_id': item.cat1_id ?? '',
        'data-cat1_name': item.cat1_name ?? '',
        'data-cat2_id': item.cat2_id ?? '',
        'data-cat2_name': item.cat2_name ?? '',
        'data-cat3_id': item.cat3_id ?? '',
        'data-cat3_name': item.cat3_name ?? '',
        'data-plan_start': item.plan_start ?? '',
        'data-plan_end': item.plan_end ?? '',
        'data-progress': item.progress ?? 0,
        'data-status': item.status ?? '',
        'data-detail': item.detail ?? '',
        'data-desc1': item.desc1 ?? '',
        'data-desc2': item.desc2 ?? '',
        'data-desc3': item.desc3 ?? '',
    });
    
    const planStart = item.plan_start ? new Date(item.plan_start) : null;
    const planEnd = item.plan_end ? new Date(item.plan_end) : null;
    const realStart = item.real_start ? new Date(item.real_start) : null;
    const realEnd = item.real_end ? new Date(item.real_end) : null;

    const realContainer = $('<div class="real-container"></div>');
    if (realStart && realEnd) {
        const offset = (realStart - startDate) / (1000 * 60 * 60 * 24);
        const length = (realEnd - realStart) / (1000 * 60 * 60 * 24) + 1;
        const realBar = $('<div class="real-bar"></div>');
        realBar.css('width', `${length * 30}px`);
        realBar.css('left', `${offset * 30}px`);
        realBar.css('background-color', progressBarColor);
        realBar.attr({
            'title': `
                <div class="text-start">
                    [${item.code}]<br>
                    · 프로젝트: ${item.title}<br>
                    · 계획 일정: ${item.plan_start} ~ ${item.plan_end} ${item.plan_time_sum? `(총 ${item.plan_time_sum}시간)`:''}<br>
                    · 실제 일정: ${item.real_start} ~ ${item.real_end} ${item.real_time_sum? `(총 ${item.real_time_sum}시간)`:''}<br>
                    · 상태: ${item.status} ${item.progress? `(${item.progress}%)`:''}<br>
                    · 프로젝트 매니저: ${item.manager? item.manager.name: '-'} ${item.manager? item.manager.job_level:''}
                </div>
            `,
            'data-bs-toggle': 'tooltip'
        });
        realContainer.append(realBar);
    }
    rowHTML.append(realContainer);

    for (let i = 0; i < dayCount; i++) {
        const currentDate = new Date(startDate);
        currentDate.setDate(startDate.getDate() + i);

        const holiday = getHoliday(currentDate);
        const isWeekend = currentDate.getDay() === 0 || currentDate.getDay() === 6;
        const isToday = isSameDate(currentDate, today);
        const isInPlan = planStart && planEnd && currentDate >= planStart && currentDate <= planEnd;

        const cell = $('<div class="day-cell"></div>');
        if (isWeekend) cell.addClass('weekend');
        if (holiday) cell.addClass('holiday');
        if (isToday) cell.addClass('today');
        if (isInPlan) cell.addClass('project-active');
        cell.attr('title', `${item.title} (계획: ${item.plan_start} ~ ${item.plan_end}, 총 ${item.total_days}일)`);

        rowHTML.append(cell);
    }

    // 프로젝트행 좌클릭 clicked 정의
    rowHTML.on('click', function () {
        $('.project-row').removeClass('clicked');
        $(this).addClass('clicked');

        a_click_id = $(this).data("id");
        a_click_code = $(this).data("code");
        a_click_title = $(this).data("title");
        a_click_manager_id = $(this).data("manager_id");
        a_click_manager_name = $(this).data("manager_name");
        a_click_cat1_id = $(this).data("cat1_id");
        a_click_cat1_name = $(this).data("cat1_name");
        a_click_cat2_id = $(this).data("cat2_id");
        a_click_cat2_name = $(this).data("cat2_name");
        a_click_cat3_id = $(this).data("cat3_id");
        a_click_cat3_name = $(this).data("cat3_name");
        a_click_plan_start = $(this).data("plan_start");
        a_click_plan_end = $(this).data("plan_end");
        a_click_progress = $(this).data("progress");
        a_click_status = $(this).data("status");
        a_click_detail = $(this).data("detail");
        a_click_desc1 = $(this).data("desc1");
        a_click_desc2 = $(this).data("desc2");
        a_click_desc3 = $(this).data("desc3");
        a_click_customer = $(this).data("customer");
    });

    // 프로젝트행 더블클릭 팝업 오픈
    rowHTML.on('dblclick', function () {
        $('.project-row').removeClass('clicked');
        $(this).addClass('clicked');
        
        a_click_id = $(this).data("id");
        a_modal_popup_open();
    });

    // 프로젝트행 우클릭 메뉴 오픈
    rowHTML.on('contextmenu', function (e) {
        e.preventDefault();

        $('.project-row').removeClass('clicked');
        $(this).addClass('clicked');

        $('#custom-context-menu').css({
            display: 'block',
            left: e.pageX,
            top: e.pageY
        });

        a_click_id = $(this).data("id");
        a_click_code = $(this).data("code");
        a_click_title = $(this).data("title");
        a_click_manager_id = $(this).data("manager_id");
        a_click_manager_name = $(this).data("manager_name");
        a_click_customer = $(this).data("customer");
        a_click_cat1_id = $(this).data("cat1_id");
        a_click_cat1_name = $(this).data("cat1_name");
        a_click_cat2_id = $(this).data("cat2_id");
        a_click_cat2_name = $(this).data("cat2_name");
        a_click_cat3_id = $(this).data("cat3_id");
        a_click_cat3_name = $(this).data("cat3_name");
        a_click_plan_start = $(this).data("plan_start");
        a_click_plan_end = $(this).data("plan_end");
        a_click_progress = $(this).data("progress");
        a_click_status = $(this).data("status");
        a_click_detail = $(this).data("detail");
        a_click_desc1 = $(this).data("desc1");
        a_click_desc2 = $(this).data("desc2");
        a_click_desc3 = $(this).data("desc3");

        return false;
    });

    // 다른 곳 클릭 시 메뉴 숨기기
    $(document).on('click', function () {
        $('#custom-context-menu').hide();
    });

    return rowHTML;
}

// 주말 반영 함수
function getHoliday(date) {
    const ymd = date.toISOString().split("T")[0];
    const h = customWeekends.find(h => {
        const start = new Date(h.start_date).toISOString().split("T")[0];
        const end = new Date(h.end_date).toISOString().split("T")[0];
        return start <= ymd && ymd <= end;
    });

    if (h) {
        return {
            ...h,
            toggle: "tooltip",
            placement: "top"
        };
    }
    return null;
}

// 오늘 반영 함수
function isSameDate(d1, d2) {
    return (
        d1.getFullYear() === d2.getFullYear() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getDate() === d2.getDate()
    );
}

function a_modal_popup_open() {
    if (!a_click_id) {
        alert("프로젝트가 선택되지 않았습니다.");
        return;
    }

    const popupUrl = `/prj/prj_viewer/${a_click_id}/`;

    const popup = window.open(
        popupUrl,
        'projectPopup',
        `width=${screen.width},height=${screen.height},top=0,left=0,scrollbars=yes,resizable=yes`
    );

    if (popup) {
        popup.moveTo(0, 0);
        popup.resizeTo(screen.width, screen.height);
        popup.focus();
    }
}


const modalConfigs = [
    { modalId: 'a_create_modal', iconId: 'md_fullscreen_create' },
    { modalId: 'a_update_modal', iconId: 'md_fullscreen_update' },
];

modalConfigs.forEach(({ modalId, iconId }) => {
    const modalElement = document.getElementById(modalId);
    const iconElement = document.getElementById(iconId);

    if (modalElement && iconElement) {
        iconElement.addEventListener('click', () => {
            toggleModalFullscreen(modalElement, iconElement);
        });

        $(`#${modalId}`).on('hidden.bs.modal', () => {
            resetModalFullscreen(modalElement, iconElement);
        });
    }
});

document.querySelectorAll('.modal-header').forEach(header => {
    header.addEventListener('dblclick', function () {
        const modalElement = this.closest('.modal');
        const iconElement = this.querySelector('.fa-expand, .fa-compress');
        if (modalElement && iconElement) {
            toggleModalFullscreen(modalElement, iconElement);
        }
    });
});
</script>
